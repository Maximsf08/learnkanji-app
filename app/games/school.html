/* The app's frame on every game page: the colours, type, header, buttons, cards, dialogs, tabs and
   settings of the app itself (src/css/app.css), in light and dark. The theme follows the app's
   Settings → Theme (games/core.js sets data-theme on <html>, like the app).
   A game's own stylesheet (its app.html) comes after this one. It keeps only its play area (the river,
   the kitchen, the map…), drawn with the scene colours below, which are made from the app's palette. */
:root {
  /* the app's tokens (src/css/app.css) */
  --paper: #f4f6f1;
  --paper-2: #e8ede5;
  --card: #fbfcf9;
  --ink: #1d2420;
  --ink-2: #4f5a54;
  --ink-3: #87938c;
  --rule: #cfdcd4;
  --grid: #7aa894;
  --grid-soft: #b7d0c3;
  --accent: #1a6a53;
  --accent-ink: #f4f6f1;
  --accent-soft: #d5e8dd;
  --red: #cf3427;
  --red-soft: #f6dcd8;
  --warn: #c56c12;
  --shadow: 0 1px 2px rgba(29, 36, 32, .06), 0 6px 18px rgba(29, 36, 32, .07);
  --font-jp: "Klee One", "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "Yu Kyokasho", "YuKyokasho", "Hiragino Mincho ProN", serif;
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --topbar: 56px;
  /* what the games add: coins and stars, the dialog shade, a lifted card */
  --gold: #c9961a;
  --gold-soft: #f5e8c2;
  --gold-ink: #8a6508;   /* gold for text: readable on the cards */
  --scrim: rgba(23, 31, 27, .42);
  --shadow-lg: 0 2px 6px rgba(29, 36, 32, .08), 0 18px 44px rgba(29, 36, 32, .2);
  /* the scenes: sky, hills, water, sand, wood, lanterns, made from the app's greens, its red and its amber */
  --sc-sky: #e2ebe5;
  --sc-sky-2: #cfe1d7;
  --sc-cloud: #fbfcf9;
  --sc-hill: #b7d0c3;
  --sc-hill-2: #7aa894;
  --sc-tree: #3f7d66;
  --sc-deep: #1a6a53;
  --sc-water: #a7cabc;
  --sc-water-2: #6c9e8b;
  --sc-foam: #f4f6f1;
  --sc-sand: #ece4d3;
  --sc-sand-2: #dccfb3;
  --sc-wood: #d9bf9a;
  --sc-wood-2: #b08a5c;
  --sc-wood-3: #6e5236;
  --sc-stone: #c3cbc5;
  --sc-stone-2: #8e9892;
  --sc-red: #cf3427;
  --sc-red-2: #a8291f;
  --sc-sun: #e9a23b;
  --sc-gold: #d9a521;
  --sc-ink: #1d2420;
  --sc-line: #cfdcd4;
  /* names the games' shared pieces use */
  --font-kanji: var(--font-jp);
  --font-body: var(--font-ui);
  --line: var(--rule);
  --act: var(--accent);
  --good: var(--accent);
  --bad: var(--red);
  /* the game's own colour (games/registry.js), set by games/core.js */
  --gc: #1a6a53;
  --gi: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b2622; --paper-2: #152019; --card: #22302a;
    --ink: #edf3ec; --ink-2: #b2c1b8; --ink-3: #7d8f86;
    --rule: #33463e; --grid: #5e8b77; --grid-soft: #3c584c;
    --accent: #8dd5b9; --accent-ink: #10201a; --accent-soft: #29433a;
    --red: #ff8e7e; --red-soft: #4a2d29; --warn: #f2c34f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .25);
    --gold: #e6bd4f; --gold-soft: #3a3322; --gold-ink: #e6bd4f; --scrim: rgba(4, 8, 6, .58);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 18px 44px rgba(0, 0, 0, .45);
    --sc-sky: #1f2b26; --sc-sky-2: #263630; --sc-cloud: #34463e; --sc-hill: #2d4239; --sc-hill-2: #3f5d50;
    --sc-tree: #4f8670; --sc-deep: #2f6a58; --sc-water: #2b4a40; --sc-water-2: #3f6b5c; --sc-foam: #a9c7ba;
    --sc-sand: #37352d; --sc-sand-2: #45423a; --sc-wood: #5a4a36; --sc-wood-2: #47392a; --sc-wood-3: #2c2219;
    --sc-stone: #3c4943; --sc-stone-2: #5b6a63; --sc-red: #e0604f; --sc-red-2: #b8473a; --sc-sun: #f0c25e;
    --sc-gold: #e6bd4f; --sc-ink: #edf3ec; --sc-line: #33463e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b2622; --paper-2: #152019; --card: #22302a;
  --ink: #edf3ec; --ink-2: #b2c1b8; --ink-3: #7d8f86;
  --rule: #33463e; --grid: #5e8b77; --grid-soft: #3c584c;
  --accent: #8dd5b9; --accent-ink: #10201a; --accent-soft: #29433a;
  --red: #ff8e7e; --red-soft: #4a2d29; --warn: #f2c34f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .25);
  --gold: #e6bd4f; --gold-soft: #3a3322; --gold-ink: #e6bd4f; --scrim: rgba(4, 8, 6, .58);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 18px 44px rgba(0, 0, 0, .45);
  --sc-sky: #1f2b26; --sc-sky-2: #263630; --sc-cloud: #34463e; --sc-hill: #2d4239; --sc-hill-2: #3f5d50;
  --sc-tree: #4f8670; --sc-deep: #2f6a58; --sc-water: #2b4a40; --sc-water-2: #3f6b5c; --sc-foam: #a9c7ba;
  --sc-sand: #37352d; --sc-sand-2: #45423a; --sc-wood: #5a4a36; --sc-wood-2: #47392a; --sc-wood-3: #2c2219;
  --sc-stone: #3c4943; --sc-stone-2: #5b6a63; --sc-red: #e0604f; --sc-red-2: #b8473a; --sc-sun: #f0c25e;
  --sc-gold: #e6bd4f; --sc-ink: #edf3ec; --sc-line: #33463e;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
[lang="ja"] { font-family: var(--font-jp); }
.art-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- header: the app's top bar, with the game's emblem ---------- */
.bar {
  position: relative; z-index: 4500; flex: none; display: flex; align-items: center; gap: 10px; min-width: 0;
  min-height: calc(var(--topbar) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-block-end: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--paper); color: var(--ink); border-bottom: 1px solid var(--rule); box-shadow: none;
  user-select: none; -webkit-user-select: none;
}
.bar::before, .bar::after { content: none; }
.brand {
  display: flex; align-items: center; gap: 10px; min-width: 0; padding: 4px 10px 4px 4px; border: 0; border-radius: 10px;
  background: transparent; color: inherit; text-align: left; cursor: pointer;
}
.brand:hover { background: var(--paper-2); }
.brand .gi { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--gc); color: var(--gi); }
.brand .gi svg { width: 24px; height: 24px; }
.brand h1 { margin: 0; font: 600 18px/1.2 var(--font-display); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.brand .sub { min-width: 0; color: var(--ink-2); font: 400 14px/1.2 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.bar .pill {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; flex: none; border: 0; border-radius: 15px;
  background: var(--paper-2); color: var(--ink); font: 600 14px/1 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: none;
}
.bar .pill svg { width: 17px; height: 17px; flex: none; }
.iconbtn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; padding: 0; border-radius: 9px; border: 0;
  background: transparent; color: var(--ink-2); cursor: pointer;
}
.iconbtn:hover { background: var(--paper-2); color: var(--ink); border-color: transparent; }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  .bar { gap: 4px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .brand { gap: 8px; padding-right: 6px; }
  .brand .sub { display: none; }
  .brand h1 { font-size: 17px; }
  .bar .pill { height: 28px; padding: 0 9px; font-size: 13.5px; }
}
/* On a phone the header keeps the back button, the game, its counters, the kanji and settings; the
   "how to play" button gives way (the game's name opens it too). */
@media (max-width: 520px) { .bar .wide-only { display: none; } }
/* and a narrow phone drops "Kanji" from the name, like the app's list of games */
@media (max-width: 420px) { .brand h1 .pre { display: none; } }

/* ---------- pages over the game: welcome, results, shop, collection, settings ---------- */
.screen {
  position: absolute; inset: var(--barh, calc(var(--topbar) + env(safe-area-inset-top, 0px))) 0 0 0; z-index: 4000; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 20px max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper);
}
.panel { background: var(--card); color: var(--ink); border: 0; border-radius: 14px; box-shadow: var(--shadow); padding: 22px 24px; }
.panel h2 { margin: 0; font: 650 24px/1.2 var(--font-display); letter-spacing: 0; text-wrap: balance; }
.panel h3 { margin: 0; font: 650 17px/1.3 var(--font-display); letter-spacing: 0; }
.panel p { margin: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
.hero h1 { margin: 0; font: 650 clamp(26px, 3.4vw, 32px)/1.15 var(--font-display); letter-spacing: 0; text-wrap: balance; }
.eyebrow { margin: 0; font: 600 12px/1.3 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
@media (max-width: 640px) {
  .panel { padding: 18px 16px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font: 600 15px/1.2 var(--font-ui); letter-spacing: 0; text-decoration: none; cursor: pointer; box-shadow: none;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.btn:hover { border-color: var(--grid); background: var(--card); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
.btn.quiet, .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover, .btn.ghost:hover { background: var(--paper-2); border-color: transparent; color: var(--ink); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn.big { min-height: 50px; padding: 0 24px; border-radius: 12px; font: 650 17px/1.1 var(--font-display); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn:disabled, .btn[disabled] { opacity: .45; cursor: default; filter: none; }
.btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- dialogs ---------- */
.modal {
  position: absolute; inset: 0; z-index: 5000; display: grid; place-items: center; background: var(--scrim);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal .panel { width: min(600px, 100%); max-height: 100%; overflow-y: auto; box-shadow: var(--shadow-lg); animation: gc-rise .25s ease both; }
@keyframes gc-rise { from { transform: translateY(10px); opacity: 0; } }

/* ---------- tabs (the app's segmented switch), settings rows and switches ---------- */
.tabs { display: inline-flex; flex-wrap: wrap; align-self: start; justify-self: start; gap: 2px; max-width: 100%; padding: 3px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper-2); }
.tab {
  min-height: 34px; margin: 0; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2);
  font: 600 14px/1.2 var(--font-ui); cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"], .tab.on { background: var(--card); color: var(--ink); border: 0; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.tab span { margin-left: 4px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .tab { padding: 0 9px; font-size: 13.5px; } }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.setting:last-child { border-bottom: 0; }
.setting .lbl { font: 600 15.5px/1.3 var(--font-ui); }
.setting .lbl span { display: block; margin-top: 2px; font: 400 13.5px/1.45 var(--font-ui); color: var(--ink-2); max-width: 58ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper-2); }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font: 600 14px/1.2 var(--font-ui); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
@media (max-width: 640px) { .setting { grid-template-columns: minmax(0, 1fr); } .setting:has(> .switch) { grid-template-columns: minmax(0, 1fr) auto; } }
.switch { position: relative; flex: none; width: 50px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: var(--rule); cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); border: 0; }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--card); }

/* ---------- the collection: kanji by level of the app ---------- */
.lvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.lvhead h3 { margin: 0; font: 650 17px/1.3 var(--font-display); }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.kc {
  display: grid; justify-items: center; gap: 4px; min-width: 0; padding: 12px 6px 10px; border-radius: 12px; border: 1px solid var(--rule);
  background: var(--card); color: var(--ink); text-align: center; cursor: pointer; box-shadow: none;
}
.kc:hover { border-color: var(--grid); box-shadow: none; }
.kc .g { font: 400 40px/1.1 var(--font-jp); }
.kc .m { font-size: 13px; line-height: 1.25; color: var(--ink-2); overflow-wrap: anywhere; }
.kc.new, .kc.locked { cursor: default; background: transparent; border-style: dashed; color: var(--ink-3); box-shadow: none; }
.kc.new:hover, .kc.locked:hover { border-color: var(--rule); }
.kc.new .g { color: var(--ink-3); font: 600 34px/1.25 var(--font-display); }
.kc.locked .g { opacity: .4; }
.lv { display: inline-flex; gap: 3px; }
.lv i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--grid); }
.lv i.on { background: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
@media (max-width: 640px) {
  .kgrid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .kc .g { font-size: 32px; }
}

/* ---------- small pieces ---------- */
.chipsrow { display: flex; flex-wrap: wrap; gap: 6px; }
.chipsrow > span, .chipsrow > button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 0; border-radius: 14px; background: var(--paper-2); color: var(--ink); font-size: 14px; }
.chipsrow .g { font: 400 18px/1.1 var(--font-jp); }
.chipsrow > button { cursor: pointer; }
.chipsrow > button:hover { background: var(--accent-soft); }
.lines { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.lines > div { display: flex; justify-content: space-between; gap: 20px; max-width: 380px; padding: 5px 0; border-bottom: 1px dashed var(--rule); }
.lines > div.total { border-bottom: 0; font-weight: 650; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border: 0; border-radius: 12px; background: var(--paper-2); color: var(--ink-2); font: 600 12.5px/1 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.gold { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--gold-soft); color: var(--ink); font-size: 15px; }
.newk { display: inline-block; padding: 1px 8px; border-radius: 9px; background: var(--red-soft); color: var(--red); font: 600 12px/1.5 var(--font-ui); }
@media (prefers-reduced-motion: reduce) {
  .modal .panel { animation-duration: .01s; }
}

/* Picture cards shared by the kanji games (art from Kanji Valley). The cards always use the day
   palette, so they read the same on light and dark pages. */
.card, .art-defs {
  --s-paper: #f3f2ea; --s-key: #22314f; --s-sky-top: #2a5591; --s-sky-mid: #9fbbd9; --s-dawn: #f2dcc6;
  --s-mtn-top: #4c6c90; --s-mtn-base: #aebfd0; --s-snow: #fbfbf6; --s-meadow-a: #d3dfab; --s-meadow-b: #8fae5c;
  --s-river-a: #22528e; --s-river-b: #6e9bd0; --s-river-lt: #8fb4de; --s-foam: #f5f7fa; --s-field: #a3c78f; --s-ridge: #8f8b58;
  --s-grass: #b9cf8a; --s-seed: #3d6b2c; --s-leaf: #5f9442; --s-leaf-hi: #8cbd5e; --s-soil: #8d6240; --s-furrow: #6b4529;
  --s-path: #e2d2ab; --s-path-dk: #cbb88c; --s-fire-a: #d8462a; --s-fire-b: #f3b33b; --s-sun: #cf412a; --s-sun-core: #e86a3f;
  --s-moon: #f1d98f; --s-ray: #e0a52c; --s-night: #1e2d50; --s-star: #f4ead0; --s-rock: #7d8796; --s-gold: #e7b52a;

/* Shared pieces of every game page, in the app's style (games/frame.css has the tokens): the kanji card,
   the read-aloud button, the unlock offer, and the journey's notes and letters. */
.gc-card { display: grid; gap: 14px; }
.gc-reveal { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 20px; align-items: center; }
/* The square keeps the day colours in both themes, like the picture cards in it. */
.gc-sq { width: 100%; max-width: 190px; aspect-ratio: 1; border-radius: 10px; background: #fbfcf9; box-shadow: inset 0 0 0 1px #cfdcd4; overflow: hidden; }
.gc-sq svg { width: 100%; height: 100%; display: block; }
.gc-sq .strokes path { fill: none; stroke: #1d2420; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.gc-sq.plain .strokes path { stroke-width: 4.6; }
.gc-sq .gc-grid { fill: none; stroke: #b7d0c3; stroke-width: .8; stroke-dasharray: 3 3; }
.gc-sq .pic { transition: opacity .7s ease; }
.gc-facts { display: grid; gap: 7px; min-width: 0; }
.gc-mean { margin: 0; font: 650 clamp(21px, 3vw, 26px)/1.2 var(--font-display); text-wrap: balance; }
.gc-mean [lang="ja"] { font-weight: 600; margin-right: 6px; }
.gc-rd { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; font: 400 20px/1.3 var(--font-jp); }
.gc-rd .on { color: var(--ink-2); }
.gc-ro { font-size: 13.5px; color: var(--ink-3); }
.gc-note { margin: 0; font-size: 14px; color: var(--ink-2); }
.gc-words { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gc-words div { display: grid; gap: 0; padding: 8px 10px; border-radius: 10px; background: var(--paper-2); }
.gc-words b { font: 400 21px/1.25 var(--font-jp); }
.gc-words span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.gc-words span [lang="ja"] { font-size: 14px; color: var(--ink); }
.gc-say { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; padding: 0; border-radius: 50%; border: 1px solid var(--rule); background: var(--card); color: var(--accent); cursor: pointer; }
.gc-say:hover { border-color: var(--grid); }
.gc-say svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gc-back { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; padding: 0; border-radius: 9px; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.gc-back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gc-back:hover { background: var(--paper-2); color: var(--ink); }
@media (max-width: 720px) {
  .gc-reveal { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .gc-facts { justify-items: center; }
  .gc-rd { justify-content: center; }
  .gc-sq { max-width: 170px; }
}
/* The unlock offer (Store edition): the app's unlock band. */
.gc-offer { display: grid; gap: 8px; padding: 16px 18px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--ink); }
.gc-offer b { font: 650 17px/1.3 var(--font-display); }
.gc-offer p { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 70ch; }
/* The journey on every game page: notes at the top, and the welcome and stop letters, as the app's cards. */
#gc-jl { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 9000;
  display: grid; gap: 8px; justify-items: center; width: min(440px, calc(100vw - 24px)); pointer-events: none; }
.gc-jt { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  box-shadow: var(--shadow-lg); font: 600 14px/1.3 var(--font-ui);
  opacity: 0; transform: translateY(-10px); transition: opacity .25s, transform .25s; pointer-events: none; max-width: 100%; }
.gc-jt.on { opacity: 1; transform: none; }
.gc-jt.on.act, .gc-jt.on [data-x] { pointer-events: auto; cursor: pointer; }
.gc-jt b { display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 7px; background: var(--red); color: var(--card);
  font: 600 16px/1 var(--font-jp); transform: rotate(-4deg); }
.gc-jt span { min-width: 0; }
.gc-jt.act span { text-decoration: underline; text-underline-offset: 3px; }
.gc-jt [data-x] { border: 0; background: transparent; color: var(--ink-3); font-size: 20px; line-height: 1; padding: 2px 6px; margin-left: auto; }
.gc-jm { position: fixed; inset: 0; z-index: 9001; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.gc-jm-card { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px 18px; border-radius: 16px;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow-lg); font: 400 15px/1.5 var(--font-ui); }
.gc-jm-card h2 { margin: 2px 0 10px; font: 650 22px/1.25 var(--font-display); }
.gc-jm-card h2 span { font: 400 18px/1 var(--font-jp); color: var(--ink-3); margin-left: 6px; }
.gc-jm-card p { margin: 0 0 10px; color: var(--ink-2); }
.gc-jm-card .gc-jk { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.gc-jm-card .gc-jgoal, .gc-jm-card .gc-jnext { padding: 10px 14px; border-radius: 10px; background: var(--paper-2); color: var(--ink); }
.gc-jm-card .gc-jrew { font-weight: 650; color: var(--accent); }
.gc-jb { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.gc-jb button { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--font-ui); cursor: pointer; }
.gc-jb button:hover { filter: brightness(1.06); }
.gc-jb button.gc-jsec { background: var(--card); color: var(--ink); border-color: var(--rule); }
.gc-jb button.gc-jsec:hover { filter: none; border-color: var(--grid); }
.gc-goaldone { font-size: 14px; color: var(--ink-2); }
.gc-goaldone a { color: var(--accent); font-weight: 600; }
/* A reading offered as an answer, with its romaji under it. */
.gc-ch { display: inline-grid; justify-items: center; line-height: 1.2; }
.gc-ro2 { font: 500 12px/1.3 var(--font-ui); letter-spacing: .01em; opacity: .75; }

/* ---------- playing: the welcome hub, the results of a round, combos and effects (games/core.js) ---------- */
/* The hub: a game's welcome page. */
.gc-hub { display: grid; gap: 14px; width: min(980px, 100%); margin: 0 auto; }
/* a game's own panel rules (centred, narrower) do not apply inside the hub */
.gc-hub .panel, .screen .gc-hub .panel, .modal .gc-hub .panel { margin: 0; max-width: none; width: auto; justify-self: stretch; }
.gc-hub-top { display: grid; gap: 18px; }
.gc-hub-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.gc-hub-em { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 20px; background: var(--gc); color: var(--gi);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .16), var(--shadow); }
.gc-hub-em svg { width: 54px; height: 54px; }
.gc-hub-name h1 { margin: 2px 0 4px; font: 650 clamp(28px, 4vw, 38px)/1.1 var(--font-display); letter-spacing: 0; }
.gc-pitch { margin: 0; color: var(--ink-2); font-size: 16px; max-width: 58ch; text-wrap: pretty; }
.gc-hub-art { justify-self: end; }
.gc-hub-play { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.gc-hub-play .btn.big { min-width: 180px; }
.gc-hub-play .btn.big svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.gc-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 0; }
.gc-chips div { padding: 10px 14px; border-radius: 12px; background: var(--paper-2); }
.gc-chips dt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.gc-chips dd { margin: 2px 0 0; font: 650 22px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.gc-chips dd small { font-size: 14px; font-weight: 500; color: var(--ink-3); }
.gc-first { margin: 0; font-size: 14px; color: var(--ink-2); }
.gc-hub-cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
.gc-hub .panel { padding: 16px 20px; }
.gc-hub .gc-hub-top.panel { padding: 22px 24px; }
.gc-hub .eyebrow { margin-bottom: 8px; }
.gc-hub-name .eyebrow { margin-bottom: 0; }
.gc-dline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; font-weight: 600; }
.gc-dline > b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); font-size: 16px; }
.gc-dline > svg { width: 30px; height: 30px; padding: 5px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); fill: none; stroke: currentColor; stroke-width: 2.2; }
.gc-dline small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.gc-dline em { font-style: normal; font-weight: 700; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.gc-daily.done .gc-dline em { color: var(--accent); }
.gc-xp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.gc-rank { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 650; }
.gc-rank b { font: 600 22px/1 var(--font-jp); color: var(--gc); }
.gc-xpbar { display: block; height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.gc-xpbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 60%, var(--accent))); transition: width .9s cubic-bezier(.2,.7,.3,1); }
.gc-xpn { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.gc-missions ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.gc-missions li { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto auto; gap: 12px; align-items: center; font-size: 14.5px; }
.gc-mbar { display: block; height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.gc-mbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.gc-missions small { color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.gc-missions em { font-style: normal; font-weight: 700; color: var(--gold-ink); font-size: 13px; min-width: 56px; text-align: right; }
.gc-howto summary { cursor: pointer; font-weight: 650; list-style: none; display: flex; align-items: center; gap: 8px; }
.gc-howto summary::-webkit-details-marker { display: none; }
.gc-howto summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--paper-2); color: var(--ink-2); font-weight: 700; }
.gc-howto[open] summary::before { content: "−"; }
.gc-howto-b { display: grid; gap: 10px; margin-top: 12px; color: var(--ink-2); font-size: 14.5px; max-width: 72ch; }
.gc-howto-b p { margin: 0; }
@media (max-width: 760px) {
  .gc-hub-cols { grid-template-columns: minmax(0, 1fr); }
  .gc-hub-head { grid-template-columns: auto minmax(0, 1fr); }
  .gc-hub-art { display: none; }
  .gc-missions li { grid-template-columns: minmax(0, 1fr) auto; }
  .gc-missions .gc-mbar { grid-column: 1 / -1; grid-row: 2; }
  .gc-missions em { display: none; }
}
@media (max-width: 420px) { .gc-hub-em { width: 58px; height: 58px; border-radius: 16px; } .gc-hub-em svg { width: 42px; height: 42px; } }

/* The results of a round. */
.gc-res { position: fixed; inset: 0; z-index: 8000; display: grid; place-items: center; background: var(--scrim);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gc-res .panel { width: min(520px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 14px; text-align: center; box-shadow: var(--shadow-lg); animation: gc-rise .25s ease both; }
.gc-res h2 { margin: 0; }
.gc-res .eyebrow { margin: 0 0 -8px; }
.gc-stars { display: flex; justify-content: center; gap: 6px; margin-top: 2px; }
.gc-star svg { width: 52px; height: 52px; fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
.gc-star:nth-child(2) svg { width: 62px; height: 62px; margin-top: -8px; }
.gc-star.on svg { fill: var(--gold); stroke: color-mix(in srgb, var(--gold) 70%, black); }
.gc-star.wait svg { fill: var(--paper-2); stroke: var(--rule); }
.gc-star.pop { animation: gc-star .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes gc-star { from { transform: scale(.2) rotate(-25deg); } to { transform: none; } }
.gc-goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; justify-self: center; }
.gc-goals li { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 14.5px; }
.gc-goals li.ok { color: var(--ink); }
.gc-goals li > i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); flex: none; }
.gc-goals li > svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.gc-score { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.gc-score b { font: 650 46px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.gc-score span { color: var(--ink-2); font-weight: 600; }
.gc-score em { font-style: normal; padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; font-size: 13px; animation: gc-star .5s .9s cubic-bezier(.3,1.6,.5,1) both; }
.gc-score small { color: var(--ink-3); font-size: 13px; }
.gc-rstats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 0; }
.gc-rstats div { padding: 7px 12px; border-radius: 10px; background: var(--paper-2); min-width: 92px; }
.gc-rstats dt { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.gc-rstats dd { margin: 1px 0 0; font: 650 17px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.gc-uplist { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; }
.gc-uplist > span { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.gc-uplist b { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); font: 400 24px/1 var(--font-jp); }
.gc-uplist b small { position: absolute; right: -4px; bottom: -4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 10px/16px var(--font-ui); }
.gc-uplist em { font-style: normal; color: var(--ink-3); font-size: 13px; }
.gc-rline { margin: 0; font-weight: 600; font-size: 14px; color: var(--ink); }
.gc-town { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; padding: 9px 12px; border-radius: 12px;
  background: var(--gold-soft); font-size: 14px; }
.gc-town span:first-child { font-weight: 700; color: var(--gold-ink); }
.gc-town span:nth-child(2) { color: var(--ink-2); }
.gc-town a { color: var(--accent); font-weight: 650; }
.gc-rline b { color: var(--gold-ink); margin-right: 4px; }
.gc-res .gc-xp { text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--paper-2); }
.gc-res .gc-xpbar { background: var(--card); }
.gc-rankup { margin: 0; font: 650 18px/1.3 var(--font-display); color: var(--gc); animation: gc-star .5s 1.3s cubic-bezier(.3,1.6,.5,1) both; }
.gc-rankup b { font: 600 22px/1 var(--font-jp); }
.gc-rbtns { justify-content: center; margin-top: 2px; }
/* a long dialog on a phone scrolls under its buttons, which stay in reach */
.gc-res .gc-rbtns { position: sticky; bottom: -22px; margin-bottom: -22px; padding: 12px 0 22px; background: var(--card); }
@media (max-width: 640px) { .gc-res .gc-rbtns { bottom: -18px; margin-bottom: -18px; padding-bottom: 18px; } .gc-score b { font-size: 40px; } .gc-star svg { width: 44px; height: 44px; } .gc-star:nth-child(2) svg { width: 54px; height: 54px; } }
.gc-rbtns .btn.primary svg { fill: currentColor; stroke: none; }

/* Combos and effects. */
#gc-fx { position: fixed; inset: 0; z-index: 7000; pointer-events: none; overflow: hidden; }
.gc-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.gc-dot.gold { background: var(--gold); }
.gc-dot.gc { background: var(--gc); }
.gc-float { position: absolute; transform: translate(-50%, -50%); font: 750 20px/1 var(--font-display); color: var(--gold-ink);
  text-shadow: 0 1px 0 var(--card), 0 0 6px var(--card); white-space: nowrap; }
.gc-float.big { font-size: 28px; }
.gc-combo { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(var(--topbar) + env(safe-area-inset-top, 0px) + 12px); z-index: 6900;
  display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 14px; border-radius: 999px; background: var(--card); color: var(--ink);
  box-shadow: var(--shadow-lg); pointer-events: none; opacity: 0; transition: opacity .2s; }
.gc-combo.on { opacity: 1; }
.gc-combo b { font: 750 20px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.gc-combo span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.gc-combo.hot b { color: var(--gold-ink); }
.gc-lvchip { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px;
  padding: 7px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-lg); animation: gc-rise .25s ease both; transition: opacity .35s; }
.gc-lvchip.off { opacity: 0; }
.gc-lvchip span { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13px; color: var(--ink-2); }
.gc-lvchip span.gold { color: var(--gold-ink); }
.gc-lvchip span.gold b { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); }
.gc-lvchip b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); font: 400 20px/1 var(--font-jp); }
@media (prefers-reduced-motion: reduce) {
  .gc-star.pop, .gc-score em, .gc-rankup, .gc-res .panel, .gc-lvchip { animation: none; }
  .gc-xpbar i { transition: none; }
}

/* The first visit to a game: its name, its first kanji and Play; the other panels (also the game's own, which
   it adds into the welcome) wait for the first round. */
.gc-hub.gc-hub-new > :not(.gc-hub-top):not(.gc-howto) { display: none !important; }
.gc-hub.gc-hub-new .gc-hub-play { margin-top: 6px; }

/* Kanji School inside Learn Kanji: karuta at a temple school. The reader's card is at the top; under it the
   match: your pile, the reads and the rival's reach, the rival's pile and face. The cards lie on the tatami
   below, and a line under the mat says what just happened. The header, pages, buttons and dialogs are the
   app's (games/frame.css), the welcome hub and the results are the games' (games/core.css); the tatami is drawn
   in the app's palette (straw from its hills and sand, a cloth edge in its green), in light and dark, and the
   karuta cards are paper in both themes, like the picture cards. */
:root {
  --mat: color-mix(in srgb, var(--sc-hill) 45%, var(--sc-sand));          /* the tatami: straw from the app's hills and sand */
  --mat-2: color-mix(in srgb, var(--sc-hill) 52%, var(--sc-sand-2));      /* a shade deeper toward the near edge */
  --mat-weave: color-mix(in srgb, var(--sc-sand-2) 70%, transparent);     /* its faint weave, stalk by stalk */
  --mat-edge: var(--sc-hill-2);                                           /* the cloth edge (heri) along its long sides */
  --mat-thread: color-mix(in srgb, var(--sc-hill-2) 50%, var(--sc-foam)); /* a thread woven into the cloth edge */
  --mat-bg: repeating-linear-gradient(90deg, var(--mat-weave) 0 1px, transparent 1px 6px), linear-gradient(180deg, var(--mat), var(--mat-2));
  --heri: 10px;
  /* the karuta cards: warm paper and dark ink in both themes, a little dimmer on the Blackboard */
  --fuda: color-mix(in srgb, #f8f3e6 88%, var(--paper));
  --fuda-ink: #1d2420;
  --fuda-line: color-mix(in srgb, #d8cdb2 85%, var(--paper));
  --fuda-yours: color-mix(in srgb, #d3eadc 88%, var(--paper));
  --fuda-theirs: color-mix(in srgb, #f7d9d3 88%, var(--paper));
}

.app { position: relative; height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; user-select: none; -webkit-user-select: none; background: var(--paper); }

/* ---------- the reader's card ---------- */
.readrow { display: grid; justify-items: center; gap: 10px; padding-block: 14px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.yomi { position: relative; width: min(640px, 100%); min-height: 136px;   /* the tallest clue (a kanji to find), so nothing below moves between reads */
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 12px 18px 12px 12px;
  background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); }
.yomi .tag { writing-mode: vertical-rl; padding: 8px 6px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--red); color: var(--red); font: 600 14px/1 var(--font-jp); letter-spacing: .2em; }
.yomi .clue { display: grid; gap: 2px; min-width: 0; }
.yomi.read .clue { animation: yomi-in .26s cubic-bezier(.2,.8,.3,1) both; }
@keyframes yomi-in { from { opacity: 0; transform: translateY(6px) scale(.985); } }
.yomi .lbl { font: 600 12px/1.3 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.yomi .main { font: 650 clamp(24px, 4vw, 32px)/1.15 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.yomi .main.kana { font: 400 clamp(32px, 6vw, 46px)/1.1 var(--font-jp); }
.yomi .main.kj { font: 400 clamp(46px, 8vw, 64px)/1 var(--font-jp); }
.yomi .sub { font-size: 16px; color: var(--ink-2); }
.yomi .sub [lang="ja"] { font: 600 19px/1.2 var(--font-jp); color: var(--ink); }
.yomi.over .main { font-variant-numeric: tabular-nums; }
.yomi .gap { display: inline-block; width: .95em; height: .95em; margin: 0 .05em; vertical-align: -.1em; border: 1.5px dashed var(--accent); border-radius: 4px; background: var(--accent-soft); }
/* the breath before a read: the reader lifts a card */
.yomi .wait { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding-left: 4px; }
.yomi .wait i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); animation: breath 1.05s ease-in-out infinite; }
.yomi .wait i:nth-of-type(2) { animation-delay: .16s; }
.yomi .wait i:nth-of-type(3) { animation-delay: .32s; }
.yomi .wait b { margin-right: 4px; font: 650 22px/1 var(--font-display); color: var(--red); animation: yomi-in .3s ease both; }
@keyframes breath { 0%, 100% { opacity: .25; transform: scale(.75); } 50% { opacity: 1; transform: none; } }

/* ---------- the match: your pile, the reads and the rival's reach, the rival's pile and face ---------- */
.duel { width: min(640px, 100%); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 46px; }
.side { display: flex; align-items: center; gap: 9px; min-width: 0; }
.side .who { font: 650 14.5px/1.2 var(--font-ui); color: var(--ink-2); white-space: nowrap; }
.you .pile { --pc: var(--accent); --pt: var(--accent-ink); }
.them .pile { --pc: var(--red); --pt: var(--card); }
/* a pile of taken cards: the top card shows the count, more cards show under it as the pile grows */
.pile { position: relative; display: grid; width: 31px; height: 42px; flex: none; }
.pile b, .pile::before, .pile::after { grid-area: 1 / 1; border-radius: 5px; }
.pile::before, .pile::after { content: ""; z-index: 0; background: color-mix(in srgb, var(--pc) 40%, var(--card)); box-shadow: 0 0 0 1px var(--card); opacity: 0; transition: opacity .2s, transform .25s; }
.pile b { position: relative; z-index: 1; display: grid; place-items: center; background: var(--pc); color: var(--pt); font: 750 18px/1 var(--font-display); font-variant-numeric: tabular-nums;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
.you .pile:is([data-h="2"], [data-h="3"])::before { opacity: 1; transform: translate(-3px, 2px) rotate(-6deg); }
.you .pile[data-h="3"]::after { opacity: 1; transform: translate(-6px, 4px) rotate(-12deg); }
.them .pile:is([data-h="2"], [data-h="3"])::before { opacity: 1; transform: translate(3px, 2px) rotate(6deg); }
.them .pile[data-h="3"]::after { opacity: 1; transform: translate(6px, 4px) rotate(12deg); }
.pile.pop b { animation: pop .42s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 40% { transform: scale(1.32); } }
.rface { display: block; width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; transition: transform .18s ease; }
.rface .face { width: 100%; height: 100%; }
.duel.hot .rface { transform: translateY(2px) scale(1.08); box-shadow: inset 0 0 0 2px var(--red); }
.mid { display: grid; gap: 7px; min-width: 0; }
.pips { display: flex; justify-content: center; align-items: center; gap: 4px; min-width: 0; min-height: 9px; }
.pips i { flex: 0 1 9px; min-width: 4px; aspect-ratio: 1; border-radius: 50%; background: var(--rule); }
.pips i.now { background: transparent; box-shadow: inset 0 0 0 2px var(--ink-2); }
.pips i.y { background: var(--accent); }
.pips i.t { background: var(--red); }
.pips i.x { background: var(--red); box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 30%, transparent); }
.pips i.e { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
/* the rival's reach: it grows from their side toward yours; near the end it glows */
.track { position: relative; height: 8px; border-radius: 4px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); overflow: hidden; }
.fill { position: absolute; top: 0; bottom: 0; right: 0; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--red), color-mix(in srgb, var(--red) 75%, var(--gold))); }
.duel.hot .fill { animation: hot .3s ease-in-out infinite alternate; }
@keyframes hot { to { filter: brightness(1.3) saturate(1.2); } }

/* ---------- the tatami, and the karuta cards on it ---------- */
/* A piece of tatami: its weave, and the cloth edge along its long sides (the floor, and the cards shown on a page). */
.floor::before, .demo, .onecard {
  border: 1px solid color-mix(in srgb, var(--mat-edge) 60%, var(--rule));
  background:
    linear-gradient(var(--mat-thread), var(--mat-thread)) left 0 top calc(var(--heri) * .45) / 100% 1px no-repeat,
    linear-gradient(var(--mat-thread), var(--mat-thread)) left 0 bottom calc(var(--heri) * .45) / 100% 1px no-repeat,
    linear-gradient(var(--mat-edge), var(--mat-edge)) left 0 top 0 / 100% var(--heri) no-repeat,
    linear-gradient(var(--mat-edge), var(--mat-edge)) left 0 bottom 0 / 100% var(--heri) no-repeat,
    var(--mat-bg);
}
/* The floor's box is where the cards are laid out (school.js measures it); the mat is drawn a little around it. */
.floor { --mx: 16px; --my: 18px; position: relative; min-height: 0; margin: 32px auto 20px;
  width: min(1180px, calc(100% - max(32px, calc(env(safe-area-inset-left, 0px) + 18px)) - max(32px, calc(env(safe-area-inset-right, 0px) + 18px)))); }
.floor::before { content: ""; position: absolute; inset: calc(-1 * var(--my)) calc(-1 * var(--mx)); border-radius: 12px; box-shadow: var(--shadow); }
.cards { position: absolute; inset: 0; z-index: 1; display: grid; justify-content: center; align-content: center; gap: var(--gap, 12px); grid-template-columns: repeat(var(--cols, 4), var(--cw, 90px)); }
/* the rival's hand, and the rings of a slap, on the mat (clipped to it, so the hand comes from the far side) */
.reach { position: absolute; inset: calc(-1 * var(--my)) calc(-1 * var(--mx)); z-index: 2; overflow: hidden; border-radius: 12px; pointer-events: none; }
.hand { position: absolute; width: 70px; height: 120px; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .22)); }
.ripple { position: absolute; border-radius: 50%; border: 3px solid var(--accent); pointer-events: none; }
/* a karuta card: paper with a fine frame inside its edge, laid a little askew */
.fuda { position: relative; width: var(--cw, 90px); height: calc(var(--cw, 90px) * 1.38); display: grid; place-items: center; padding: 0; cursor: pointer; rotate: var(--rot, 0deg);
  border-radius: calc(var(--cw, 90px) * .07); border: 1px solid var(--fuda-line); background: var(--fuda); color: var(--fuda-ink);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .06), var(--shadow); transition: translate .12s ease, scale .12s ease, box-shadow .15s ease, background-color .2s ease, border-color .2s ease;
  -webkit-tap-highlight-color: transparent; }
.fuda::before { content: ""; position: absolute; inset: calc(var(--cw, 90px) * .055); border: 1px solid var(--fuda-line); border-radius: calc(var(--cw, 90px) * .035); pointer-events: none; transition: border-color .2s ease; }
@media (hover: hover) { .floor:not(.idle) .fuda:hover { translate: 0 -3px; box-shadow: 0 1px 0 rgba(0, 0, 0, .06), var(--shadow-lg); } }
.floor:not(.idle) .fuda:active { scale: .97; }

.fuda .kj { position: relative; font: 400 calc(var(--cw, 90px) * .62)/1 var(--font-jp); }

/* what a card means, once it has been read or touched: a tag at its foot (it may reach into the gap, so words never break) */

.fuda .m { position: absolute; left: 50%; bottom: calc(var(--cw, 90px) * .07); z-index: 1; transform: translateX(-50%); width: max-content; max-width: calc(var(--cw, 90px) * 1.4);
  padding: 2px 7px 3px; border-radius: 7px; background: var(--red); color: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  font: 650 max(9px, min(max(11px, calc(var(--cw, 90px) * .1)), calc((var(--cw, 90px) * 1.4 - 16px) / (var(--len, 6) * .6))))/1.15 var(--font-ui);
  text-align: center; text-wrap: balance; overflow-wrap: anywhere; }
.fuda.empty, .fuda.gone { visibility: hidden; }
/* a card taken: yours in the accent, the rival's in red, and a wrong touch in red, like answers in the app */
.fuda.yours { border-color: var(--accent); background: var(--fuda-yours); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

.fuda.deal { animation: deal .38s cubic-bezier(.2,.8,.3,1) both; }
@keyframes deal { from { opacity: 0; transform: translateY(-16px) rotate(-5deg) scale(.95); } }

@keyframes hit { 45% { transform: scale(1.09); } }
.fuda.slip { animation: slip .45s ease; }

.flyer { position: fixed; z-index: 4400; pointer-events: none; }

.intro { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 8px; cursor: pointer; }
.vs { display: grid; justify-items: center; gap: 3px; width: min(380px, 100%); max-height: 100%; overflow: hidden; padding: 16px 20px 16px; border-radius: 16px; background: var(--card); color: var(--ink);
  box-shadow: var(--shadow-lg); text-align: center; animation: vs-in .42s cubic-bezier(.2,1.25,.4,1) both; }

@media (max-width: 720px) {

  const periodDays = o => (o && o.period && UNIT_DAYS[o.unit] ? o.period * UNIT_DAYS[o.unit] : 0);

  function onPlans(m) {

    const list = Array.isArray(m.plans) ? m.plans : [];
    const next = {};

    get expires() { return !lifetime && subOn() && sub.exact ? sub.expires : 0; },

    get buyingPlan() { return buyingPlan; },
    get storeAnswered() { return storeAnswered; },
    get freeKanji() { free(); return freeK; },
    get freeLessons() { return free().size; },
    get freeBook() { return KDATA.books[0]; },

/* Kana helpers shared by the app and the games: romaji for any kana reading, so that nothing in
   Learn Kanji needs hiragana or katakana to be read. Hepburn, with long vowels written as they are
   spelled (がっこう → gakkou, ー as a macron: ゲーム → gēmu); "." (okurigana) is dropped, "-" kept. */
'use strict';
const Kana = (() => {
  const hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const ROMA = {
    あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o', か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko', さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
    た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to', な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no', は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
    ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo', や: 'ya', ゆ: 'yu', よ: 'yo', ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro', わ: 'wa', ゐ: 'i', ゑ: 'e', を: 'o', ん: 'n',
    が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go', ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo', だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
    ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ゔ: 'vu',
    ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゎ: 'wa', ゕ: 'ka', ゖ: 'ke',
  };
  const YOON = { ゃ: 'a', ゅ: 'u', ょ: 'o' };
  // Small vowels after a kana make the sounds of loanwords: ティ ti, ファ fa, ウィ wi, ジェ je …
  const SMALL = { ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o' };
  const MACRON = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };
  /** Romaji for a kana string. Characters that are not kana (kanji, Latin, punctuation) are kept. */
  function romaji(s) {
    const t = hira(s).replace(/\./g, '');
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const c = t[i], nx = t[i + 1];
      if (c === 'っ') { const r = ROMA[nx] || ''; out += r && /[a-z]/.test(r[0]) && !/[aiueon]/.test(r[0]) ? (r.startsWith('ch') ? 't' : r[0]) : ''; continue; }
      if (c === 'ー') { const v = out.slice(-1); out = out.slice(0, -1) + (MACRON[v] || v); continue; }
      if (c === 'ん') { out += 'n' + (nx && /[あいうえおやゆよ]/.test(nx) ? "'" : ''); continue; }
      if (c === '・') { out += ' '; continue; }
      let r = ROMA[c];
      if (r === undefined) { out += c; continue; }
      if (nx && YOON[nx] && r.length > 1) {
        const base = r.slice(0, -1);
        r = (base === 'sh' || base === 'ch' || base === 'j') ? base + YOON[nx] : base + 'y' + YOON[nx];
        i++;
      } else if (nx && SMALL[nx] && /[てでうふしちじ]/.test(c)) {
        const base = { て: 't', で: 'd', う: 'w', ふ: 'f', し: 'sh', ち: 'ch', じ: 'j' }[c];
        r = base + SMALL[nx];
        i++;
      }
      out += r;
    }
    return out.replace(/\s+/g, ' ').trim();
  }
  const hasKana = s => /[ぁ-ゖァ-ヺー]/.test(String(s));
  return { romaji, hira, hasKana };
})();

/* The learner's goal: what the games, the journey and the home screen focus on, so nobody is given
   kanji their course or exam does not ask for. Kept in the app's settings (localStorage 'kakitori:v1',
   settings.goal) and read by the games too:
     {kind:'auto'}                      the level you are studying (the default; see currentLevel)
     {kind:'course', level:'B1', upTo}  one level of the app (a course that follows the books);
                                        upTo: the last lesson (unit number) the class has reached
     {kind:'jlpt', level:4}             a JLPT level and every level below it (N4 = N5 + N4)
     {kind:'all'}                       every kanji in the app
   JLPT levels: KDATA kanji field j (5 = N5 … 1 = N1), from Jonathan Waller's lists (tools/make_jlpt.py). */
'use strict';
const Goal = (() => {
  const APP = 'kakitori:v1';
  const K = () => KDATA.kanji;
  const books = () => KDATA.books;
  const lessonOf = n => KDATA.lessons[n - 1];
  const bookIndex = id => books().findIndex(b => b.id === id);
  const appState = () => {
    if (typeof Store !== 'undefined' && Store.state) return Store.state;
    try { return JSON.parse(localStorage.getItem(APP) || 'null') || {}; } catch (e) { return {}; }
  };
  const JLPT = [5, 4, 3, 2, 1];
  const jname = n => 'N' + n;

  function normalize(g) {
    if (!g || typeof g !== 'object') return { kind: 'auto' };
    if (g.kind === 'course' && bookIndex(g.level) >= 0) {
      const o = { kind: 'course', level: g.level };
      const l = +g.upTo && lessonOf(+g.upTo);
      if (l && l.b === g.level) o.upTo = +g.upTo;
      return o;
    }
    if (g.kind === 'jlpt' && JLPT.includes(+g.level)) return { kind: 'jlpt', level: +g.level };
    if (g.kind === 'all') return { kind: 'all' };
    return { kind: 'auto' };
  }
  /** The goal as stored (normalized). */
  const stored = () => normalize((appState().settings || {}).goal);

  /** The level you are studying: the level of the kanji you learned last, or the next level with kanji
      still to learn once that one is done (opening a lesson to look at it changes nothing). */
  function currentLevel() {
    const s = appState(), cards = s.cards || {}, order = books().map(b => b.id);
    let lastK = null, lastT = -1;
    for (const [k, c] of Object.entries(cards)) if (K()[k] && c && (+c.added || 0) > lastT) { lastT = +c.added || 0; lastK = k; }
    const open = k => typeof Edition === 'undefined' || !Edition.kanjiLocked(k);
    const hasNew = id => KDATA.lessons.some(l => l.b === id && [...l.kanji].some(k => !cards[k] && open(k)));
    const start = lastK ? Math.max(0, order.indexOf(lessonOf(K()[lastK].l).b)) : 0;
    for (let i = 0; i < order.length; i++) { const id = order[(start + i) % order.length]; if (hasNew(id)) return id; }
    return order[start];
  }

  /** The goal, resolved: {kind, level, upTo, auto, id, label, short, test(k), keep(k)}.
      test: is kanji k part of the goal. keep: may a kanji already met stay in play (the goal, or an
      easier level). */
  let memo = null;   // a game page reads the goal once (the app re-reads it: the level you are on moves)
  function resolve(g) {
    const plain = g === undefined, cache = plain && typeof Store === 'undefined';
    if (cache && memo) return memo;
    g = normalize(plain ? stored() : g);
    const auto = g.kind === 'auto';
    if (auto) g = { kind: 'course', level: currentLevel() };
    let test, keep, dist, label, short, id;
    if (g.kind === 'course') {
      const b = books()[bookIndex(g.level)], bi = bookIndex(g.level);
      const up = g.upTo ? lessonOf(g.upTo) : null;
      test = k => { const r = K()[k]; if (!r) return false; const l = lessonOf(r.l); return l.b === g.level && (!g.upTo || r.l <= g.upTo); };
      keep = k => { const r = K()[k]; return !!r && bookIndex(lessonOf(r.l).b) <= bi; };
      // how far a kanji is from the goal: easier levels first, then the next harder ones
      dist = k => { const r = K()[k]; if (!r || test(k)) return 0; const d = bookIndex(lessonOf(r.l).b) - bi; return d <= 0 ? -d * 0.5 + (d === 0 ? 0.25 : 0) : d; };
      short = b.short;
      const upName = up ? `${up.k === 'L' ? 'Lesson' : up.k === 'R' ? 'Review' : 'Column'} ${up.ln}` : '';
      label = up ? `${b.short}, up to ${upName}` : b.short;
      id = `course:${g.level}${g.upTo ? ':' + g.upTo : ''}`;
    } else if (g.kind === 'jlpt') {
      test = k => { const r = K()[k]; return !!r && (r.j || 1) >= g.level; };
      keep = test;
      dist = k => { const r = K()[k]; return !r ? 9 : Math.max(0, g.level - (r.j || 1)); };
      short = label = `JLPT ${jname(g.level)}`;
      id = `jlpt:${g.level}`;
    } else {
      test = k => !!K()[k];
      keep = test;
      dist = () => 0;
      short = 'All levels'; label = 'All levels';
      id = 'all';
    }
    const out = { ...g, auto, id: auto ? 'auto:' + id : id, label, short, test, keep, dist };
    if (cache) memo = out;
    return out;
  }

  /** The goal's kanji, in the order of the lessons. */
  function syllabus(g) {
    const r = resolve(g);
    const out = [];
    for (const l of KDATA.lessons) for (const k of l.kanji) if (r.test(k)) out.push(k);
    return out;
  }
  /** How many kanji a goal has (for the goal picker). */
  const size = g => syllabus(g).length;
  /** Kanji at each JLPT level (not cumulative). */
  function jlptCounts() {
    const c = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
    for (const r of Object.values(K())) c[r.j || 1]++;
    return c;
  }
  return { stored, resolve, syllabus, size, normalize, currentLevel, jlptCounts, JLPT, jname, get: () => resolve(), forget: () => { memo = null; } };
})();

/* The journey: the seven games as one trip through old Japan, and the rewards that keep a learner going.
   Shared by the app and the game pages; kept in localStorage 'kakitori:journey:v1'.

   Route: the river (Koi) → the inn kitchen → the Tōkaidō (Road) → the temple school → the castle town
   → the apothecary (Alchemy) → the teahouse (Tiles), then round again. A stop asks for STEPS level-ups
   of that game's kanji of your goal (a kanji going from level 0 to 1, 1 to 2 or 2 to 3); a game with
   nothing left to raise is passed by. Finishing a stop writes a stamp in the journal and sends you on to the next place.

   Rewards (the free version of the Store edition: each one is a locked lesson, opened for good):
     - the weekly goal: finish one stop between Monday and Sunday
     - every 7 days in a row of practice (lessons, reviews or games)
     - friends: your invite code gives a friend a lesson; their thank-you code gives you one
   With everything unlocked, the same moments earn stamps instead. No reward ever depends on a rating
   or a review. Earned lessons are kept apart from the Store's licences, and survive Reset progress.
   (Before 1.4 five friends opened every lesson; with paid plans, each friend is one lesson.) */
'use strict';
const Journey = (() => {
  const KEY = 'kakitori:journey:v1', GKEY = 'kakitori:games:v1', AKEY = 'kakitori:v1';
  const ROUTE = ['koi', 'kitchen', 'road', 'school', 'castle', 'alchemy', 'tiles'];
  const STEPS = 6, STREAK = 7;
  const PLACES = {
    koi: { title: 'The river', jp: '川辺', gift: 'a paper carp streamer', from: 'the river',
      arrive: 'Dawn on the river. A boatman is raising the carp streamers: “The lanterns over the water carry kanji of land, water and sky. Fly with the koi and catch the right ones.”' },
    kitchen: { title: 'The inn kitchen', jp: '宿の台所', gift: 'a lunch box', from: 'the inn',
      arrive: 'Downriver, the cook of a small inn waves you into her kitchen: “My regulars order by the kanji on the menu. Can you find the right jar?”' },
    road: { title: 'The Tōkaidō', jp: '東海道', gift: 'a pair of straw sandals', from: 'the Tōkaidō',
      arrive: 'With the inn’s lunch box in your bag you set off along the Tōkaidō, the old road to Kyoto. Every station on it has kanji of places and travel, of moving, carrying and making.' },
    school: { title: 'The temple school', jp: '寺子屋', gift: 'a karuta card signed by Sensei', from: 'the temple school',
      arrive: 'At the end of the road stands a temple school. Sensei is holding a karuta tournament, and needs a player who knows the kanji of study, words and the arts.' },
    castle: { title: 'The castle town', jp: '城下町', gift: 'a lord’s banner', from: 'the castle town',
      arrive: 'One of Sensei’s old pupils serves the lord of the castle town. Rival lords are claiming the old provinces, under banners of society and law, money and work.' },
    alchemy: { title: 'The apothecary', jp: '薬屋', gift: 'a paper packet of medicine', from: 'the apothecary',
      arrive: 'After the battles, the town’s apothecary has more slips than hands. Each medicine is a kanji of the body or of science, made by merging its parts on the counter.' },
    tiles: { title: 'The teahouse', jp: '茶屋', gift: 'a cup of green tea', from: 'the teahouse',
      arrive: 'Home again. The teahouse keeper sets out tiles: “Sort what you have learned, each kanji with its meaning and its reading, while the tea is warm.”' },
  };
  const LAP_LINES = ['', 'A new season on the road. ', 'The road is familiar now, and so are the kanji. ', 'Another lap of the road: time to master what you know. '];

  /* ---------------- storage ---------------- */
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
  const fresh = () => ({ v: 1, name: '', id: '', lap: 1, at: 0, stop: null, log: [], weeks: {}, earned: [], friends: [],
    invitedBy: '', thanks: '', all: false, days: {}, streaks: [], badges: {} });
  function normalize(s) {
    const o = fresh();
    if (!s || typeof s !== 'object') return o;
    for (const f of ['name', 'id', 'invitedBy', 'thanks']) if (typeof s[f] === 'string') o[f] = s[f].slice(0, 40);
    for (const f of ['lap', 'at']) if (Number.isFinite(+s[f])) o[f] = Math.max(f === 'lap' ? 1 : 0, Math.floor(+s[f]));
    o.at %= ROUTE.length;
    if (s.stop && typeof s.stop === 'object' && ROUTE.includes(s.stop.g)) o.stop = s.stop;
    if (Array.isArray(s.log)) o.log = s.log.filter(x => x && ROUTE.includes(x.g)).slice(-400);
    if (s.weeks && typeof s.weeks === 'object') o.weeks = s.weeks;
    if (Array.isArray(s.earned)) o.earned = s.earned.filter(x => x && Number.isFinite(+x.n)).map(x => ({ n: +x.n, why: String(x.why || ''), t: +x.t || 0 }));
    if (Array.isArray(s.friends)) o.friends = [...new Set(s.friends.filter(x => typeof x === 'string'))];
    o.all = !!s.all;
    if (s.days && typeof s.days === 'object') o.days = s.days;
    if (Array.isArray(s.streaks)) o.streaks = s.streaks.filter(x => typeof x === 'string');
    if (s.badges && typeof s.badges === 'object') o.badges = s.badges;
    return o;
  }
  let S = normalize(read(KEY));
  const listeners = new Set();
  function save() {
    write(KEY, S);
    syncEdition();
    listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  /** Read the store again (another page may have changed it). */
  function reload() { S = normalize(read(KEY)); syncEdition(); }
  function syncEdition() {
    if (typeof Edition !== 'undefined' && Edition.setEarned) Edition.setEarned(S.earned.map(x => x.n));
  }

  /* ---------------- days, weeks and the streak ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const today = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  function weekId(t = Date.now()) {   // ISO 8601 week, Monday to Sunday, local time
    const d = new Date(t); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));        // the Thursday of this week
    const w1 = new Date(d.getFullYear(), 0, 4);
    const w = 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
    return `${d.getFullYear()}-W${pad(w)}`;
  }
  /** Days with practice: lessons and reviews (the app) or answers in a game. */
  let appSrc = null;
  /** A game page passes the app's state it has read already (reading it again each answer is slow). */
  const useApp = f => { appSrc = typeof f === 'function' ? f : null; };
  function streak(t = Date.now()) {
    const app = appSrc ? appSrc() || {} : typeof Store !== 'undefined' ? Store.state : (read(AKEY) || {});
    const days = app.days || {};
    const active = day => { const d = days[day]; return !!((d && (d.learned || d.reviews)) || S.days[day]); };
    let n = 0;
    for (let i = 0; i < 4000; i++) {
      if (active(today(t - i * 864e5))) n++;
      else if (i === 0) continue;   // today not started yet: count from yesterday
      else break;
    }
    return n;
  }
  /** A game answer today (the games call this). */
  function logPlay() {
    const d = today(), first = !S.days[d];
    S.days[d] = (S.days[d] || 0) + 1;
    const keys = Object.keys(S.days);
    if (keys.length > 400) for (const k of keys.sort().slice(0, keys.length - 400)) delete S.days[k];
    save();
    return first ? tick() : [];   // the streak only changes with the first practice of a day
  }

  /* ---------------- rewards ---------------- */
  const hasEdition = () => typeof Edition !== 'undefined';
  /** Can a reward still open a lesson? (Store edition, not everything unlocked.) */
  const lessonsToEarn = () => hasEdition() && Edition.locks && KDATA.lessons.some(l => Edition.unitLocked(l.n));
  /** The next locked lesson, by the goal: lessons with kanji of the goal first, in the goal's order. */
  function nextLocked() {
    if (!lessonsToEarn()) return null;
    const goal = typeof Goal !== 'undefined' ? Goal.resolve() : null;
    const ls = KDATA.lessons.filter(l => Edition.unitLocked(l.n));
    if (goal) {
      const withGoal = ls.find(l => [...l.kanji].some(k => goal.test(k)));
      if (withGoal) return withGoal.n;
      const lv = ls.find(l => l.b === (goal.level || ''));
      if (lv) return lv.n;
    }
    return ls[0].n;
  }
  /** Give a reward: a locked lesson if there is one, else a stamp. Returns {lesson} or {stamp}. */
  function grant(why) {
    const n = nextLocked();

            if (!GC.met(k)) return `<div class="kc locked new" aria-label="Not met yet"><span class="g">？</span><span class="m">${S.pending.includes(k) ? 'next' : 'not met'}</span></div>`;
            const lv = GC.level(k);
            return `<button class="kc" type="button" data-act="card" data-k="${k}"><span class="g" lang="ja">${k}</span><span class="m">${esc(meaning(k))}</span><span class="dots" role="img" aria-label="Level ${lv} of 3">${[1, 2, 3].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span></button>`;
          }).join('')}</div>`;
      }).join('')}</div>`, 'kanji');
  }
  function card(k) {
    const r = GC.rec(k) || { ok: 0 };
    modal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="gc-h">
      <p class="eyebrow">Card · level ${GC.level(k)} of 3 · taken ${r.ok} ${r.ok === 1 ? 'time' : 'times'}</p>
      ${GC.cardHtml(k, { words: 4 })}
      <div class="row"><button class="btn primary big" type="button" id="m-go">Close</button></div></div>`);
    const go = $('m-go');
    go.onclick = () => closeModal();
    setTimeout(() => go.isConnected && go.focus({ preventScroll: true }), 30);
    GC.animate($('gc-sq'), 250);
  }
  function settings(confirm = false) {
    const sw = (k, on, label, note) => `<div class="setting"><div class="lbl">${label}<span>${note}</span></div><button class="switch" type="button" role="switch" id="set-${k}" aria-checked="${on}" data-act="toggle" data-key="${k}" aria-label="${label}"></button></div>`;
    show(`<div class="panel" style="gap:6px">
      <div class="row between"><div><p class="eyebrow">Settings</p><h2>The schoolroom</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button></div>
      ${sw('sound', GC.opt.sound, 'Sound', 'A slap for each card taken, and soft chimes. The same switch as in Learn Kanji.')}
      ${sw('voice', GC.opt.voice, 'The reader’s voice', GC.Voice.ok ? 'A Japanese voice reads the cards aloud. The same switch as in Learn Kanji.' : 'No Japanese voice found on this device yet.')}
      ${sw('romaji', GC.opt.romaji, 'Show romaji', 'Readings in Latin letters as well as kana, in the lessons and every game.')}
      ${GC.themeRow()}
      ${sw('gentle', S.gentle, 'Gentle rivals', 'Every pupil takes longer to reach a card.')}
      <div class="setting"><div class="lbl">Start over<span>Clears your place in the class, and what you have learned of this game’s kanji. Your lessons and other games keep theirs.</span></div>
        ${confirm ? '<div class="row"><button class="btn danger" type="button" data-act="reset-yes">Clear Kanji School</button><button class="btn quiet" type="button" data-act="settings">Keep it</button></div>' : '<button class="btn" type="button" data-act="reset">Start over</button>'}</div>
      <p class="muted" style="font-size:14px">Progress is saved on this device with your Learn Kanji progress, and goes into its backups.</p></div>`, 'settings');
  }
  /** Meet new kanji, one card each, then go on. */
  function meet(list, then) {
    const queue = list.slice();
    const step = () => {
      const k = queue.shift();
      if (!k) { save(); return then && then(); }
      const i = list.length - queue.length;
      GC.meet(k);
      S.pending = S.pending.filter(x => x !== k);
      save();
      Sfx.gift();
      modal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="gc-h">
        <p class="eyebrow">${list.length > 1 ? `New card ${i} of ${list.length}` : 'A new card'}</p>
        ${GC.cardHtml(k)}
        <div class="meetfoot"><div class="onecard">${demoCard(k)}</div><p class="muted">On the floor it is a card with the kanji alone. At first the reader shows you the kanji, so you can find it.</p></div>
        <div class="row"><button class="btn primary big" type="button" id="m-go">${queue.length ? 'Next card' : 'To the match'} ${ICON.next}</button></div></div>`);
      const go = $('m-go');
      let done = false;
      go.onclick = () => { if (done) return; done = true; closeModal(); step(); };
      setTimeout(() => go.isConnected && go.focus({ preventScroll: true }), 30);
      GC.animate($('gc-sq'), 450);
      GC.say(reading(k));
    };
    step();
  }

  /* ---------------- input ---------------- */
  function onClick(e) {
    const c = e.target.closest('#cards .fuda');
    if (c && c.dataset.i != null) { tap(+c.dataset.i); return; }
    if (e.target.closest('#gc-play')) { Sfx.unlock(); return play(pick); }
    if (e.target.closest('#intro') && skipIntro) { skipIntro(); return; }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.dataset.act) {
      case 'home': return GC.back();
      case 'play': return play(+b.dataset.n);
      case 'rematch': return play(+b.dataset.n);
      case 'pick': GC.sfx.tap(); return choose(+b.dataset.n);
      case 'hub': return hub();
      case 'back': $('screen').hidden = true; view = ''; if (!live()) hub(); return;
      case 'kanji': return kanjiList();
      case 'card': return card(b.dataset.k);
      case 'settings': return settings();
      case 'unlock': return GC.unlock().then(() => { if (view === 'kanji') kanjiList(); });
      case 'toggle': {
        const k = b.dataset.key;
        if (k === 'gentle') { S.gentle = !S.gentle; save(); b.setAttribute('aria-checked', String(S.gentle)); return; }
        GC.opt[k] = !GC.opt[k];
        b.setAttribute('aria-checked', String(GC.opt[k]));
        return;
      }
      case 'reset': return settings(true);
      case 'reset-yes': {
        stop(); M = null;
        GC.resetTheme(); S = fresh(); save(); pick = 0;
        $('cards').innerHTML = ''; $('sub').textContent = ''; say('');
        return hub();
      }
    }
  }
  function onKey(e) {
    if (e.key === 'Escape') {
      if (!$('modal').hidden) { const go = $('m-go'); if (go && /Close/.test(go.textContent)) go.click(); }
      else if (!$('screen').hidden && live()) { $('screen').hidden = true; view = ''; }
      return;
    }
    if (skipIntro && (e.key === 'Enter' || e.key === ' ') && $('modal').hidden && $('screen').hidden) { e.preventDefault(); skipIntro(); return; }
    if (M && M.act && $('modal').hidden && $('screen').hidden && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const i = KEYS.indexOf(e.key);
      if (i >= 0 && i < M.floor.length) { e.preventDefault(); tap(i); }
    }
  }

  function start() {
    S = normalize(GC.state);
    save();
    // the game's own missions and daily challenges, besides the shared ones
    GC.setup({
      missions: {
        wins: { text: n => n === 1 ? 'Win a match' : `Win ${n} matches`, tiers: [2, 4, 7, 10, 15, 20, 30], counter: 'wins' },
        quick: { text: n => `Take ${n} cards in under ${QUICK} seconds`, tiers: [5, 12, 25, 40, 60, 90, 130], counter: 'quick' },
      },
      dailies: [
        { id: 'wins3', text: 'Win 3 matches', count: 'wins', goal: 3 },
        { id: 'quick8', text: `Take 8 cards in under ${QUICK} seconds`, count: 'quick', goal: 8 },
      ],
    });
    pick = frontier();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    const barh = () => document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px');
    barh();
    window.addEventListener('resize', barh);
    // the floor changes size when the window does, and when the message under it takes another line
    if (window.ResizeObserver) new ResizeObserver(() => measure()).observe($('floor'));
    else { let rt = 0; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 60); }); }
    if (typeof Edition !== 'undefined') Edition.onChange(() => { if (view === 'kanji') kanjiList(); else if (view === 'hub') hub(); });
    try { document.fonts.load('600 40px "Klee One"', GC.THEME.slice(0, 40).join('')); } catch (e) { /* fallback fonts */ }
    hub();
  }

  /** The index of the card the reader just read, or -1 (tests). */
  const rightIndex = () => (M && M.act && !M.act.empty ? M.floor.indexOf(M.act.k) : -1);
  return {
    start,
    test: {
      get S() { return S; }, get M() { return M; }, tap, play, begin, rightIndex, buildFloor, clueFor, normalize, endMatch, hub, need,
      rivalNow() { if (M && M.act) rivalAct(); }, rival(on) { noRival = !on; }, emptyNext() { if (M) M.forceEmpty = true; },
      seed(n) { rand = mulberry32(n); }, timescale(n) { TS = n; }, RIVALS, FLOOR, READS, EMPTY,
    },
  };
})();

School.start();

</script>

</body>
</html>
