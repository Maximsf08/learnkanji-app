/* The app's frame on every game page: the colours, type, header, buttons, cards, dialogs, tabs and
   settings of the app itself (src/css/app.css), in light and dark. The theme follows the app's
   Settings → Theme (games/core.js sets data-theme on <html>, like the app).
   A game's own stylesheet (its app.html) comes after this one. It keeps only its play area (the river,
   the kitchen, the map…), drawn with the scene colours below, which are made from the app's palette. */
:root {
  /* the app's tokens (src/css/app.css) */
  --paper: #f4f6f1;
  --paper-2: #e8ede5;
  --card: #fbfcf9;
  --ink: #1d2420;
  --ink-2: #4f5a54;
  --ink-3: #87938c;
  --rule: #cfdcd4;
  --grid: #7aa894;
  --grid-soft: #b7d0c3;
  --accent: #1a6a53;
  --accent-ink: #f4f6f1;
  --accent-soft: #d5e8dd;
  --red: #cf3427;
  --red-soft: #f6dcd8;
  --warn: #c56c12;
  --shadow: 0 1px 2px rgba(29, 36, 32, .06), 0 6px 18px rgba(29, 36, 32, .07);
  --font-jp: "Klee One", "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "Yu Kyokasho", "YuKyokasho", "Hiragino Mincho ProN", serif;
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 10px;
  --topbar: 56px;
  /* what the games add: coins and stars, the dialog shade, a lifted card */
  --gold: #c9961a;
  --gold-soft: #f5e8c2;
  --gold-ink: #8a6508;   /* gold for text: readable on the cards */
  --scrim: rgba(23, 31, 27, .42);
  --shadow-lg: 0 2px 6px rgba(29, 36, 32, .08), 0 18px 44px rgba(29, 36, 32, .2);
  /* the scenes: sky, hills, water, sand, wood, lanterns, made from the app's greens, its red and its amber */
  --sc-sky: #e2ebe5;
  --sc-sky-2: #cfe1d7;
  --sc-cloud: #fbfcf9;
  --sc-hill: #b7d0c3;
  --sc-hill-2: #7aa894;
  --sc-tree: #3f7d66;
  --sc-deep: #1a6a53;
  --sc-water: #a7cabc;
  --sc-water-2: #6c9e8b;
  --sc-foam: #f4f6f1;
  --sc-sand: #ece4d3;
  --sc-sand-2: #dccfb3;
  --sc-wood: #d9bf9a;
  --sc-wood-2: #b08a5c;
  --sc-wood-3: #6e5236;
  --sc-stone: #c3cbc5;
  --sc-stone-2: #8e9892;
  --sc-red: #cf3427;
  --sc-red-2: #a8291f;
  --sc-sun: #e9a23b;
  --sc-gold: #d9a521;
  --sc-ink: #1d2420;
  --sc-line: #cfdcd4;
  /* names the games' shared pieces use */
  --font-kanji: var(--font-jp);
  --font-body: var(--font-ui);
  --line: var(--rule);
  --act: var(--accent);
  --good: var(--accent);
  --bad: var(--red);
  /* the game's own colour (games/registry.js), set by games/core.js */
  --gc: #1a6a53;
  --gi: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b2622; --paper-2: #152019; --card: #22302a;
    --ink: #edf3ec; --ink-2: #b2c1b8; --ink-3: #7d8f86;
    --rule: #33463e; --grid: #5e8b77; --grid-soft: #3c584c;
    --accent: #8dd5b9; --accent-ink: #10201a; --accent-soft: #29433a;
    --red: #ff8e7e; --red-soft: #4a2d29; --warn: #f2c34f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .25);
    --gold: #e6bd4f; --gold-soft: #3a3322; --gold-ink: #e6bd4f; --scrim: rgba(4, 8, 6, .58);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 18px 44px rgba(0, 0, 0, .45);
    --sc-sky: #1f2b26; --sc-sky-2: #263630; --sc-cloud: #34463e; --sc-hill: #2d4239; --sc-hill-2: #3f5d50;
    --sc-tree: #4f8670; --sc-deep: #2f6a58; --sc-water: #2b4a40; --sc-water-2: #3f6b5c; --sc-foam: #a9c7ba;
    --sc-sand: #37352d; --sc-sand-2: #45423a; --sc-wood: #5a4a36; --sc-wood-2: #47392a; --sc-wood-3: #2c2219;
    --sc-stone: #3c4943; --sc-stone-2: #5b6a63; --sc-red: #e0604f; --sc-red-2: #b8473a; --sc-sun: #f0c25e;
    --sc-gold: #e6bd4f; --sc-ink: #edf3ec; --sc-line: #33463e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b2622; --paper-2: #152019; --card: #22302a;
  --ink: #edf3ec; --ink-2: #b2c1b8; --ink-3: #7d8f86;
  --rule: #33463e; --grid: #5e8b77; --grid-soft: #3c584c;
  --accent: #8dd5b9; --accent-ink: #10201a; --accent-soft: #29433a;
  --red: #ff8e7e; --red-soft: #4a2d29; --warn: #f2c34f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .25);
  --gold: #e6bd4f; --gold-soft: #3a3322; --gold-ink: #e6bd4f; --scrim: rgba(4, 8, 6, .58);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .3), 0 18px 44px rgba(0, 0, 0, .45);
  --sc-sky: #1f2b26; --sc-sky-2: #263630; --sc-cloud: #34463e; --sc-hill: #2d4239; --sc-hill-2: #3f5d50;
  --sc-tree: #4f8670; --sc-deep: #2f6a58; --sc-water: #2b4a40; --sc-water-2: #3f6b5c; --sc-foam: #a9c7ba;
  --sc-sand: #37352d; --sc-sand-2: #45423a; --sc-wood: #5a4a36; --sc-wood-2: #47392a; --sc-wood-3: #2c2219;
  --sc-stone: #3c4943; --sc-stone-2: #5b6a63; --sc-red: #e0604f; --sc-red-2: #b8473a; --sc-sun: #f0c25e;
  --sc-gold: #e6bd4f; --sc-ink: #edf3ec; --sc-line: #33463e;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
[lang="ja"] { font-family: var(--font-jp); }
.art-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- header: the app's top bar, with the game's emblem ---------- */
.bar {
  position: relative; z-index: 4500; flex: none; display: flex; align-items: center; gap: 10px; min-width: 0;
  min-height: calc(var(--topbar) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-block-end: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--paper); color: var(--ink); border-bottom: 1px solid var(--rule); box-shadow: none;
  user-select: none; -webkit-user-select: none;
}
.bar::before, .bar::after { content: none; }
.brand {
  display: flex; align-items: center; gap: 10px; min-width: 0; padding: 4px 10px 4px 4px; border: 0; border-radius: 10px;
  background: transparent; color: inherit; text-align: left; cursor: pointer;
}
.brand:hover { background: var(--paper-2); }
.brand .gi { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--gc); color: var(--gi); }
.brand .gi svg { width: 24px; height: 24px; }
.brand h1 { margin: 0; font: 600 18px/1.2 var(--font-display); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.brand .sub { min-width: 0; color: var(--ink-2); font: 400 14px/1.2 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.bar .pill {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; flex: none; border: 0; border-radius: 15px;
  background: var(--paper-2); color: var(--ink); font: 600 14px/1 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; box-shadow: none;
}
.bar .pill svg { width: 17px; height: 17px; flex: none; }
.iconbtn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; padding: 0; border-radius: 9px; border: 0;
  background: transparent; color: var(--ink-2); cursor: pointer;
}
.iconbtn:hover { background: var(--paper-2); color: var(--ink); border-color: transparent; }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  .bar { gap: 4px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .brand { gap: 8px; padding-right: 6px; }
  .brand .sub { display: none; }
  .brand h1 { font-size: 17px; }
  .bar .pill { height: 28px; padding: 0 9px; font-size: 13.5px; }
}
/* On a phone the header keeps the back button, the game, its counters, the kanji and settings; the
   "how to play" button gives way (the game's name opens it too). */
@media (max-width: 520px) { .bar .wide-only { display: none; } }
/* and a narrow phone drops "Kanji" from the name, like the app's list of games */
@media (max-width: 420px) { .brand h1 .pre { display: none; } }

/* ---------- pages over the game: welcome, results, shop, collection, settings ---------- */
.screen {
  position: absolute; inset: var(--barh, calc(var(--topbar) + env(safe-area-inset-top, 0px))) 0 0 0; z-index: 4000; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 20px max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--paper);
}
.panel { background: var(--card); color: var(--ink); border: 0; border-radius: 14px; box-shadow: var(--shadow); padding: 22px 24px; }
.panel h2 { margin: 0; font: 650 24px/1.2 var(--font-display); letter-spacing: 0; text-wrap: balance; }
.panel h3 { margin: 0; font: 650 17px/1.3 var(--font-display); letter-spacing: 0; }
.panel p { margin: 0; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
.hero h1 { margin: 0; font: 650 clamp(26px, 3.4vw, 32px)/1.15 var(--font-display); letter-spacing: 0; text-wrap: balance; }
.eyebrow { margin: 0; font: 600 12px/1.3 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
@media (max-width: 640px) {
  .panel { padding: 18px 16px; }
  .hero { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font: 600 15px/1.2 var(--font-ui); letter-spacing: 0; text-decoration: none; cursor: pointer; box-shadow: none;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.btn:hover { border-color: var(--grid); background: var(--card); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.06); }
.btn.quiet, .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover, .btn.ghost:hover { background: var(--paper-2); border-color: transparent; color: var(--ink); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.btn.danger:hover { background: var(--red-soft); border-color: var(--red); }
.btn.big { min-height: 50px; padding: 0 24px; border-radius: 12px; font: 650 17px/1.1 var(--font-display); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn:disabled, .btn[disabled] { opacity: .45; cursor: default; filter: none; }
.btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- dialogs ---------- */
.modal {
  position: absolute; inset: 0; z-index: 5000; display: grid; place-items: center; background: var(--scrim);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal .panel { width: min(600px, 100%); max-height: 100%; overflow-y: auto; box-shadow: var(--shadow-lg); animation: gc-rise .25s ease both; }
@keyframes gc-rise { from { transform: translateY(10px); opacity: 0; } }

/* ---------- tabs (the app's segmented switch), settings rows and switches ---------- */
.tabs { display: inline-flex; flex-wrap: wrap; align-self: start; justify-self: start; gap: 2px; max-width: 100%; padding: 3px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper-2); }
.tab {
  min-height: 34px; margin: 0; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2);
  font: 600 14px/1.2 var(--font-ui); cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"], .tab.on { background: var(--card); color: var(--ink); border: 0; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.tab span { margin-left: 4px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .tab { padding: 0 9px; font-size: 13.5px; } }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.setting:last-child { border-bottom: 0; }
.setting .lbl { font: 600 15.5px/1.3 var(--font-ui); }
.setting .lbl span { display: block; margin-top: 2px; font: 400 13.5px/1.45 var(--font-ui); color: var(--ink-2); max-width: 58ch; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper-2); }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font: 600 14px/1.2 var(--font-ui); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
@media (max-width: 640px) { .setting { grid-template-columns: minmax(0, 1fr); } .setting:has(> .switch) { grid-template-columns: minmax(0, 1fr) auto; } }
.switch { position: relative; flex: none; width: 50px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: var(--rule); cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); border: 0; }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--card); }

/* ---------- the collection: kanji by level of the app ---------- */
.lvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.lvhead h3 { margin: 0; font: 650 17px/1.3 var(--font-display); }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.kc {
  display: grid; justify-items: center; gap: 4px; min-width: 0; padding: 12px 6px 10px; border-radius: 12px; border: 1px solid var(--rule);
  background: var(--card); color: var(--ink); text-align: center; cursor: pointer; box-shadow: none;
}
.kc:hover { border-color: var(--grid); box-shadow: none; }
.kc .g { font: 400 40px/1.1 var(--font-jp); }
.kc .m { font-size: 13px; line-height: 1.25; color: var(--ink-2); overflow-wrap: anywhere; }
.kc.new, .kc.locked { cursor: default; background: transparent; border-style: dashed; color: var(--ink-3); box-shadow: none; }
.kc.new:hover, .kc.locked:hover { border-color: var(--rule); }
.kc.new .g { color: var(--ink-3); font: 600 34px/1.25 var(--font-display); }
.kc.locked .g { opacity: .4; }
.lv { display: inline-flex; gap: 3px; }
.lv i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--grid); }
.lv i.on { background: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
@media (max-width: 640px) {
  .kgrid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .kc .g { font-size: 32px; }
}

/* ---------- small pieces ---------- */
.chipsrow { display: flex; flex-wrap: wrap; gap: 6px; }
.chipsrow > span, .chipsrow > button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 0; border-radius: 14px; background: var(--paper-2); color: var(--ink); font-size: 14px; }
.chipsrow .g { font: 400 18px/1.1 var(--font-jp); }
.chipsrow > button { cursor: pointer; }
.chipsrow > button:hover { background: var(--accent-soft); }
.lines { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.lines > div { display: flex; justify-content: space-between; gap: 20px; max-width: 380px; padding: 5px 0; border-bottom: 1px dashed var(--rule); }
.lines > div.total { border-bottom: 0; font-weight: 650; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border: 0; border-radius: 12px; background: var(--paper-2); color: var(--ink-2); font: 600 12.5px/1 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.gold { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--gold-soft); color: var(--ink); font-size: 15px; }
.newk { display: inline-block; padding: 1px 8px; border-radius: 9px; background: var(--red-soft); color: var(--red); font: 600 12px/1.5 var(--font-ui); }
@media (prefers-reduced-motion: reduce) {
  .modal .panel { animation-duration: .01s; }
}

/* Picture cards shared by the kanji games (art from Kanji Valley). The cards always use the day
   palette, so they read the same on light and dark pages. */
.card, .art-defs {
  --s-paper: #f3f2ea; --s-key: #22314f; --s-sky-top: #2a5591; --s-sky-mid: #9fbbd9; --s-dawn: #f2dcc6;
  --s-mtn-top: #4c6c90; --s-mtn-base: #aebfd0; --s-snow: #fbfbf6; --s-meadow-a: #d3dfab; --s-meadow-b: #8fae5c;
  --s-river-a: #22528e; --s-river-b: #6e9bd0; --s-river-lt: #8fb4de; --s-foam: #f5f7fa; --s-field: #a3c78f; --s-ridge: #8f8b58;
  --s-grass: #b9cf8a; --s-seed: #3d6b2c; --s-leaf: #5f9442; --s-leaf-hi: #8cbd5e; --s-soil: #8d6240; --s-furrow: #6b4529;
  --s-path: #e2d2ab; --s-path-dk: #cbb88c; --s-fire-a: #d8462a; --s-fire-b: #f3b33b; --s-sun: #cf412a; --s-sun-core: #e86a3f;
  --s-moon: #f1d98f; --s-ray: #e0a52c; --s-night: #1e2d50; --s-star: #f4ead0; --s-rock: #7d8796; --s-gold: #e7b52a;

/* Shared pieces of every game page, in the app's style (games/frame.css has the tokens): the kanji card,
   the read-aloud button, the unlock offer, and the journey's notes and letters. */
.gc-card { display: grid; gap: 14px; }
.gc-reveal { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 20px; align-items: center; }
/* The square keeps the day colours in both themes, like the picture cards in it. */
.gc-sq { width: 100%; max-width: 190px; aspect-ratio: 1; border-radius: 10px; background: #fbfcf9; box-shadow: inset 0 0 0 1px #cfdcd4; overflow: hidden; }
.gc-sq svg { width: 100%; height: 100%; display: block; }
.gc-sq .strokes path { fill: none; stroke: #1d2420; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.gc-sq.plain .strokes path { stroke-width: 4.6; }
.gc-sq .gc-grid { fill: none; stroke: #b7d0c3; stroke-width: .8; stroke-dasharray: 3 3; }
.gc-sq .pic { transition: opacity .7s ease; }
.gc-facts { display: grid; gap: 7px; min-width: 0; }
.gc-mean { margin: 0; font: 650 clamp(21px, 3vw, 26px)/1.2 var(--font-display); text-wrap: balance; }
.gc-mean [lang="ja"] { font-weight: 600; margin-right: 6px; }
.gc-rd { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; font: 400 20px/1.3 var(--font-jp); }
.gc-rd .on { color: var(--ink-2); }
.gc-ro { font-size: 13.5px; color: var(--ink-3); }
.gc-note { margin: 0; font-size: 14px; color: var(--ink-2); }
.gc-words { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gc-words div { display: grid; gap: 0; padding: 8px 10px; border-radius: 10px; background: var(--paper-2); }
.gc-words b { font: 400 21px/1.25 var(--font-jp); }
.gc-words span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.gc-words span [lang="ja"] { font-size: 14px; color: var(--ink); }
.gc-say { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; padding: 0; border-radius: 50%; border: 1px solid var(--rule); background: var(--card); color: var(--accent); cursor: pointer; }
.gc-say:hover { border-color: var(--grid); }
.gc-say svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gc-back { display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none; padding: 0; border-radius: 9px; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.gc-back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gc-back:hover { background: var(--paper-2); color: var(--ink); }
@media (max-width: 720px) {
  .gc-reveal { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .gc-facts { justify-items: center; }
  .gc-rd { justify-content: center; }
  .gc-sq { max-width: 170px; }
}
/* The unlock offer (Store edition): the app's unlock band. */
.gc-offer { display: grid; gap: 8px; padding: 16px 18px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--ink); }
.gc-offer b { font: 650 17px/1.3 var(--font-display); }
.gc-offer p { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 70ch; }
/* The journey on every game page: notes at the top, and the welcome and stop letters, as the app's cards. */
#gc-jl { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 9000;
  display: grid; gap: 8px; justify-items: center; width: min(440px, calc(100vw - 24px)); pointer-events: none; }
.gc-jt { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  box-shadow: var(--shadow-lg); font: 600 14px/1.3 var(--font-ui);
  opacity: 0; transform: translateY(-10px); transition: opacity .25s, transform .25s; pointer-events: none; max-width: 100%; }
.gc-jt.on { opacity: 1; transform: none; }
.gc-jt.on.act, .gc-jt.on [data-x] { pointer-events: auto; cursor: pointer; }
.gc-jt b { display: inline-grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 7px; background: var(--red); color: var(--card);
  font: 600 16px/1 var(--font-jp); transform: rotate(-4deg); }
.gc-jt span { min-width: 0; }
.gc-jt.act span { text-decoration: underline; text-underline-offset: 3px; }
.gc-jt [data-x] { border: 0; background: transparent; color: var(--ink-3); font-size: 20px; line-height: 1; padding: 2px 6px; margin-left: auto; }
.gc-jm { position: fixed; inset: 0; z-index: 9001; display: grid; place-items: center; padding: 16px; background: var(--scrim); }
.gc-jm-card { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px 18px; border-radius: 16px;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow-lg); font: 400 15px/1.5 var(--font-ui); }
.gc-jm-card h2 { margin: 2px 0 10px; font: 650 22px/1.25 var(--font-display); }
.gc-jm-card h2 span { font: 400 18px/1 var(--font-jp); color: var(--ink-3); margin-left: 6px; }
.gc-jm-card p { margin: 0 0 10px; color: var(--ink-2); }
.gc-jm-card .gc-jk { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.gc-jm-card .gc-jgoal, .gc-jm-card .gc-jnext { padding: 10px 14px; border-radius: 10px; background: var(--paper-2); color: var(--ink); }
.gc-jm-card .gc-jrew { font-weight: 650; color: var(--accent); }
.gc-jb { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.gc-jb button { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 15px/1 var(--font-ui); cursor: pointer; }
.gc-jb button:hover { filter: brightness(1.06); }
.gc-jb button.gc-jsec { background: var(--card); color: var(--ink); border-color: var(--rule); }
.gc-jb button.gc-jsec:hover { filter: none; border-color: var(--grid); }
.gc-goaldone { font-size: 14px; color: var(--ink-2); }
.gc-goaldone a { color: var(--accent); font-weight: 600; }
/* A reading offered as an answer, with its romaji under it. */
.gc-ch { display: inline-grid; justify-items: center; line-height: 1.2; }
.gc-ro2 { font: 500 12px/1.3 var(--font-ui); letter-spacing: .01em; opacity: .75; }

/* ---------- playing: the welcome hub, the results of a round, combos and effects (games/core.js) ---------- */
/* The hub: a game's welcome page. */
.gc-hub { display: grid; gap: 14px; width: min(980px, 100%); margin: 0 auto; }
/* a game's own panel rules (centred, narrower) do not apply inside the hub */
.gc-hub .panel, .screen .gc-hub .panel, .modal .gc-hub .panel { margin: 0; max-width: none; width: auto; justify-self: stretch; }
.gc-hub-top { display: grid; gap: 18px; }
.gc-hub-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.gc-hub-em { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 20px; background: var(--gc); color: var(--gi);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .16), var(--shadow); }
.gc-hub-em svg { width: 54px; height: 54px; }
.gc-hub-name h1 { margin: 2px 0 4px; font: 650 clamp(28px, 4vw, 38px)/1.1 var(--font-display); letter-spacing: 0; }
.gc-pitch { margin: 0; color: var(--ink-2); font-size: 16px; max-width: 58ch; text-wrap: pretty; }
.gc-hub-art { justify-self: end; }
.gc-hub-play { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.gc-hub-play .btn.big { min-width: 180px; }
.gc-hub-play .btn.big svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.gc-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 0; }
.gc-chips div { padding: 10px 14px; border-radius: 12px; background: var(--paper-2); }
.gc-chips dt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.gc-chips dd { margin: 2px 0 0; font: 650 22px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.gc-chips dd small { font-size: 14px; font-weight: 500; color: var(--ink-3); }
.gc-first { margin: 0; font-size: 14px; color: var(--ink-2); }
.gc-hub-cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
.gc-hub .panel { padding: 16px 20px; }
.gc-hub .gc-hub-top.panel { padding: 22px 24px; }
.gc-hub .eyebrow { margin-bottom: 8px; }
.gc-hub-name .eyebrow { margin-bottom: 0; }
.gc-dline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; font-weight: 600; }
.gc-dline > b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); font-size: 16px; }
.gc-dline > svg { width: 30px; height: 30px; padding: 5px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); fill: none; stroke: currentColor; stroke-width: 2.2; }
.gc-dline small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.gc-dline em { font-style: normal; font-weight: 700; color: var(--gold-ink); font-variant-numeric: tabular-nums; }
.gc-daily.done .gc-dline em { color: var(--accent); }
.gc-xp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.gc-rank { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 650; }
.gc-rank b { font: 600 22px/1 var(--font-jp); color: var(--gc); }
.gc-xpbar { display: block; height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.gc-xpbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 60%, var(--accent))); transition: width .9s cubic-bezier(.2,.7,.3,1); }
.gc-xpn { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.gc-missions ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.gc-missions li { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto auto; gap: 12px; align-items: center; font-size: 14.5px; }
.gc-mbar { display: block; height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.gc-mbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.gc-missions small { color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.gc-missions em { font-style: normal; font-weight: 700; color: var(--gold-ink); font-size: 13px; min-width: 56px; text-align: right; }
.gc-howto summary { cursor: pointer; font-weight: 650; list-style: none; display: flex; align-items: center; gap: 8px; }
.gc-howto summary::-webkit-details-marker { display: none; }
.gc-howto summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--paper-2); color: var(--ink-2); font-weight: 700; }
.gc-howto[open] summary::before { content: "−"; }
.gc-howto-b { display: grid; gap: 10px; margin-top: 12px; color: var(--ink-2); font-size: 14.5px; max-width: 72ch; }
.gc-howto-b p { margin: 0; }
@media (max-width: 760px) {
  .gc-hub-cols { grid-template-columns: minmax(0, 1fr); }
  .gc-hub-head { grid-template-columns: auto minmax(0, 1fr); }
  .gc-hub-art { display: none; }
  .gc-missions li { grid-template-columns: minmax(0, 1fr) auto; }
  .gc-missions .gc-mbar { grid-column: 1 / -1; grid-row: 2; }
  .gc-missions em { display: none; }
}
@media (max-width: 420px) { .gc-hub-em { width: 58px; height: 58px; border-radius: 16px; } .gc-hub-em svg { width: 42px; height: 42px; } }

/* The results of a round. */
.gc-res { position: fixed; inset: 0; z-index: 8000; display: grid; place-items: center; background: var(--scrim);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gc-res .panel { width: min(520px, 100%); max-height: 100%; overflow-y: auto; display: grid; gap: 14px; text-align: center; box-shadow: var(--shadow-lg); animation: gc-rise .25s ease both; }
.gc-res h2 { margin: 0; }
.gc-res .eyebrow { margin: 0 0 -8px; }
.gc-stars { display: flex; justify-content: center; gap: 6px; margin-top: 2px; }
.gc-star svg { width: 52px; height: 52px; fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
.gc-star:nth-child(2) svg { width: 62px; height: 62px; margin-top: -8px; }
.gc-star.on svg { fill: var(--gold); stroke: color-mix(in srgb, var(--gold) 70%, black); }
.gc-star.wait svg { fill: var(--paper-2); stroke: var(--rule); }
.gc-star.pop { animation: gc-star .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes gc-star { from { transform: scale(.2) rotate(-25deg); } to { transform: none; } }
.gc-goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; justify-self: center; }
.gc-goals li { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 14.5px; }
.gc-goals li.ok { color: var(--ink); }
.gc-goals li > i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); flex: none; }
.gc-goals li > svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.gc-score { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.gc-score b { font: 650 46px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.gc-score span { color: var(--ink-2); font-weight: 600; }
.gc-score em { font-style: normal; padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; font-size: 13px; animation: gc-star .5s .9s cubic-bezier(.3,1.6,.5,1) both; }
.gc-score small { color: var(--ink-3); font-size: 13px; }
.gc-rstats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 0; }
.gc-rstats div { padding: 7px 12px; border-radius: 10px; background: var(--paper-2); min-width: 92px; }
.gc-rstats dt { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.gc-rstats dd { margin: 1px 0 0; font: 650 17px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.gc-uplist { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; }
.gc-uplist > span { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.gc-uplist b { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); font: 400 24px/1 var(--font-jp); }
.gc-uplist b small { position: absolute; right: -4px; bottom: -4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 10px/16px var(--font-ui); }
.gc-uplist em { font-style: normal; color: var(--ink-3); font-size: 13px; }
.gc-rline { margin: 0; font-weight: 600; font-size: 14px; color: var(--ink); }
.gc-town { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; padding: 9px 12px; border-radius: 12px;
  background: var(--gold-soft); font-size: 14px; }
.gc-town span:first-child { font-weight: 700; color: var(--gold-ink); }
.gc-town span:nth-child(2) { color: var(--ink-2); }
.gc-town a { color: var(--accent); font-weight: 650; }
.gc-rline b { color: var(--gold-ink); margin-right: 4px; }
.gc-res .gc-xp { text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--paper-2); }
.gc-res .gc-xpbar { background: var(--card); }
.gc-rankup { margin: 0; font: 650 18px/1.3 var(--font-display); color: var(--gc); animation: gc-star .5s 1.3s cubic-bezier(.3,1.6,.5,1) both; }
.gc-rankup b { font: 600 22px/1 var(--font-jp); }
.gc-rbtns { justify-content: center; margin-top: 2px; }
/* a long dialog on a phone scrolls under its buttons, which stay in reach */
.gc-res .gc-rbtns { position: sticky; bottom: -22px; margin-bottom: -22px; padding: 12px 0 22px; background: var(--card); }
@media (max-width: 640px) { .gc-res .gc-rbtns { bottom: -18px; margin-bottom: -18px; padding-bottom: 18px; } .gc-score b { font-size: 40px; } .gc-star svg { width: 44px; height: 44px; } .gc-star:nth-child(2) svg { width: 54px; height: 54px; } }
.gc-rbtns .btn.primary svg { fill: currentColor; stroke: none; }

/* Combos and effects. */
#gc-fx { position: fixed; inset: 0; z-index: 7000; pointer-events: none; overflow: hidden; }
.gc-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.gc-dot.gold { background: var(--gold); }
.gc-dot.gc { background: var(--gc); }
.gc-float { position: absolute; transform: translate(-50%, -50%); font: 750 20px/1 var(--font-display); color: var(--gold-ink);
  text-shadow: 0 1px 0 var(--card), 0 0 6px var(--card); white-space: nowrap; }
.gc-float.big { font-size: 28px; }
.gc-combo { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(var(--topbar) + env(safe-area-inset-top, 0px) + 12px); z-index: 6900;
  display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 14px; border-radius: 999px; background: var(--card); color: var(--ink);
  box-shadow: var(--shadow-lg); pointer-events: none; opacity: 0; transition: opacity .2s; }
.gc-combo.on { opacity: 1; }
.gc-combo b { font: 750 20px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.gc-combo span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.gc-combo.hot b { color: var(--gold-ink); }
.gc-lvchip { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px;
  padding: 7px 10px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-lg); animation: gc-rise .25s ease both; transition: opacity .35s; }
.gc-lvchip.off { opacity: 0; }
.gc-lvchip span { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13px; color: var(--ink-2); }
.gc-lvchip span.gold { color: var(--gold-ink); }
.gc-lvchip span.gold b { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); }
.gc-lvchip b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--gold-soft); color: var(--ink); font: 400 20px/1 var(--font-jp); }
@media (prefers-reduced-motion: reduce) {
  .gc-star.pop, .gc-score em, .gc-rankup, .gc-res .panel, .gc-lvchip { animation: none; }
  .gc-xpbar i { transition: none; }
}

/* The first visit to a game: its name, its first kanji and Play; the other panels (also the game's own, which
   it adds into the welcome) wait for the first round. */
.gc-hub.gc-hub-new > :not(.gc-hub-top):not(.gc-howto) { display: none !important; }
.gc-hub.gc-hub-new .gc-hub-play { margin-top: 6px; }

/* Kanji Road inside Learn Kanji: a woodblock-style print of the Tōkaidō across the top, the station of the moment;
   under it the board (the score on the road to the station's three stars, the plays left, the pace), the
   traveller's charms and the desk where kanji tiles are held, played and named. The header, pages, buttons and
   dialogs are the app's (games/frame.css); the print is drawn in the app's palette, by day in light and as a
   night print in dark. */
:root {
  --pr-ridge: color-mix(in srgb, var(--sc-hill) 55%, var(--sc-hill-2));   /* the far ridge along the horizon */
  --pr-peak: color-mix(in srgb, var(--sc-hill) 30%, var(--sc-hill-2));    /* mountains, far */
  --pr-peak-2: color-mix(in srgb, var(--sc-hill-2) 70%, var(--sc-tree));  /* and nearer */
  --seal: var(--red);                                                      /* the stations' stamps */
}

.app { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; user-select: none; -webkit-user-select: none; background: var(--paper); }
.coin { width: 18px; height: 18px; flex: none; }
.lbl { font: 600 12px/1.3 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- the road: print, board, charms, desk ---------- */
.road { min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: 12px; padding-block: 14px max(18px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.road > * { width: 100%; max-width: 980px; margin-inline: auto; }
.print { position: relative; height: clamp(150px, 25vh, 240px); border-radius: 14px; overflow: hidden; background: var(--sc-sky); box-shadow: 0 0 0 1px var(--rule), var(--shadow); }
#scene, #scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* the print's colours: the app's greens by day, a night print on the blackboard */
.sc .far { fill: var(--sc-hill); }                  /* Fuji */
.sc .snow { fill: var(--sc-foam); }
.sc .ridge { fill: var(--pr-ridge); }
.sc .peak { fill: var(--pr-peak); }
.sc .peak2 { fill: var(--pr-peak-2); }
.sc .land { fill: var(--sc-hill); }
.sc .hill { fill: var(--sc-hill-2); }
.sc .field { fill: var(--sc-hill); } .sc .field2 { fill: var(--sc-sand-2); }
.sc .shore, .sc .way { fill: var(--sc-sand); }
.sc .cliff { fill: var(--sc-hill-2); } .sc .cliff2 { fill: var(--sc-tree); }
.sc .crown { fill: color-mix(in srgb, var(--sc-deep) 80%, var(--sc-wood-3)); } .sc .crown2 { fill: color-mix(in srgb, var(--sc-tree) 55%, var(--sc-deep)); }
.sc .hull, .sc .deck, .sc .beam { fill: var(--sc-wood-2); }
.sc .sail { fill: var(--sc-cloud); }
.sc .post { fill: color-mix(in srgb, var(--sc-wood-3) 85%, var(--sc-ink)); }
.sc .torii { fill: var(--sc-red); }
.sc .robe { fill: var(--sc-deep); } .sc .robe.red { fill: var(--sc-red); }
.sc .hat { fill: var(--sc-wood); }
.sc .mist { fill: var(--sc-cloud); opacity: .78; }
.sc .ln { fill: none; stroke: var(--sc-ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; } .sc .ln.thin { stroke-width: .9; }
.sc .ln.trunk { stroke: color-mix(in srgb, var(--sc-wood-3) 65%, var(--sc-ink)); }
.sc .wv { fill: none; stroke: var(--sc-foam); stroke-width: 1.5; stroke-linecap: round; opacity: .9; }
/* the band of colour at the top of the sky and the sun's haze tint the sky by day; at night they only deepen it */
.sc .tint { mix-blend-mode: multiply; }
/* on the print: the station's name (the print's title cartouche), a checkpoint's rule, the route */
.cartouche { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; align-items: flex-start; pointer-events: none; }
.cart { writing-mode: vertical-rl; padding: 9px 6px; border-radius: 10px; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.cart.name { font: 400 25px/1.1 var(--font-jp); letter-spacing: .06em; }
.cart.series { padding: 8px 4px; font: 600 13px/1 var(--font-jp); letter-spacing: .25em; color: var(--ink-2); }
.cart small { margin-top: 6px; font: 400 12px/1 var(--font-jp); letter-spacing: .06em; color: var(--ink-2); }
.rule { position: absolute; right: 12px; bottom: 40px; max-width: calc(100% - 24px); padding: 6px 12px; border-radius: 999px; background: var(--card); color: var(--ink); font: 650 13.5px/1.3 var(--font-ui); box-shadow: var(--shadow); }
.rule::before { content: "関"; margin-right: 7px; color: var(--seal); font: 600 15px/1 var(--font-jp); }
.route { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 22px; display: flex; align-items: center; padding: 0 12px; border-radius: 11px; background: var(--card); box-shadow: var(--shadow); pointer-events: none; }
.route i { position: relative; flex: 1; height: 2px; background: var(--rule); }
.route i:first-child { flex: 0 0 0; }
.route b { position: relative; width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--grid); }
.route b.gate { border-radius: 2px; }
.route b.done { background: var(--grid); box-shadow: none; }
.route b.now { width: 13px; height: 13px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* the station opening: a card over the print for a moment */
.banner { position: absolute; left: 50%; top: 46%; z-index: 3; width: max-content; max-width: calc(100% - 28px); transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px;
  padding: 10px 22px 12px; border-radius: 14px; background: var(--card); color: var(--ink); box-shadow: var(--shadow-lg); text-align: center; pointer-events: none;
  animation: bannerin .45s cubic-bezier(.2, 1.3, .4, 1) both; transition: opacity .35s ease; }
.banner.off { opacity: 0; }
.banner h3 { margin: 0; font: 650 21px/1.25 var(--font-display); }
.banner h3 [lang="ja"] { margin-right: 6px; font: 600 25px/1 var(--font-jp); }
.banner p { margin: 0; font-size: 14.5px; color: var(--ink-2); max-width: 46ch; text-wrap: balance; }
.banner p b { color: var(--ink); }
@keyframes bannerin { from { opacity: 0; transform: translate(-50%, -38%) scale(.94); } }
/* the station's end on the print: its stamp, or the trip coming to rest */
.seal { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 35%, transparent); }
.seal .stamp { width: 124px; height: 124px; font-size: 34px; background: color-mix(in srgb, var(--card) 88%, transparent); }
.seal .stamp small { font-size: 15px; letter-spacing: .12em; }
.seal .rest { padding: 10px 18px; border-radius: 12px; background: var(--card); color: var(--ink-2); font: 650 17px/1.3 var(--font-display); box-shadow: var(--shadow-lg); }

/* the board: the score on the road to the three stars, the plays, the pace */
.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "sc meter plays pace"; gap: 6px 22px; align-items: center;
  padding: 10px 20px 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
.hsc { grid-area: sc; display: grid; min-width: 7.2em; }
.hsc .num { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hsc .num b { display: inline-block; font: 700 32px/1.05 var(--font-display); }
.hsc .num span { font: 600 16px/1 var(--font-ui); color: var(--ink-3); }
.meter { grid-area: meter; position: relative; padding: 26px 14px 22px; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, var(--gold))); }
.walker { position: absolute; bottom: 7px; left: 0; width: 18px; height: 22px; transform: translateX(-50%); pointer-events: none; }
.walker svg { width: 100%; height: 100%; display: block; }
.mk { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; }
.mk svg { width: 26px; height: 26px; display: block; fill: var(--card); stroke: var(--grid); stroke-width: 1.4; }
.mk small { position: absolute; top: calc(100% + 1px); left: 50%; transform: translateX(-50%); font: 600 12.5px/1.2 var(--font-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mk.on svg { fill: var(--gold); stroke: color-mix(in srgb, var(--gold) 70%, black); }
.mk.on small { color: var(--gold-ink); }
.mk.pop { animation: mkpop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes mkpop { 0% { transform: translate(-50%, -50%) scale(.4) rotate(-30deg); } 100% { transform: translate(-50%, -50%) scale(1); } }
.hplays { grid-area: plays; display: grid; gap: 5px; justify-items: start; }
.hplays .lbl b { margin-left: 4px; color: var(--ink); font-size: 13px; }
.pips { display: flex; gap: 5px; }
.pips i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--grid); }
.pips i.on { background: var(--accent); box-shadow: none; }
.hpace { grid-area: pace; display: grid; justify-items: center; min-width: 64px; }
.hpace b { font: 750 30px/1.05 var(--font-display); color: var(--ink-2); font-variant-numeric: tabular-nums; transition: color .2s; }
.hpace.warm b { color: var(--gold-ink); }
.hpace.hot b { color: var(--red); }

/* charms and bag */
.belt { display: flex; align-items: center; gap: 10px; min-height: 54px; }
.belt > .lbl { margin-right: 2px; }
.charmrow { display: flex; gap: 8px; }
.charm { position: relative; width: 42px; height: 53px; border: 0; padding: 0; cursor: pointer; background: none; display: grid; place-items: center; border-radius: 8px; }
.charm svg { width: 100%; height: 100%; display: block; }
.charm.empty { cursor: default; }
.charm.fire { animation: tug .6s ease; }
@keyframes tug { 30% { transform: translateY(-7px) rotate(-7deg) scale(1.08); } 60% { transform: translateY(2px) rotate(4deg); } }
.belt .grow { flex: 1; }
.belt .btn { gap: 7px; white-space: nowrap; }
.belt .btn b { font-weight: 650; font-variant-numeric: tabular-nums; }
.belt .btn .wide { margin-right: -2px; }
.shopbtn { position: relative; border-color: color-mix(in srgb, var(--gold) 55%, var(--rule)); background: var(--gold-soft); color: var(--ink); }
.shopbtn:hover { border-color: var(--gold); background: var(--gold-soft); }
.shopbtn.glow::after { content: ""; position: absolute; top: -4px; right: -4px; width: 11px; height: 11px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--paper); }
.shopbtn.glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 28%, transparent); } }

/* desk: the hand of tiles, as the app's tiles, and the check, as the app's quiz */
.desk { display: grid; gap: 10px; justify-items: center; }
.say { margin: 0; min-height: 1.5em; max-width: 62ch; font-size: 15.5px; line-height: 1.45; color: var(--ink); text-align: center; text-wrap: balance; }
.say [lang="ja"] { font-size: 1.15em; font-weight: 600; }
.say .bad { color: var(--red); font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; }
.chips .lbl { margin-right: 2px; }
.wchip { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 3px 12px 3px 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; }
.wchip:hover { border-color: var(--grid); }
.wchip .g { font: 400 21px/1.2 var(--font-jp); }
.wchip .p { font: 650 13px/1 var(--font-ui); color: var(--accent); font-variant-numeric: tabular-nums; }
.wchip.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.hand { --tw: 86px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 10px; padding: 14px 0 8px; }
.tile { position: relative; width: var(--tw); height: calc(var(--tw) * 1.34); flex: none; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; padding: 6px 4px 9px; border-radius: 12px; cursor: pointer;
  background: var(--card); border: 1px solid var(--rule); color: var(--ink); box-shadow: var(--shadow);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, opacity .2s; -webkit-tap-highlight-color: transparent; }
.tile:hover { transform: translateY(-2px); border-color: var(--grid); }
.tile .n { justify-self: start; display: inline-grid; place-items: center; min-width: 22px; height: 21px; padding: 0 6px; border-radius: 11px; background: var(--paper-2); color: var(--ink-2); font: 650 12.5px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.tile .g { align-self: center; font: 400 calc(var(--tw) * .5)/1 var(--font-jp); }
.tile .m { font: 500 12.5px/1.15 var(--font-ui); color: var(--ink-2); text-align: center; max-width: 100%; overflow-wrap: anywhere; text-wrap: balance; }
.tile .m[lang="ja"] { font: 400 13.5px/1.15 var(--font-jp); }
.tile .m:empty::before { content: "\00a0"; }
.tile .dots { position: absolute; top: 13px; right: 8px; display: flex; gap: 2px; }
.tile .dots i { width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--grid); }
.tile .dots i.on { background: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile.new::after { content: "new"; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); padding: 0 8px; border-radius: 8px; background: var(--red); color: var(--card); font: 650 11px/16px var(--font-ui); letter-spacing: .02em; }
.tile.sel { transform: translateY(-12px); border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.tile.sel .n { background: var(--accent); color: var(--accent-ink); }
.tile.twin { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), var(--shadow); }
.tile.deal { animation: deal .35s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes deal { from { transform: translateY(24px) scale(.85); opacity: 0; } }
.actions { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.actions #playbtn { min-width: 160px; }
.actions #playbtn [lang="ja"] { font-weight: 600; font-size: 1.08em; }
.btn .k { font: 500 13px/1 var(--font-ui); color: var(--ink-3); }
.check { width: 100%; max-width: 760px; display: grid; gap: 12px; padding: 16px 18px 18px; border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.check.in { animation: rise .25s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.check .q { display: flex; align-items: center; gap: 14px; }
.check .q .k { flex: none; min-width: 78px; font: 400 52px/1 var(--font-jp); text-align: center; padding: 6px 12px; border-radius: 12px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule); }
.check .q .k small { font-size: 30px; }
.check .qt { margin: 0; font: 650 20px/1.25 var(--font-display); }
.check .qt [lang="ja"] { font-size: 1.15em; font-weight: 600; }
.check .sub { margin: 2px 0 0; font-size: 14px; line-height: 1.35; color: var(--ink-2); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 14px 8px 10px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 600 16px/1.25 var(--font-ui); text-align: left; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--grid); }
.opt .no { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--paper-2); color: var(--ink-2); font: 700 13px/1 var(--font-ui); }
.opt[lang="ja"], .opt [lang="ja"] { font: 400 21px/1.2 var(--font-jp); }
.opt.right { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.right .no { background: var(--accent); color: var(--accent-ink); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.opt.wrong .no { background: var(--red); color: var(--card); }
.opt:disabled { cursor: default; }
.check .fb { margin: 0; font-size: 15.5px; line-height: 1.45; }
.check .fb [lang="ja"] { font-size: 1.15em; font-weight: 600; }
.check .fb .ok { color: var(--accent); }
.check .fb .no { color: var(--red); }
.check .fb:empty { display: none; }
.check .cont { justify-content: flex-start; }
/* a right answer's points: the scoring card, in the check's place */
.check.scoring { align-content: center; cursor: pointer; }
.tally { display: grid; justify-items: center; gap: 8px; text-align: center; }
.tally .whole { display: grid; justify-items: center; }
.tally .whole span { font: 400 14px/1.3 var(--font-jp); color: var(--ink-2); letter-spacing: .1em; }
.tally .whole b { position: relative; font: 400 54px/1.05 var(--font-jp); animation: popin .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.tally .whole b em { font-style: normal; margin-left: 4px; opacity: .55; }
.tally .mean { margin: 0; font: 650 19px/1.25 var(--font-display); }
.tally .tag { display: inline-block; vertical-align: 2px; margin-left: 4px; padding: 1px 8px; border-radius: 8px; background: var(--gold-soft); color: var(--gold-ink); font: 700 11.5px/1.5 var(--font-ui); letter-spacing: .04em; text-transform: uppercase; }
@keyframes popin { from { transform: scale(.7); opacity: 0; } }
.calc { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: 640px; font-variant-numeric: tabular-nums; }
.calc span { padding: 3px 10px; border-radius: 9px; background: var(--paper-2); color: var(--ink); font-size: 14.5px; font-weight: 600; opacity: 0; transform: translateY(6px); animation: chip .3s ease forwards; }
.calc span b[lang="ja"] { font-weight: 600; }
.calc span.x { background: var(--gold-soft); color: var(--ink); }
.calc span.x.big { background: var(--red-soft); color: var(--red); }
.calc span.t { padding: 5px 14px; background: var(--accent); color: var(--accent-ink); font-size: 17px; }
.calc span.t b { font-size: 20px; }
@keyframes chip { to { opacity: 1; transform: none; } }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 4400; overflow: hidden; }
.flyer { position: absolute; font: 750 26px/1 var(--font-display); color: var(--gold-ink); text-shadow: 0 1px 0 var(--card), 0 0 8px var(--card); white-space: nowrap; }

/* ---------- pages: the hub, tea house, travel diary, settings, and the cards ---------- */
.screen > .panel, .modal .panel { display: grid; gap: 16px; }
.screen > .panel { max-width: 900px; margin: 0 auto; }
.panel p { max-width: 64ch; }
.panel h3 .muted { margin-left: 6px; font: 400 14px/1 var(--font-ui); }
/* the hub: a print as its picture, and the trip */
.hubart { position: relative; width: 210px; height: 118px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--rule); }
.hubart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.trip { display: grid; gap: 12px; }
.triphead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.triphead .eyebrow { margin: 0; }
.tstars { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tstars svg { width: 17px; height: 17px; fill: var(--gold); }
.stations { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px 4px; }
.stations li { position: relative; display: grid; justify-items: center; gap: 4px; }
.stations li:not(:last-child)::before { content: ""; position: absolute; top: 19px; left: calc(50% + 21px); right: calc(-50% + 17px); height: 2px; background: var(--rule); }
.stations li.done:not(:last-child)::before { background: color-mix(in srgb, var(--seal) 45%, var(--rule)); }
.stations .ms { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--rule);
  font: 600 13px/1.05 var(--font-jp); text-align: center; letter-spacing: -.02em; }
.stations li.done .ms { color: var(--seal); box-shadow: inset 0 0 0 2px var(--seal), inset 0 0 0 4px var(--card), inset 0 0 0 5px var(--seal); transform: rotate(-6deg); }
.stations li.now .ms { color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 4px var(--accent-soft); }
.st3 { display: flex; gap: 2px; }
.st3 i { width: 8px; height: 8px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: var(--rule); }
.st3 i.on { background: var(--gold); }
.tnext { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.tnext b[lang="ja"] { color: var(--ink); font-weight: 600; font-size: 1.1em; }
/* a station's stamp: the one red seal of the game */
.stamp { display: inline-grid; place-items: center; align-content: center; flex: none; width: 92px; height: 92px; border-radius: 50%; color: var(--seal); box-shadow: inset 0 0 0 3px var(--seal), inset 0 0 0 6px var(--card), inset 0 0 0 7px var(--seal);
  font: 600 26px/1 var(--font-jp); text-align: center; transform: rotate(-8deg); }
.stamp small { display: block; margin-top: 4px; font: 600 11px/1.2 var(--font-ui); letter-spacing: .1em; }
.stamp.in { animation: stampin .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampin { from { transform: rotate(-8deg) scale(2.2); opacity: 0; } }
.stamp.off { color: var(--ink-3); box-shadow: inset 0 0 0 3px var(--rule), inset 0 0 0 6px var(--card), inset 0 0 0 7px var(--rule); transform: none; }
.stamp.sm { width: 58px; height: 58px; font-size: 17px; box-shadow: inset 0 0 0 2px var(--seal), inset 0 0 0 4px var(--paper-2), inset 0 0 0 5px var(--seal); }
.stamp.sm.off { box-shadow: inset 0 0 0 2px var(--rule), inset 0 0 0 4px var(--paper-2), inset 0 0 0 5px var(--rule); }
/* the results of a station (the shared dialog): the station's stamp and name, and what comes next */
.gc-res .rnote { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 12px; background: var(--paper-2); text-align: left; }
.gc-res .rnote p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.gc-res .rnote p b[lang="ja"] { color: var(--ink); font-weight: 600; font-size: 1.15em; }
.gc-res .rnext { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); text-wrap: balance; }
.gc-res .rnext b[lang="ja"] { color: var(--ink); font-weight: 600; font-size: 1.1em; }
/* the tea house: charms for sale, the belt */
.modal .panel.tea { width: min(760px, 100%); }
.teahead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.offer { display: grid; grid-template-rows: auto 1fr auto; justify-items: start; gap: 10px; padding: 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); }
.offer.sold { background: var(--accent-soft); border-color: transparent; }
.offer .charm { width: 46px; height: 58px; cursor: default; }
.offer h4 { margin: 0 0 4px; font: 650 17px/1.25 var(--font-display); }
.offer p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.offer p [lang="ja"] { color: var(--ink); font-size: 1.1em; }
.offer .fam { margin-top: 6px; color: var(--ink-3); font-size: 13px; }
.offer .buy { min-height: 40px; padding: 0 14px; font-size: 15px; }
.offer .pill.ok svg { stroke: currentColor; fill: none; stroke-width: 2.4; }
.beltlist { display: grid; gap: 8px; }
.beltc { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 10px; border: 1px solid var(--rule); background: var(--card); font-size: 14px; }
.beltc .charm, .beltc .charm svg { width: 28px; height: 36px; cursor: default; }
.price { display: inline-flex; align-items: center; gap: 4px; font-weight: 650; font-variant-numeric: tabular-nums; }
.bagview { display: flex; flex-wrap: wrap; gap: 6px; }
.bagview .bt { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 14px; background: var(--paper-2); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.bagview .bt .g { font: 400 19px/1.1 var(--font-jp); }
/* a word's card */
.wordbig { display: grid; justify-items: center; }
.wordbig span { font: 400 16px/1.3 var(--font-jp); color: var(--ink-2); }
.wordbig b { font: 400 64px/1.05 var(--font-jp); }
.mean2 { margin: 0; font: 650 clamp(22px, 3vw, 28px)/1.2 var(--font-display); text-wrap: balance; }
.rd { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--ink-2); }
/* the travel diary: kanji, words, stamps */
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.wc { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 10px; min-width: 0; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; color: var(--ink); text-align: left; }
.wc:hover { border-color: var(--grid); }
.wc .g { grid-row: span 2; font: 400 27px/1 var(--font-jp); }
.wc .r { font: 400 13px/1.2 var(--font-jp); color: var(--ink-2); overflow-wrap: anywhere; }
.wc .m { font-size: 13.5px; line-height: 1.2; min-width: 0; }
.wc.locked { cursor: default; background: transparent; border-style: dashed; color: var(--ink-3); min-height: 54px; }
.wc.locked:hover { border-color: var(--rule); }
.wc.locked .g { color: var(--ink-3); opacity: .6; }
.wc.locked .r { font-family: var(--font-ui); color: var(--ink-3); }
.kc .s { font-size: 12px; color: var(--ink-3); }
.kc .lv { margin-top: 2px; }
.kc.locked svg { width: 26px; height: 26px; margin-block: 7px 5px; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; justify-items: center; }
.stamps .st { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 13px; color: var(--ink-2); }
.stamps .st3 i { width: 11px; height: 11px; }

@media (max-width: 720px) {
  .road { gap: 10px; padding-block: 10px max(14px, env(safe-area-inset-bottom, 0px)); }
  .print { height: 132px; }
  .cart { padding: 7px 4px; }
  .cart.name { font-size: 20px; letter-spacing: .04em; }
  .cart small { display: none; }
  .cart.series { display: none; }
  .cartouche { top: 9px; left: 9px; }
  .rule { bottom: 32px; right: 9px; max-width: calc(100% - 18px); font-size: 12.5px; padding: 4px 10px; }
  .route { left: 8px; right: 8px; bottom: 8px; height: 18px; padding: 0 9px; }
  .route b { width: 8px; height: 8px; }
  .route b.now { width: 11px; height: 11px; }
  .banner { top: 44%; padding: 8px 16px 10px; }
  .banner h3 { font-size: 18px; }
  .banner h3 [lang="ja"] { font-size: 21px; }
  .banner p { font-size: 13.5px; }
  .seal .stamp { width: 96px; height: 96px; font-size: 27px; }
  .hud { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "sc plays pace" "meter meter meter"; gap: 0 16px; padding: 10px 14px 4px; }
  .hsc .num b { font-size: 28px; }
  .meter { padding: 24px 13px 20px; }
  .hpace { min-width: 52px; }
  .hpace b { font-size: 26px; }
  .belt { gap: 8px; min-height: 46px; }
  .belt > .lbl, .belt .btn .wide { display: none; }
  .charmrow { gap: 5px; }
  .charm { width: 35px; height: 44px; }
  .belt .btn { padding: 0 11px; }
  .say { font-size: 15px; }
  .hand { --tw: min(92px, calc((100vw - 32px - 3 * 8px) / 4)); gap: 12px 8px; padding: 12px 0 8px; }
  .tile .g { font-size: calc(var(--tw) * .46); }
  .tile .m { font-size: 12px; }
  .check { padding: 14px 14px 16px; }
  .check .q .k { min-width: 66px; font-size: 44px; }
  .check .qt { font-size: 18px; }
  .opts { gap: 8px; }
  .opt { min-height: 50px; font-size: 15px; padding: 6px 10px 6px 8px; gap: 10px; }
  .tally .whole b { font-size: 44px; }
  .tally .mean { font-size: 17px; }
  .calc span { font-size: 13.5px; padding: 3px 8px; }
  .calc span.t { font-size: 15.5px; }
  .offers { grid-template-columns: minmax(0, 1fr); }
  .offer { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; align-items: start; column-gap: 12px; }
  .offer .charm { grid-row: span 2; }
  .offer .buy, .offer .pill { grid-column: 2; }
  .stations { grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 12px; }
  .stations li:nth-child(6)::before { display: none; }
  .gc-res .rnote { gap: 12px; padding: 10px 12px; }
}
@media (max-width: 520px) {
  .belt { gap: 6px; }
  .charmrow { gap: 4px; }
  .charm { width: 32px; height: 40px; }
  .belt .btn { padding: 0 10px; gap: 5px; }
  .belt .bag { padding: 0 9px; gap: 4px; }
}
@media (max-width: 380px) {
  .hud { gap: 0 10px; }
  .charm { width: 29px; height: 37px; }
  .belt .bag b { display: none; }   /* the count is in the bag's card */
}
/* short phones: a lower print and smaller tiles, so the hand and Play fit */
@media (max-width: 720px) and (max-height: 740px) and (orientation: portrait) {
  .road { gap: 8px; padding-top: 8px; }
  .print { height: 100px; }
  .banner { padding: 6px 14px 8px; }
  .banner .eyebrow { display: none; }
  .hud { padding: 6px 14px 0; }
  .hsc .num b, .hpace b { font-size: 24px; }
  .meter { padding: 21px 13px 17px; }
  .belt { min-height: 40px; }
  .charm { width: 31px; height: 39px; }
  .say { font-size: 14px; min-height: 0; }
  .hand { --tw: min(80px, calc((100vw - 32px - 3 * 8px) / 4)); padding: 8px 0 6px; gap: 11px 8px; }
  .tile { height: calc(var(--tw) * 1.2); padding-bottom: 7px; }
  .actions .btn.big { min-height: 46px; }
}
@media (min-width: 721px) and (max-width: 940px) { .hand { --tw: 78px; } }
/* phones on their side: the print, the board and the charms on the left, the tiles (and the check) on the right */
@media (orientation: landscape) and (max-height: 500px) and (min-width: 640px) {
  .road { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto auto auto 1fr; column-gap: 16px; }
  .road > * { max-width: none; }
  .print { grid-column: 1; grid-row: 1; height: 112px; }
  .cart { padding: 6px 4px; }
  .cart.name { font-size: 18px; letter-spacing: .04em; }
  .cart small { display: none; }
  .cart.series { display: none; }
  .route { left: 8px; right: 8px; bottom: 7px; height: 18px; padding: 0 9px; }
  .rule { bottom: 31px; right: 8px; font-size: 12px; padding: 3px 9px; }

  .opt { min-height: 44px; }

     host → page  {type:'plans', available, plans:[{id, found, owned, active, expires, subscription, period,

   until its end (and a few days more, in case the renewal could not be seen offline).
   Besides Basic 1, lessons stay open that were started while they were free (before 1.4 the first half of
   every level was free), and lessons can be earned (src/js/journey.js: weekly goals, streaks, friends).
   Earned lessons are kept apart from the Store's licences and never asked of the Store.

   plan a one-time product. Google Play does not tell an app when a subscription renews, so the page shows the
   plan as active, without a date. Two more messages there: "save <json {name, text}>" (the system's save dialog;
   answer {type:'saved', ok, cancelled}) and "share <text>" (the system's share sheet).
   The web edition (KAKITORI_SHOP, from web/shop.json) has no host: Full is sold on Gumroad, and the learner
   enters the license key from the receipt. The key is checked with Gumroad's license API from the page itself
   (the API answers browsers), once with a count of the devices, then now and then while online; what it said
   is cached like the Stores' answers. A yearly or monthly membership that was cancelled stays open until the end

  const KEY = 'kakitori:unlock';     // 'yes': the lifetime unlock (since 1.3)
  const SUB = 'kakitori:plan';       // {plan, expires, checked, exact}: a subscription, as the Store last told it

    url: `https://play.google.com/store/apps/details?id=${PKG}`,
    manage: `https://play.google.com/store/account/subscriptions?package=${PKG}${(IDS.year || IDS.month) ? `&sku=${encodeURIComponent((IDS.year || IDS.month).split(':')[0])}` : ''}`,
    manageText: 'Payments &amp; subscriptions', cancelIn: 'Google Play',
  } : SHOP ? {
    name: 'Gumroad', the: 'Gumroad', inThe: 'in your browser', account: 'Gumroad purchase', os: 'your device',
    url: SHOP.site || 'https://learnkanji.app/',
    manage: 'https://app.gumroad.com/library',
    manageText: 'Manage membership', cancelIn: 'your Gumroad receipt',
  } : {
    name: 'Microsoft Store', the: 'the Microsoft Store', inThe: 'in the Microsoft Store', account: 'Microsoft account', os: native ? 'Windows' : 'your device',

  let lifetime = read(KEY) === 'yes';
  // exact: the Store gave the end date (the Microsoft Store does; Google Play does not, so the end is an estimate
  // that only decides how long the plan stays open offline)
  let sub = (() => { const s = json(SUB); return s && IDS[s.plan] && s.plan !== 'lifetime' && +s.expires > 0 ? { plan: s.plan, expires: +s.expires, checked: +s.checked || 0, exact: s.exact !== false } : null; })();
  let offers = {};                   // plan → what the Store said about it (price, period, trial…)
  let storeAnswered = false, buying = null, buyingPlan = '', saving = null;
  if (SHOP) {   // the web edition's prices are its own, so the plans are known at once
    for (const plan of ORDER) {
      const c = shopPlan(plan);
      if (!c) continue;
      const recurring = plan !== 'lifetime';
      offers[plan] = { plan, id: c.product_id, found: true, url: c.url || '', price: c.price || '', recurrence: recurring ? c.price || '' : '',
        amount: c.amount || '', currency: c.currency || 'EUR', subscription: recurring, period: recurring ? c.period || 1 : 0, unit: recurring ? (c.unit != null ? c.unit : plan === 'year' ? 5 : 4) : -1,
        trial: !!c.trial, trialPeriod: c.trial ? c.trial.period || 1 : 0, trialUnit: c.trial ? (c.trial.unit != null ? c.trial.unit : 3) : -1, onSale: false, base: '' };

  const listeners = new Set();

  const unlocked = () => lifetime || subOn();
  function setLifetime(v) { lifetime = !!v; write(KEY, lifetime ? 'yes' : null); }
  function setSub(s) { sub = s; write(SUB, s ? JSON.stringify(s) : null); }

  /** Store periods in days, for a subscription the Store did not give an end for yet. */
  const UNIT_DAYS = { 2: 1, 3: 7, 4: 31, 5: 366 };
  const periodDays = o => (o && o.period && UNIT_DAYS[o.unit] ? o.period * UNIT_DAYS[o.unit] : 0);

  function onPlans(m) {
    const now = Date.now();
    const list = Array.isArray(m.plans) ? m.plans : [];
    const next = {};
    for (const x of list) {
      const plan = planOf(x && x.id);
      if (plan) next[plan] = { ...x, plan };
    }
    if (list.some(x => x && x.found)) offers = next;
    // Only a definite answer from the Store changes what is saved; offline, the cache stands.
    if (m.available) {

      const life = next.lifetime;
      setLifetime(!!life && (life.active || (life.owned && !life.subscription)));
      let best = null;
      for (const plan of ['year', 'month']) {
        const x = next[plan];
        if (!x || !x.active) continue;
        const exact = +x.expires > now;
        const expires = exact ? +x.expires : now + Math.max(7, periodDays(x)) * DAY;
        if (!best || expires > best.expires) best = { plan, expires, checked: now, exact };
      }
      setSub(best);
    }
  }
  if (host) host.addEventListener('message', e => {
    const m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'plans') {
      onPlans(m);
      checks.splice(0).forEach(r => r(m));
      emit();
    } else if (m.type === 'purchase') {
      const plan = planOf(m.id) || buyingPlan;
      if (m.unlocked) {
        if (plan === 'lifetime') setLifetime(true);
        else if (plan) setSub({ plan, expires: Date.now() + Math.max(7, periodDays(offers[plan])) * DAY, checked: Date.now(), exact: false });

      emit();
      if (done) done({ ...m, plan });

    } else if (m.type === 'saved') {

      if (done) done(m);
    }

  const ids = () => ORDER.map(p => IDS[p]).filter(Boolean);
  /** Ask the Store about the plans. Resolves with the host's answer. In the web edition: check the license key
      entered here with Gumroad (force: even if it was checked a moment ago). */
  function check(force) {
    if (SHOP) return shopCheck(force);
    if (!host || !ids().length) return Promise.resolve({ type: 'plans', available: false, plans: [] });
    return new Promise(r => { checks.push(r); if (checks.length === 1) host.postMessage('plans ' + ids().join(' ')); });

  /** Show the Store purchase dialog for a plan ('year', 'month' or 'lifetime'). Resolves with {status, unlocked, plan}. */
  function buy(plan = 'lifetime') {

      const o = offers[plan];
      if (o && o.url) { try { window.open(o.url, '_blank', 'noopener'); } catch (e) { /* blocked */ } }
      return Promise.resolve({ type: 'purchase', status: o && o.url ? 'external' : 'unavailable', unlocked: false, plan });

    if (!host || !IDS[plan]) return Promise.resolve({ type: 'purchase', status: 'unavailable', unlocked: false, plan });

  /** Google Play edition: save a file where the learner chooses (the system's save dialog).
      Resolves with {ok, cancelled}; elsewhere with {ok: false, unavailable: true}. */
  function save(name, text) {
    if (!host || !android) return Promise.resolve({ ok: false, unavailable: true });
    if (saving) saving({ ok: false, cancelled: true });   // a dialog that never answered (the app was left)
    return new Promise(r => { saving = r; host.postMessage('save ' + JSON.stringify({ name, text })); });
  }
  /** Google Play edition: hand a text to the system's share sheet. False where there is none. */
  function share(text) {

    host.postMessage('share ' + text);

  }

  /* ---------- the web edition: Gumroad license keys ---------- */
  const API = (SHOP && SHOP.api) || 'https://api.gumroad.com/v2/licenses/verify';
  const DEVICES = (SHOP && +SHOP.devices) || 10;
  const license = () => { const l = json(LIC); return l && l.key && IDS[l.plan] && IDS[l.plan] === l.product ? l : null; };
  const saveLicense = l => write(LIC, l ? JSON.stringify(l) : null);
  /** Ask Gumroad about a key for one product: {ok, purchase, uses} | {ok: false, message} | {offline: true}. */
  async function verify(product, key, count) {
    const body = new URLSearchParams({ product_id: product, license_key: key, increment_uses_count: count ? 'true' : 'false' });
    let r, j = null;
    try { r = await fetch(API, { method: 'POST', body }); } catch (e) { return { offline: true }; }
    try { j = await r.json(); } catch (e) { j = null; }
    if (r.ok && j && j.success) return { ok: true, purchase: j.purchase || {}, uses: +j.uses || 0 };
    if (r.status === 404 || (j && j.success === false)) return { ok: false, message: (j && j.message) || '' };

  function allows(plan, p) {
    if (p.refunded || p.chargebacked || (p.disputed && !p.dispute_won)) return { valid: false, why: 'refunded' };

    return { valid: true, ends: end };

  }
  /** Web edition: the lessons (beyond Basic 1) that the earlier, complete web version had been used in. */
  function startedAny(cards, gameKanji) {
    const out = new Set();
    for (const k of [...Object.keys(cards || {}), ...Object.keys(gameKanji || {})]) {
      const r = KDATA.kanji[k];
      if (r && !free().has(r.l)) out.add(r.l);
    }
    return out;
  }
  const keepable = n => (SHOP ? n >= 1 && n <= KDATA.lessons.length && !free().has(n) : oldFree().has(n));

    if (keptSet) return keptSet;
    const saved = json(KEPT);
    if (Array.isArray(saved)) keptSet = new Set(saved.map(Number).filter(keepable));
    else {

      const app = json('kakitori:v1') || {}, games = json('kakitori:games:v1') || {};
      keptSet = native ? startedIn(app.cards, games.k) : SHOP ? startedAny(app.cards, games.k) : new Set();
      write(KEPT, JSON.stringify([...keptSet].sort((a, b) => a - b)));

  /** A backup made on another device brings the lessons it kept (or, from before 1.4, the ones it had started). */

    const add = Array.isArray(list) ? list.map(Number).filter(keepable) : [...(SHOP ? startedAny : startedIn)(cards, gameKanji)];
    const k = kept();
    let changed = false;
    for (const n of add) if (!k.has(n)) { k.add(n); changed = true; }
    if (changed) { write(KEPT, JSON.stringify([...k].sort((a, b) => a - b))); emit(); }
  }

  let earned = new Set();
  /** The journey tells which lessons were earned. */
  function setEarned(list) {
    const sig = [...earned].join(',');
