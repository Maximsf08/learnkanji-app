  /** The plan the learner has: 'lifetime', 'year', 'month' or ''. */
  const plan = () => (lifetime ? 'lifetime' : subOn() ? sub.plan : '');
  /** What the Store offers, in the order shown: [{plan, price, recurrence, period, unit, trial, …}]. */
  const offerList = () => ORDER.filter(p => IDS[p] && offers[p] && offers[p].found).map(p => offers[p]);

  return {
    native, platform, android, paid, shop: !!SHOP, check, buy, theme, save, share, activate, forget, setEarned, importKept, unitLocked, kanjiLocked,
    IDS, MANAGE, STORE,
    /** Web edition: the key entered on this browser, shortened for display ('' for none), and its plan. */
    get licenseHint() { const l = license(); return l ? `${l.key.slice(0, 4)}…${l.key.slice(-4)}` : ''; },
    get licensePlan() { const l = license(); return l ? l.plan : ''; },
    DEVICES,
    get locks() { return locks(); },
    get unlocked() { return unlocked(); },
    get plan() { return plan(); },
    /** When the subscription ends or renews (ms), as the Store last said; 0 for none, for the lifetime plan, or
        when the Store gave no date (Google Play). */
    get expires() { return !lifetime && subOn() && sub.exact ? sub.expires : 0; },
    get offers() { return offerList(); },
    offer: p => (offers[p] && offers[p].found ? offers[p] : null),
    isEarned: n => earned.has(+n),
    isKept: n => kept().has(+n),
    isFree: n => free().has(+n),
    keptList: () => [...kept()],
    get price() { const o = offers.lifetime; return (o && o.found && o.price) || ''; },
    get buying() { return !!buying; },
    get buyingPlan() { return buyingPlan; },
    get storeAnswered() { return storeAnswered; },
    get freeKanji() { free(); return freeK; },
    get freeLessons() { return free().size; },
    get freeBook() { return KDATA.books[0]; },
    onChange(f) { listeners.add(f); return () => listeners.delete(f); },
  };
})();

/* Kanji Valley art, in a woodblock-print style: flat colour blocks with keyblock outlines.
   Picture cards are drawn in the KanjiVG box (0..109) around each kanji's own strokes, so the
   picture turns into the kanji. The valley scene is 1000 x 760; each kanji prints one item. */
'use strict';
const Art = (() => {
  const f = n => +(+n).toFixed(1);
  const nums = d => (d.match(/-?\d+\.?\d*/g) || []).map(Number);
  const ends = d => { const n = nums(d); return [[n[0], n[1]], [n[n.length - 2], n[n.length - 1]]]; };
  const S = ch => (KDATA.kanji[ch] || { s: [] }).s;
  const tail = d => d.replace(/^M[^A-Za-z]*/, '');

  /* ---- primitives ---- */
  const k = (d, cls = '') => `<path class="k ${cls}" d="${d}" pathLength="1"/>`;
  const fp = (d, cls, style = '') => `<path class="c ${cls}" d="${d}"${style ? ` style="${style}"` : ''}/>`;
  const ci = (x, y, r, cls) => `<circle class="c ${cls}" cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
  const kc = (x, y, r, cls = '') => k(`M${f(x - r)},${f(y)}a${f(r)},${f(r)} 0 1 0 ${f(2 * r)},0a${f(r)},${f(r)} 0 1 0 ${f(-2 * r)},0`, cls);
  /** A thick coloured stroke with a keyblock outline under it. */
  const fat = (d, w, cls) => `<path class="c ol" d="${d}" style="stroke-width:${f(w + 1.5)}"/><path class="c ${cls}" d="${d}" style="stroke-width:${f(w)}"/>`;
  /** Blobs drawn as one outlined shape: outline layer first, fills on top. */
  const blobs = (list, cls, pad = 1.1) =>
    list.map(([x, y, r]) => ci(x, y, r + pad, 'f-key')).join('') + list.map(([x, y, r]) => ci(x, y, r, cls)).join('');
  const quad = p => `M${p.map(q => q.map(f).join(',')).join('L')}Z`;

  function crescent(cx1, cy1, r1, cx2, cy2, r2) {
    const dx = cx2 - cx1, dy = cy2 - cy1, d = Math.hypot(dx, dy);
    const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
    const px = cx1 + a * dx / d, py = cy1 + a * dy / d;
    const p1 = [px + h * dy / d, py - h * dx / d], p2 = [px - h * dy / d, py + h * dx / d];
    return `M${f(p1[0])},${f(p1[1])}A${r1},${r1} 0 1 0 ${f(p2[0])},${f(p2[1])}A${r2},${r2} 0 0 1 ${f(p1[0])},${f(p1[1])}Z`;
  }

  /* ================= picture cards (109 box) ================= */

  /** A tree whose branches are a 木's strokes: [branch, trunk, sweep left, sweep right]. */
  function treePic(st, s = 1) {
    const [br, tr, sl, sr] = st;
    const top = ends(tr)[0], [b0, b1] = ends(br), l1 = ends(sl)[1], r1 = ends(sr)[1];
    const crown = [[top[0], top[1] + 5 * s, 10 * s], [top[0] - 9 * s, top[1] + 13 * s, 7.5 * s], [top[0] + 9 * s, top[1] + 13 * s, 7.5 * s]];
    const leaves = [[b0[0], b0[1], 6.5 * s], [b1[0], b1[1], 6.5 * s], [l1[0], l1[1], 6.5 * s], [r1[0], r1[1], 6 * s]];
    return fat(tr, 5.2 * s, 's-wood') + fat(br, 3.4 * s, 's-wood') + fat(sl, 3 * s, 's-wood') + fat(sr, 3 * s, 's-wood') +
      blobs(crown.concat(leaves), 'f-leaf', 0.9) +
      crown.concat(leaves).map(([x, y, r]) => ci(x - r * 0.3, y - r * 0.32, r * 0.42, 'f-leaf-hi')).join('');
  }

  function rays(cx, cy, r0, r1, n, rot = 0) {
    let out = '';
    for (let i = 0; i < n; i++) {
      const a = rot + i / n * Math.PI * 2;
      out += `<path class="c s-ray" d="M${f(cx + Math.cos(a) * r0)},${f(cy + Math.sin(a) * r0)}L${f(cx + Math.cos(a) * r1)},${f(cy + Math.sin(a) * r1)}"/>`;
    }
    return out;
  }

  const stars = pts => pts.map(([x, y, r]) => ci(x, y, r, 'f-star')).join('');

  const C = {};
  C['一'] = () => {

  C['川'] = () => {

  };

  C['月'] = () => {

/* Kana helpers shared by the app and the games: romaji for any kana reading, so that nothing in
   Learn Kanji needs hiragana or katakana to be read. Hepburn, with long vowels written as they are
   spelled (がっこう → gakkou, ー as a macron: ゲーム → gēmu); "." (okurigana) is dropped, "-" kept. */
'use strict';
const Kana = (() => {
  const hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const ROMA = {
    あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o', か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko', さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
    た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to', な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no', は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
    ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo', や: 'ya', ゆ: 'yu', よ: 'yo', ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro', わ: 'wa', ゐ: 'i', ゑ: 'e', を: 'o', ん: 'n',
    が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go', ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo', だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
    ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ゔ: 'vu',
    ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゎ: 'wa', ゕ: 'ka', ゖ: 'ke',
  };
  const YOON = { ゃ: 'a', ゅ: 'u', ょ: 'o' };
  // Small vowels after a kana make the sounds of loanwords: ティ ti, ファ fa, ウィ wi, ジェ je …
  const SMALL = { ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o' };
  const MACRON = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };
  /** Romaji for a kana string. Characters that are not kana (kanji, Latin, punctuation) are kept. */
  function romaji(s) {
    const t = hira(s).replace(/\./g, '');
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const c = t[i], nx = t[i + 1];
      if (c === 'っ') { const r = ROMA[nx] || ''; out += r && /[a-z]/.test(r[0]) && !/[aiueon]/.test(r[0]) ? (r.startsWith('ch') ? 't' : r[0]) : ''; continue; }
      if (c === 'ー') { const v = out.slice(-1); out = out.slice(0, -1) + (MACRON[v] || v); continue; }
      if (c === 'ん') { out += 'n' + (nx && /[あいうえおやゆよ]/.test(nx) ? "'" : ''); continue; }
      if (c === '・') { out += ' '; continue; }
      let r = ROMA[c];
      if (r === undefined) { out += c; continue; }
      if (nx && YOON[nx] && r.length > 1) {
        const base = r.slice(0, -1);
        r = (base === 'sh' || base === 'ch' || base === 'j') ? base + YOON[nx] : base + 'y' + YOON[nx];
        i++;
      } else if (nx && SMALL[nx] && /[てでうふしちじ]/.test(c)) {
        const base = { て: 't', で: 'd', う: 'w', ふ: 'f', し: 'sh', ち: 'ch', じ: 'j' }[c];
        r = base + SMALL[nx];
        i++;
      }
      out += r;
    }
    return out.replace(/\s+/g, ' ').trim();
  }
  const hasKana = s => /[ぁ-ゖァ-ヺー]/.test(String(s));
  return { romaji, hira, hasKana };
})();

/* The learner's goal: what the games, the journey and the home screen focus on, so nobody is given
   kanji their course or exam does not ask for. Kept in the app's settings (localStorage 'kakitori:v1',
   settings.goal) and read by the games too:
     {kind:'auto'}                      the level you are studying (the default; see currentLevel)
     {kind:'course', level:'B1', upTo}  one level of the app (a course that follows the books);
                                        upTo: the last lesson (unit number) the class has reached
     {kind:'jlpt', level:4}             a JLPT level and every level below it (N4 = N5 + N4)
     {kind:'all'}                       every kanji in the app
   JLPT levels: KDATA kanji field j (5 = N5 … 1 = N1), from Jonathan Waller's lists (tools/make_jlpt.py). */
'use strict';
const Goal = (() => {
  const APP = 'kakitori:v1';
  const K = () => KDATA.kanji;
  const books = () => KDATA.books;
  const lessonOf = n => KDATA.lessons[n - 1];
  const bookIndex = id => books().findIndex(b => b.id === id);
  const appState = () => {
    if (typeof Store !== 'undefined' && Store.state) return Store.state;
    try { return JSON.parse(localStorage.getItem(APP) || 'null') || {}; } catch (e) { return {}; }
  };
  const JLPT = [5, 4, 3, 2, 1];
  const jname = n => 'N' + n;

  function normalize(g) {
    if (!g || typeof g !== 'object') return { kind: 'auto' };
    if (g.kind === 'course' && bookIndex(g.level) >= 0) {
      const o = { kind: 'course', level: g.level };
      const l = +g.upTo && lessonOf(+g.upTo);
      if (l && l.b === g.level) o.upTo = +g.upTo;
      return o;
    }
    if (g.kind === 'jlpt' && JLPT.includes(+g.level)) return { kind: 'jlpt', level: +g.level };
    if (g.kind === 'all') return { kind: 'all' };
    return { kind: 'auto' };
  }
  /** The goal as stored (normalized). */
  const stored = () => normalize((appState().settings || {}).goal);

  /** The level you are studying: the level of the kanji you learned last, or the next level with kanji
      still to learn once that one is done (opening a lesson to look at it changes nothing). */
  function currentLevel() {
    const s = appState(), cards = s.cards || {}, order = books().map(b => b.id);
    let lastK = null, lastT = -1;
    for (const [k, c] of Object.entries(cards)) if (K()[k] && c && (+c.added || 0) > lastT) { lastT = +c.added || 0; lastK = k; }
    const open = k => typeof Edition === 'undefined' || !Edition.kanjiLocked(k);
    const hasNew = id => KDATA.lessons.some(l => l.b === id && [...l.kanji].some(k => !cards[k] && open(k)));
    const start = lastK ? Math.max(0, order.indexOf(lessonOf(K()[lastK].l).b)) : 0;
    for (let i = 0; i < order.length; i++) { const id = order[(start + i) % order.length]; if (hasNew(id)) return id; }
    return order[start];
  }

  /** The goal, resolved: {kind, level, upTo, auto, id, label, short, test(k), keep(k)}.
      test: is kanji k part of the goal. keep: may a kanji already met stay in play (the goal, or an
      easier level). */
  let memo = null;   // a game page reads the goal once (the app re-reads it: the level you are on moves)
  function resolve(g) {
    const plain = g === undefined, cache = plain && typeof Store === 'undefined';
    if (cache && memo) return memo;
    g = normalize(plain ? stored() : g);
    const auto = g.kind === 'auto';
    if (auto) g = { kind: 'course', level: currentLevel() };
    let test, keep, dist, label, short, id;
    if (g.kind === 'course') {
      const b = books()[bookIndex(g.level)], bi = bookIndex(g.level);
      const up = g.upTo ? lessonOf(g.upTo) : null;
      test = k => { const r = K()[k]; if (!r) return false; const l = lessonOf(r.l); return l.b === g.level && (!g.upTo || r.l <= g.upTo); };
      keep = k => { const r = K()[k]; return !!r && bookIndex(lessonOf(r.l).b) <= bi; };
      // how far a kanji is from the goal: easier levels first, then the next harder ones
      dist = k => { const r = K()[k]; if (!r || test(k)) return 0; const d = bookIndex(lessonOf(r.l).b) - bi; return d <= 0 ? -d * 0.5 + (d === 0 ? 0.25 : 0) : d; };
      short = b.short;
      const upName = up ? `${up.k === 'L' ? 'Lesson' : up.k === 'R' ? 'Review' : 'Column'} ${up.ln}` : '';
      label = up ? `${b.short}, up to ${upName}` : b.short;
      id = `course:${g.level}${g.upTo ? ':' + g.upTo : ''}`;
    } else if (g.kind === 'jlpt') {
      test = k => { const r = K()[k]; return !!r && (r.j || 1) >= g.level; };
      keep = test;
      dist = k => { const r = K()[k]; return !r ? 9 : Math.max(0, g.level - (r.j || 1)); };
      short = label = `JLPT ${jname(g.level)}`;
      id = `jlpt:${g.level}`;
    } else {
      test = k => !!K()[k];
      keep = test;
      dist = () => 0;
      short = 'All levels'; label = 'All levels';
      id = 'all';
    }
    const out = { ...g, auto, id: auto ? 'auto:' + id : id, label, short, test, keep, dist };
    if (cache) memo = out;
    return out;
  }

  /** The goal's kanji, in the order of the lessons. */
  function syllabus(g) {
    const r = resolve(g);
    const out = [];
    for (const l of KDATA.lessons) for (const k of l.kanji) if (r.test(k)) out.push(k);
    return out;
  }
  /** How many kanji a goal has (for the goal picker). */
  const size = g => syllabus(g).length;
  /** Kanji at each JLPT level (not cumulative). */
  function jlptCounts() {
    const c = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
    for (const r of Object.values(K())) c[r.j || 1]++;
    return c;
  }
  return { stored, resolve, syllabus, size, normalize, currentLevel, jlptCounts, JLPT, jname, get: () => resolve(), forget: () => { memo = null; } };
})();

/* The journey: the seven games as one trip through old Japan, and the rewards that keep a learner going.
   Shared by the app and the game pages; kept in localStorage 'kakitori:journey:v1'.

   Route: the river (Koi) → the inn kitchen → the Tōkaidō (Road) → the temple school → the castle town
   → the apothecary (Alchemy) → the teahouse (Tiles), then round again. A stop asks for STEPS level-ups
   of that game's kanji of your goal (a kanji going from level 0 to 1, 1 to 2 or 2 to 3); a game with
   nothing left to raise is passed by. Finishing a stop writes a stamp in the journal and sends you on to the next place.

   Rewards (the free version of the Store edition: each one is a locked lesson, opened for good):
     - the weekly goal: finish one stop between Monday and Sunday
     - every 7 days in a row of practice (lessons, reviews or games)
     - friends: your invite code gives a friend a lesson; their thank-you code gives you one
   With everything unlocked, the same moments earn stamps instead. No reward ever depends on a rating
   or a review. Earned lessons are kept apart from the Store's licences, and survive Reset progress.
   (Before 1.4 five friends opened every lesson; with paid plans, each friend is one lesson.) */
'use strict';
const Journey = (() => {
  const KEY = 'kakitori:journey:v1', GKEY = 'kakitori:games:v1', AKEY = 'kakitori:v1';
  const ROUTE = ['koi', 'kitchen', 'road', 'school', 'castle', 'alchemy', 'tiles'];
  const STEPS = 6, STREAK = 7;
  const PLACES = {
    koi: { title: 'The river', jp: '川辺', gift: 'a paper carp streamer', from: 'the river',
      arrive: 'Dawn on the river. A boatman is raising the carp streamers: “The lanterns over the water carry kanji of land, water and sky. Fly with the koi and catch the right ones.”' },
    kitchen: { title: 'The inn kitchen', jp: '宿の台所', gift: 'a lunch box', from: 'the inn',
      arrive: 'Downriver, the cook of a small inn waves you into her kitchen: “My regulars order by the kanji on the menu. Can you find the right jar?”' },
    road: { title: 'The Tōkaidō', jp: '東海道', gift: 'a pair of straw sandals', from: 'the Tōkaidō',
      arrive: 'With the inn’s lunch box in your bag you set off along the Tōkaidō, the old road to Kyoto. Every station on it has kanji of places and travel, of moving, carrying and making.' },
    school: { title: 'The temple school', jp: '寺子屋', gift: 'a karuta card signed by Sensei', from: 'the temple school',
      arrive: 'At the end of the road stands a temple school. Sensei is holding a karuta tournament, and needs a player who knows the kanji of study, words and the arts.' },
    castle: { title: 'The castle town', jp: '城下町', gift: 'a lord’s banner', from: 'the castle town',
      arrive: 'One of Sensei’s old pupils serves the lord of the castle town. Rival lords are claiming the old provinces, under banners of society and law, money and work.' },
    alchemy: { title: 'The apothecary', jp: '薬屋', gift: 'a paper packet of medicine', from: 'the apothecary',
      arrive: 'After the battles, the town’s apothecary has more slips than hands. Each medicine is a kanji of the body or of science, made by merging its parts on the counter.' },
    tiles: { title: 'The teahouse', jp: '茶屋', gift: 'a cup of green tea', from: 'the teahouse',
      arrive: 'Home again. The teahouse keeper sets out tiles: “Sort what you have learned, each kanji with its meaning and its reading, while the tea is warm.”' },
  };
  const LAP_LINES = ['', 'A new season on the road. ', 'The road is familiar now, and so are the kanji. ', 'Another lap of the road: time to master what you know. '];

  /* ---------------- storage ---------------- */
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
  const fresh = () => ({ v: 1, name: '', id: '', lap: 1, at: 0, stop: null, log: [], weeks: {}, earned: [], friends: [],
    invitedBy: '', thanks: '', all: false, days: {}, streaks: [], badges: {} });
  function normalize(s) {
    const o = fresh();
    if (!s || typeof s !== 'object') return o;
    for (const f of ['name', 'id', 'invitedBy', 'thanks']) if (typeof s[f] === 'string') o[f] = s[f].slice(0, 40);
    for (const f of ['lap', 'at']) if (Number.isFinite(+s[f])) o[f] = Math.max(f === 'lap' ? 1 : 0, Math.floor(+s[f]));
    o.at %= ROUTE.length;
    if (s.stop && typeof s.stop === 'object' && ROUTE.includes(s.stop.g)) o.stop = s.stop;
    if (Array.isArray(s.log)) o.log = s.log.filter(x => x && ROUTE.includes(x.g)).slice(-400);
    if (s.weeks && typeof s.weeks === 'object') o.weeks = s.weeks;
    if (Array.isArray(s.earned)) o.earned = s.earned.filter(x => x && Number.isFinite(+x.n)).map(x => ({ n: +x.n, why: String(x.why || ''), t: +x.t || 0 }));
    if (Array.isArray(s.friends)) o.friends = [...new Set(s.friends.filter(x => typeof x === 'string'))];
    o.all = !!s.all;
    if (s.days && typeof s.days === 'object') o.days = s.days;
    if (Array.isArray(s.streaks)) o.streaks = s.streaks.filter(x => typeof x === 'string');
    if (s.badges && typeof s.badges === 'object') o.badges = s.badges;
    return o;
  }
  let S = normalize(read(KEY));
  const listeners = new Set();
  function save() {
    write(KEY, S);
    syncEdition();
    listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  /** Read the store again (another page may have changed it). */
  function reload() { S = normalize(read(KEY)); syncEdition(); }
  function syncEdition() {
    if (typeof Edition !== 'undefined' && Edition.setEarned) Edition.setEarned(S.earned.map(x => x.n));
  }

  /* ---------------- days, weeks and the streak ---------------- */

  // The goal: which kanji this game brings in (all of them when there is no goal module).

  const inGoal = k => !GOAL || GOAL.test(k);

  function meet(k) {

  const available = () => THEME.filter(k => !locked(k) && (inGoal(k) || (met(k) && keep(k))));
  /** Kanji of this game already met (of the goal or an easier level; others only if the game needs them). */

  const goalInfo = () => GOAL ? { label: GOAL.label, short: GOAL.short, kind: GOAL.kind, auto: GOAL.auto } : null;
  /** The theme's kanji by level of the app (Basic 1 … Advanced 2), for a game's collection page. */

  function weighted(list, w, rand) {

  }
  /** The next kanji to ask about, from pool (kanji in play): mostly the ones still being learned
      (lower levels more often), sometimes a mastered one that has not come up for a while. */
  function pickTarget(pool, { rand = Math.random, avoid = null } = {}) {
    const list = pool.filter(k => k !== avoid);
    if (!list.length) return pool[0] || null;

    const useReview = !learning.length || (review.length > 0 && rand() < 0.22);
    const from = useReview ? review : learning, now = Date.now();

  /* ---------------- the app's look ---------------- */

  if (ENTRY) { document.documentElement.style.setProperty('--gc', ENTRY.color); document.documentElement.style.setProperty('--gi', ENTRY.ink); }
  const themeSetting = () => { const t = appSetting('theme', 'system'); return t === 'light' || t === 'dark' ? t : 'system'; };
  /** Is the dark palette (Blackboard) showing? */

  addEventListener('storage', e => { if (e.key === APP) { APPS = app(); applyTheme(); } });
  const THEMES = [['system', 'System'], ['light', 'Notebook'], ['dark', 'Blackboard']];
  /** The Theme row for a game's settings: the app's own setting, so it changes the app too. */
  function themeRow() {
    const t = themeSetting();

      <div class="seg" role="radiogroup" aria-label="Theme">${THEMES.map(([v, l]) => `<button type="button" role="radio" aria-checked="${t === v}" class="${t === v ? 'on' : ''}" data-gc-theme="${v}">${l}</button>`).join('')}</div></div>`;
  }

  /* ---------------- sound and voice ---------------- */
  const Voice = (() => {
    let v = null;

        v = ja.find(x => /Nanami|Natural/i.test(x.name)) || ja.find(x => /Haruka|Ayumi|Kyoko|Google/i.test(x.name)) || ja[0] || null;

  /* ---------------- the kanji card ---------------- */
  const SAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';

  }

        ${ex.length ? `<div class="gc-words">${ex.map(x => `<div><b lang="ja">${esc(x.w)}</b><span><span lang="ja">${esc(x.r)}</span>${opt.romaji ? ` · ${esc(romaji(x.r))}` : ''}</span><span>${esc(x.g)}</span></div>`).join('')}</div>` : ''}
      </div></div></div>`;
  }

  /* ---------------- playing: rounds, combos, stars, results, the traveller rank, the daily challenge, missions ----------------

       GC.miss({ el })                    a wrong answer: the combo breaks, a soft knock, el shakes

     daily: { d, id, n, done }, mis: { tier: { type: n }, on: [{ type, from, got }], next } }. The rank adds up every game's xp. */
  const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function meta() {

  /* the traveller rank: every game's xp together */
  const RANKS = typeof GAME_RANKS !== 'undefined' ? GAME_RANKS : [[0, '旅人', 'Traveller']];   // games/registry.js
  function xpAll() { let n = 0; for (const m of Object.values(P.m)) if (m && typeof m === 'object') n += num(m.xp); return n; }
  function rankOf(xp = xpAll()) {

  /** Stars the town can spend (src/js/wallet.js counts the same way): every game's, the album's, less what the town spent. */

  function rewardText(r) {

  function jToast(html, { stay = false, onOpen = null, slot = '' } = {}) {

  /** The welcome when this game is the current stop (a card when you came by the journey, else a note). */
  function jArrive() {
    if (!J) return;

  /** The scoring card: the tiles, the pace and the charms one by one, the sum, and the points flying to the board. */

  /** A number flies from the scoring card to the score on the board. */
  async function fly(src, text) {

  /** The board's score counts up to the new score; the meter's walker goes along, and stars light as they are passed. */

  function renderSay() {

  /** The board: the score, the road to the three stars with the walker on it, the plays left, the pace. */

    modal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="m-h">
      <p class="eyebrow">Your bag at this station</p><h2 id="m-h">${run.bag.length} tiles</h2>
      <h3>Still to draw: ${run.pile.length}</h3><div class="bagview">${count(run.pile).map(([k, n]) => `<span class="bt"><span class="g" lang="ja">${k}</span>×${n}</span>`).join('') || '<span class="muted">None left.</span>'}</div>
      <h3>All tiles</h3><div class="bagview">${count(run.bag).map(([k, n]) => `<span class="bt"><span class="g" lang="ja">${k}</span>×${n}</span>`).join('')}</div>
      <p class="muted">A new bag is packed at every station: kanji you are still learning come more often, in threes while they are new.</p>
      <div class="row"><button class="btn primary" type="button" id="m-go">Close</button></div></div>`);
    onGo(null);
  }
  let bookTab = 'k';
  const lvDots = k => `<span class="lv" aria-label="level ${GC.level(k)} of 3">${[1, 2, 3].map(i => `<i class="${GC.level(k) >= i ? 'on' : ''}"></i>`).join('')}</span>`;
  function book(tab = bookTab) {
    bookTab = tab;
    if (view !== 'book' && view !== 'settings') from = view === 'hub' ? 'hub' : 'play';
    const c = GC.counts();
    const playable = [...WORDS.values()].filter(w => [...w.w].every(ch => !GC.locked(ch)));
    const nW = playable.filter(w => S.words[w.w]).length;
    const tabBtn = (t, label, n, of) => `<button class="tab" type="button" role="tab" data-act="tab" data-t="${t}" aria-selected="${tab === t}">${label}<span>${n} / ${of}</span></button>`;
    let body = '';
    if (tab === 'k') {
      body = `<p class="muted">Every kanji of the road, by level of Learn Kanji. Tap one you have met for its card. Each dot is a level, and each level adds 5 to a tile’s value.</p>${GC.offerHtml()}` +
        GC.groups().map(g => {
          const av = g.kanji.filter(k => !GC.locked(k)), met = av.filter(GC.met);
          return `<div class="lvhead"><h3>${esc(g.long || g.short)}</h3><span class="muted">${met.length} of ${g.kanji.length} met${av.length < g.kanji.length ? ` · ${g.kanji.length - av.length} locked` : ''}</span></div>
            <div class="kgrid">${g.kanji.map(k => {
              if (GC.locked(k)) return `<div class="kc locked" aria-label="Locked">${ICON.lock}<span class="s">locked</span></div>`;
              if (!GC.met(k)) return `<div class="kc new" aria-label="Not met yet"><span class="g">？</span><span class="s">${S.pending.includes(k) ? 'next' : 'not met'}</span></div>`;
              return `<button class="kc" type="button" data-act="card" data-k="${k}"><span class="g" lang="ja">${k}</span><span class="m">${esc(meaning(k))}</span><span class="s">worth ${value(k)}</span>${lvDots(k)}</button>`;
            }).join('')}</div>`;
        }).join('');
    } else if (tab === 'w') {
      body = `<p class="muted">Two-kanji words made of the road’s kanji. A word scores 10 more and +2×. Words turn up in your hand once you have met both kanji.</p>
        <div class="wgrid">${playable.slice().sort((a, b) => (S.words[b.w] ? 1 : 0) - (S.words[a.w] ? 1 : 0)).map(w => S.words[w.w]
          ? `<button class="wc" type="button" data-act="word" data-id="${w.w}"><span class="g" lang="ja">${w.w}</span><span class="r" lang="ja">${esc(w.r)}</span><span class="m">${esc(w.g)} · ×${S.words[w.w]}</span></button>`
          : `<div class="wc locked" aria-label="Not played yet"><span class="g">？？</span><span class="r">${[...w.w].every(GC.met) ? 'in reach' : ''}</span></div>`).join('')}</div>`;
    } else {
      body = `<div class="stamps">${STOPS.map((s, i) => `<div class="st"><span class="stamp${S.stamps.includes(i) ? '' : ' off'}" aria-hidden="true"><span lang="ja">${esc(s.name)}</span></span><span class="st3" aria-label="${S.stars[i] || 0} of 3 stars">${[0, 1, 2].map(n => `<i class="${n < (S.stars[i] || 0) ? 'on' : ''}"></i>`).join('')}</span><span><span lang="ja">${esc(s.kana)}</span> ${esc(s.ro)}</span></div>`).join('')}</div>
        <p class="muted">A stamp for each station you have cleared, with its best stars. Trips to Kyoto: <b>${S.journeys}</b>.</p>`;
    }
    show(`<div class="panel">
      <div class="row between"><div><p class="eyebrow">Travel diary</p><h2>${c.met} of ${c.available} kanji met</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button></div>
      <div class="tabs" role="tablist">${tabBtn('k', 'Kanji', c.met, c.available)}${tabBtn('w', 'Words', nW, playable.length)}${tabBtn('s', 'Stamps', S.stamps.length, STOPS.length)}</div>
      ${body}</div>`, 'book');
  }
  function settings(confirm = false) {
    if (view !== 'book' && view !== 'settings') from = view === 'hub' ? 'hub' : 'play';
    const sw = (k, on, label, note) => `<div class="setting"><div class="lbl">${label}<span>${note}</span></div><button class="switch" type="button" role="switch" id="set-${k}" aria-checked="${on}" data-act="toggle" data-key="${k}" aria-label="${label}"></button></div>`;
    show(`<div class="panel" style="gap:6px">
      <div class="row between"><div><p class="eyebrow">Settings</p><h2>Travel kit</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button></div>
      ${sw('guide', S.guide, 'Show the words in my hand', 'Lists the two-kanji words your tiles can make, with their points. Turn it off to find words yourself.')}
      ${sw('sound', GC.opt.sound, 'Sound', 'Tiles, chimes, and a drum at each station. The same switch as in Learn Kanji.')}
      ${sw('voice', GC.opt.voice, 'Read aloud', GC.Voice.ok ? 'A Japanese voice reads each kanji and word after you answer. The same switch as in Learn Kanji.' : 'No Japanese voice found on this device yet.')}
      ${sw('romaji', GC.opt.romaji, 'Show romaji', 'Readings in Latin letters as well as kana, in the lessons and every game.')}
      ${GC.themeRow()}
      <div class="setting"><div class="lbl">Start over<span>Clears your trips, diary and stamps, and what you have learned of this game’s kanji. Your lessons and other games keep theirs.</span></div>
        ${confirm ? '<div class="row"><button class="btn danger" type="button" data-act="reset-yes">Clear Kanji Road</button><button class="btn quiet" type="button" data-act="settings">Keep it</button></div>' : '<button class="btn" type="button" data-act="reset">Start over</button>'}</div>
      <p class="muted" style="font-size:14px">Progress is saved on this device with your Learn Kanji progress, and goes into its backups.</p></div>`, 'settings');
  }
  /** Back from the diary or settings: to the hub, or to the station in play. */
  function back() {
    if (from === 'play' && S.run && S.run.phase === 'play') { $('screen').hidden = true; view = ''; renderAll(); return; }
    hub();
  }

  /* ---------------- input ---------------- */
  function onClick(e) {
    if (busy && e.target.closest('#check.scoring, .print, .hud')) { skip = true; return; }
    // while a play is being counted, the pages wait (a tap only hurries the counting)
    if (busy && e.target.closest('[data-act="about"], [data-act="book"], [data-act="settings"], [data-act="bag"]')) { skip = true; return; }
    if (e.target.closest('#gc-play')) return playFromHub();
    const t = e.target.closest('#hand .tile[data-id]');
    if (t) { toggle(t.dataset.id); return; }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.dataset.act) {
      case 'home': return GC.back();
      case 'play': return play();
      case 'answer': return answer(+b.dataset.i);
      case 'proceed': return proceed();
      case 'redraw': return redraw();
      case 'pick': return pickWord(b.dataset.ids.split(','));
      case 'card': return kanjiCard(b.dataset.k);
      case 'word': return wordCard(b.dataset.id);
      case 'charm': return charmCard(b.dataset.id);
      case 'bag': return bagCard();
      case 'shop': return teaHouse();
      case 'buycharm': return buyCharm(+b.dataset.i);
      case 'sellcharm': return sellCharm(b.dataset.id);
      case 'reroll': return reroll();
      case 'unlock': return GC.unlock().then(() => { if (view === 'book') book(); else if (view === 'hub') hub(); });
      case 'about': { const r = document.querySelector('.gc-res'); if (r) return; return hub(true); }
      case 'book': closeModal(); return book();
      case 'tab': return book(b.dataset.t);
      case 'settings': return settings();
      case 'back': return back();
      case 'toggle': {
        const k = b.dataset.key;
        if (k === 'guide') { S.guide = !S.guide; save(); } else GC.opt[k] = !GC.opt[k];
        b.setAttribute('aria-checked', String(k === 'guide' ? S.guide : GC.opt[k]));
        renderChips(); renderCheck();
        return;
      }
      case 'reset': return settings(true);
      case 'reset-yes': {
        GC.resetTheme();
        S = fresh(); save();
        sel = []; busy = false; hudShown = null;
        closeScreens(); renderAll(); hub();
        return;
      }
    }
  }
  function onKey(e) {
    if (document.querySelector('.gc-res, .gc-jm')) return;   // the results and the journey's letters have their own keys
    if (e.key === 'Escape') {
      if (!$('modal').hidden) { const go = $('m-go'); if (go) go.click(); }
      else if (!$('screen').hidden && view !== 'hub') back();
      else if ($('screen').hidden && sel.length) { sel = []; renderHand(); renderSay(); renderChips(); renderButtons(); }
      return;
    }
    if (!$('modal').hidden || !$('screen').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const run = S.run;
    if (run && run.check) {
      if (!run.check.result && /^[1-4]$/.test(e.key)) { e.preventDefault(); answer(+e.key - 1); }
      else if (run.check.result && !run.check.result.right && e.key === 'Enter') { e.preventDefault(); proceed(); }
      else if (busy && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); skip = true; }
      return;
    }
    if (busy) return;
    // Enter plays, also with a tile in focus (it was just tapped); other buttons keep their own Enter
    const onBtn = e.target.closest && e.target.closest('button');
    if (e.key === 'Enter' && !$('playbtn').disabled && (!onBtn || onBtn.closest('#hand'))) { e.preventDefault(); play(); }
  }

  function start() {
    S = normalize(GC.state);
    // the station's own missions and challenge: stations cleared, charms bought
    GC.setup({
      missions: {
        cleared: { text: n => `Clear ${n} stations`, tiers: [3, 8, 15, 25, 40, 60, 90], counter: 'cleared' },
        charms: { text: n => n === 1 ? 'Buy a charm at a tea house' : `Buy ${n} charms at tea houses`, tiers: [1, 3, 6, 10, 15, 22, 30], counter: 'charms' },
      },
      dailies: [{ id: 'road-stations', text: 'Clear 3 stations', count: 'cleared', goal: 3 }],
    });
    save();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    const barh = () => document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px');
    barh();
    window.addEventListener('resize', barh);
    if (typeof Edition !== 'undefined') Edition.onChange(() => { if (view === 'book') book(); else if (view === 'hub') hub(); });
    renderAll();
    hub();
  }

  /** Answer the check in hand the right (or a wrong) way, and wait for the points (tests). */
  async function solve(right = true) {
    const run = S.run;
    if (!run || !run.check) return;
    const c = run.check;
    if (!c.result) await answer(right ? c.a : c.opts.findIndex((o, i) => i !== c.a));
    if (S.run && S.run.check && S.run.check.result && !busy) await proceed();
  }
  return {
    start,
    test: {
      get S() { return S; }, get sel() { return sel.slice(); }, get busy() { return busy; }, get view() { return view; },
      WORDS, FAM, verb, value, evaluate, handWords, targetOf, goalsOf, normalize, wordOf, buildBag, makeCheck, checkKind, offers, STOPS, card,
      select(ids) { sel = ids.slice(); renderAll(); }, play, answer, proceed, solve, redraw, newJourney: newTrip, nextStation, teaHouse, buyCharm, hub, playFromHub,
      seed(f) { rand = f; }, timescale(n) { TS = n; },
      set(state) { S = normalize(state); sel = []; busy = false; hudShown = null; closeScreens(); save(); if (S.run && S.run.phase === 'play') resumePlay(); else { renderAll(); hub(); } },
    },
  };
})();

Road.start();

</script>

</body>
</html>
