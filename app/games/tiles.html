  function chainOff() { const c = $('chain'); c.hidden = true; c.classList.remove('hot'); }
  function chainBreak() { if (L) L.chain = 0; chainOff(); }

  /* ---------------- playing ---------------- */
  const isFree = t => t.state === 'pile' && t.blockers.every(b => b.state !== 'pile');
  const barKanji = () => (L.bar.length ? L.tiles[L.bar[0]].k : null);
  /** The order in which the tiles of kanji k can be taken now (a tile in the set no longer covers the ones under it), or null. */
  function takeOrder(k) {
    const mine = L.tiles.filter(t => t.k === k && t.state === 'pile');
    const taken = [], faces = new Set();
    const go = () => {
      if (faces.size === 3) return true;
      for (const t of mine) {
        if (faces.has(t.face) || taken.includes(t)) continue;
        if (!t.blockers.every(b => b.state !== 'pile' || taken.includes(b))) continue;
        taken.push(t); faces.add(t.face);
        if (go()) return true;
        taken.pop(); faces.delete(t.face);
      }
      return false;
    };
    return go() ? taken.slice() : null;
  }
  /** Every kanji whose set can be taken now. */
  const completable = () => L.kinds.filter(k => takeOrder(k));
  /** Every kanji whose three tiles are all free now. */
  const freeSets = () => L.kinds.filter(x => FACES.every(f => L.tiles.some(t => t.k === x && t.face === f && isFree(t))));
  function toBoard(ids) {
    flip(ids.map(id => L.tiles[id].el), () => {
      for (const id of ids) { const t = L.tiles[id]; t.state = 'pile'; t.el.classList.remove('sel'); board().appendChild(t.el); placeOnBoard(t); }
      L.bar = L.bar.filter(id => !ids.includes(id));
      placeTray();
    });
  }
  function toBar(t) {
    flip(L.bar.map(id => L.tiles[id].el).concat(t.el), () => {
      t.state = 'bar';
      L.bar.push(t.id);
      t.el.classList.add('sel');
      trayEl().appendChild(t.el);
      placeTray();
    });
  }
  const clearSeals = () => document.querySelectorAll('#rail .seal').forEach(e => e.remove());
  /** Tap a tile: into the set, back out of it, or (not belonging) a miss. */
  function tap(id, viaKey = false) {
    if (!L || L.over || !L.tiles.length) return false;
    const t = L.tiles[id];
    if (!t || t.state === 'gone') return false;
    Sfx.unlock();
    if (t.state === 'bar') {
      Sfx.soft(); toBoard([t.id]); refreshFree(); say('Put back.'); guideNext(); unjam();
      if (viaKey) focusTile(t);
      return true;
    }
    if (!isFree(t)) { covered(t); return false; }
    Sfx.tap();
    clearSeals();
    t.el.classList.remove('hint', 'guide');
    const bk = barKanji();
    if (L.bar.some(x => L.tiles[x].face === t.face)) {
      // a second tile of a kind the set already has: start a new set with it
      toBoard(L.bar.slice());
      toBar(t);
      refreshFree();
      say(`A set takes one ${FACE_NAME[t.face]}: a new set starts with this one.`);
      guideNext();
      if (viaKey) focusTile(t);
      return true;
    }
    if (bk && t.k !== bk) return miss(t, bk);
    toBar(t);
    if (L.bar.length === TRAY) clearSet();
    else say(L.bar.length === 1 ? `Now find what belongs with it: its ${FACES.filter(f => f !== t.face).map(f => FACE_NAME[f]).join(' and ')}.` : `One more: its ${FACE_NAME[FACES.find(f => !L.bar.some(x => L.tiles[x].face === f))]}.`);
    refreshFree();
    guideNext();
    if (viaKey) focusTile(t);
    return true;
  }
  /** A tile under another one: a nudge and a word, nothing lost. */
  function covered(t) {
    if (!still()) t.el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-3px)' }, { transform: 'translateY(0)' }], { duration: 200, easing: 'ease-out' });
    say('That tile is under another one: take the tiles on top of it first.');
  }
  /** A tile that does not belong with the set: the set goes back, and its kanji counts as missed in this pile. */
  function miss(t, bk) {
    L.misses++; S.stats.misses++;
    if (!L.spoiled[bk]) { L.spoiled[bk] = true; GC.record(bk, false); }
    const ck = bk + '>' + t.k;
    S.conf[ck] = Math.min(9, (S.conf[ck] || 0) + 1);
    save();
    GC.miss({ el: t.el });
    chainBreak();
    const els = L.bar.map(id => L.tiles[id].el).concat(t.el);
    for (const el of els) { el.classList.remove('miss'); void el.offsetWidth; el.classList.add('miss'); }
    const other = t.face === 'k' ? `${jp(t.k)} means ${esc(meaning(t.k))}.` : t.face === 'm' ? `“${esc(meaning(t.k))}” is ${jp(t.k)}.` : `${jp(esc(reading(t.k)))}${romajiOf(reading(t.k))} is ${jp(t.k)}.`;
    say(`Not with this set: ${jp(bk)} means <b>${esc(meaning(bk))}</b>, read ${jp(esc(reading(bk)))}${romajiOf(reading(bk))}. ${other}`);
    toBoard(L.bar.slice());
    refreshFree();
    guideNext();
    unjam();
    return true;
  }
  function clearSet() {
    const k = barKanji(), three = L.bar.slice();
    L.bar = [];
    L.cleared++; S.stats.sets++;
    if (!L.spoiled[k]) GC.record(k, true);
    // the chain: this set soon after the last one, with no wrong tile since
    const quick = L.chain > 0 && L.lastClear !== null && L.t - L.lastClear <= CHAIN_MS;
    L.chain = quick ? L.chain + 1 : 1;
    L.chainBest = Math.max(L.chainBest, L.chain);
    L.lastClear = L.t;
    const mult = Math.min(L.chain, CHAIN_MAX), pts = SET_PTS * mult * (L.P.festival ? 2 : 1);
    L.score += pts;
    L.guide = false;
    save();
    const els = three.map(id => L.tiles[id].el);
    three.forEach(id => { L.tiles[id].state = 'gone'; });
    els.forEach(el => { el.style.pointerEvents = 'none'; el.removeAttribute('data-id'); el.tabIndex = -1; });
    // the three slide together on the rail, and the kanji's seal is stamped where they meet
    const mid = els.find(el => L.tiles.find(t => t.el === el).face === 'm') || els[1];
    if (still()) els.forEach(el => el.remove());
    else {
      const mr = mid.getBoundingClientRect();
      for (const el of els) {
        const r = el.getBoundingClientRect(), dx = mr.left - r.left;
        el.animate([{ transform: 'none', opacity: 1 }, { transform: `translateX(${dx * 0.8}px) scale(1.04)`, opacity: 1, offset: 0.45 }, { transform: `translateX(${dx}px) scale(.55)`, opacity: 0 }],
          { duration: 420, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' });
      }
      setTimeout(() => els.forEach(el => el.remove()), 440);
    }
    const seal = sealPop(k, mult);
    GC.hit({ el: seal, text: `+${fmt(pts)}`, big: L.chain >= 3 });
    GC.count('sets');
    GC.say(reading(k));
    say(`${jp(k)} ${esc(meaning(k))} · ${jp(esc(reading(k)))}${romajiOf(reading(k))}`);
    scoreTo(L.score);
    if (L.tiles.every(x => x.state === 'gone')) { L.over = true; chainOff(); hud(); setTimeout(win, (still() ? 250 : 650) * Math.max(TS, 0.05)); return; }
    chainShow();
    refreshFree();
    unjam();
  }
  /** A cleared set's seal: its kanji on the app's red seal, with its meaning and reading, stamped on the rail. */
  function sealPop(k, mult) {
    clearSeals();
    const el = document.createElement('div');
    el.className = 'seal';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<span class="k" lang="ja">${k}</span><span class="m"><b>${esc(meaning(k))}</b><span lang="ja">${esc(reading(k))}</span></span>${mult > 1 ? `<span class="x">×${mult}</span>` : ''}`;
    $('rail').appendChild(el);
    setTimeout(() => { if (!still()) Sfx.stamp(); }, 140);
    setTimeout(() => el.remove(), still() ? 1400 : 1700);
    return el;
  }
  /** No set can be taken (a pile with a kanji twice can jam): the tiles left are dealt again. */
  function unjam() {
    if (!L || L.over || L.bar.length || completable().length) return;
    const left = L.tiles.filter(t => t.state === 'pile');
    const per = {};
    for (const t of left) per[t.k] = (per[t.k] || 0) + 1;
    const ks = [];
    for (const [k, c] of Object.entries(per)) for (let i = 0; i < c / 3; i++) ks.push(k);
    if (!assign(left, ks)) return;
    for (const t of left) { t.el.className = `tile face-${t.face}`; t.el.innerHTML = faceHtml(t); t.el.setAttribute('aria-label', label(t)); }
    refreshFree();
    say('No set could be taken, so the tiles left were dealt again.');
  }
  /** Hint: the next tile to take. It costs the kanji its point in this pile, and the pile its star for no slips. */
  function hint() {
    if (!L || L.over || !L.hints || !L.tiles.length) return;
    let k = barKanji(), pick = null;
    if (k) {
      pick = L.tiles.find(t => t.k === k && isFree(t) && !L.bar.some(x => L.tiles[x].face === t.face));
      if (!pick) { say('The rest of this set is still covered. Tap the tiles in your set to put them back, and start with another.'); return; }
    } else {
      k = completable()[0];
      if (!k) return;
      pick = takeOrder(k)[0];
    }
    L.hints--; L.used++; S.stats.hints++;
    L.spoiled[k] = true;
    save();
    document.querySelectorAll('.board .tile.hint').forEach(e => e.classList.remove('hint'));
    pick.el.classList.remove('hint'); void pick.el.offsetWidth; pick.el.classList.add('hint');
    say(`This one: ${pick.face === 'k' ? 'a kanji' : pick.face === 'm' ? 'a meaning' : 'a reading'} of a set you can take now.`);
    Sfx.soft();
    refreshFree();
  }
  /** The first pile: the next tile to tap glows (a guide, not a hint). */
  function guideNext() {
    document.querySelectorAll('.board .tile.guide').forEach(e => e.classList.remove('guide'));
    if (!L || !L.guide || L.over) return;
    let k = barKanji(), pick = null;
    if (k) pick = L.tiles.find(t => t.k === k && isFree(t) && !L.bar.some(x => L.tiles[x].face === t.face));
    else { k = completable()[0]; const ord = k && takeOrder(k); pick = ord && (ord.find(t => t.face === 'k' && isFree(t)) || ord[0]); }
    if (pick) pick.el.classList.add('guide');
  }

  /* ---------------- the end of a pile ---------------- */
  function win() {
    if (!L) return;
    const n = L.n, secs = L.t / 1000;
    const clean = !L.misses && !L.used, fast = secs <= L.par;
    const stars = 1 + (clean ? 1 : 0) + (fast ? 1 : 0);
    const bonus = fast ? Math.round((L.par - secs) * TIME_PTS) * (L.P.festival ? 2 : 1) : 0;
    S.stars[n] = Math.max(S.stars[n] || 0, stars);
    if (n === S.level) S.level = n + 1;
    S.stats.levels++;
    const pool = GC.inPlay();
    if (!S.pending.length && pool.length && pool.every(k => GC.level(k) >= 1)) S.pending = GC.nextNew(stars === 3 ? 2 : 1);
    save(); GC.saveNow();
    lastRound = { n, fast, clean, stars, chainBest: L.chainBest };
    board().classList.add('won');
    $('table').classList.add('won');
    const banner = $('banner');
    banner.innerHTML = `<b>${stars === 3 ? 'Perfect pile' : 'Pile cleared'}</b>${starsHtml(stars)}`;
    banner.hidden = false;
    Sfx.pile();
    if (!still()) {
      const m = $('mat').getBoundingClientRect();
      GC.burst({ x: m.left + m.width / 2, y: m.top + m.height / 2 }, '', { big: true });
      if (L.P.festival) setTimeout(() => { GC.burst({ x: m.left + m.width * 0.25, y: m.top + m.height * 0.35 }, '', { big: true }); GC.burst({ x: m.left + m.width * 0.75, y: m.top + m.height * 0.35 }, '', { big: true }); }, 220);
    }
    setTimeout(() => results({ n, secs, clean, fast, stars, bonus }), (still() ? 400 : 1100) * Math.max(TS, 0.05));
  }
  function results({ n, secs, clean, fast, bonus }) {
    const P = L.P, par = L.par;
    const ups = L.kinds.filter(k => GC.level(k) > L.startLv[k] && GC.level(k) <= 2);
    const c = GC.counts(), pool = GC.inPlay();
    let news = '';
    if (S.pending.length) news = `<div class="n"><span class="k" lang="ja">${S.pending.map(() => '？').join('')}</span><div><b>Pile ${n + 1} brings ${S.pending.length === 1 ? 'a new kanji' : `${S.pending.length} new kanji`}</b><span>You will meet ${S.pending.length > 1 ? 'them' : 'it'} first.</span></div></div>`;
    else if (c.met >= c.available && c.locked) news = `<div class="n"><span class="k" lang="ja">全</span><div><b>You have met all ${c.available} free kanji of Kanji Tiles</b><span>Piles now mix the ones you know.</span></div></div>`;
    else if (c.met < c.available) {
      const low = pool.filter(k => GC.level(k) < 1);
      if (low.length) news = `<div class="n"><span class="k" lang="ja">…</span><div><b>New kanji come when every kanji in play has reached level 1</b><span>Still to go: ${low.slice(0, 10).map(k => jp(k)).join(' ')}</span></div></div>`;
    }
    if (params(n + 1).festival) news += `<div class="n"><span class="k lan">${LANTERN}</span><div><b>Pile ${n + 1} is a festival</b><span>Every set scores double.</span></div></div>`;
    if (ups.length) news += `<div class="n"><span class="k" lang="ja">${ups[0]}</span><div><b>${ups.length === 1 ? `${esc(meaning(ups[0]))} is` : `${ups.length} kanji are`} up a level</b><span>At level 1 a kanji tile drops its meaning; at level 2 a reading tile drops its kanji.</span></div></div>`;
    const stats = [['Time', `${clock(secs)} of ${clock(par)}`]];
    if (bonus) stats.push(['Time bonus', `+${fmt(bonus)}`]);
    const score = L.score + bonus;
    GC.finish({
      title: clean && fast ? 'Perfect pile' : clean || fast ? 'Well done' : 'Pile cleared',
      sub: `Pile ${n} · ${P.name}`,
      goals: [
        { text: 'Clear the pile', done: true },
        { text: 'No wrong tiles or hints', done: clean },
        { text: `Clear it in under ${clock(par)}`, done: fast },
      ],
      score, scoreText: 'points', bestKey: 'score',
      stats,
      primary: { label: 'Next pile', run: () => play(n + 1) },
      secondary: { label: 'Back', run: home },
      note: news ? `<div class="news">${news}</div>` : '',
    });
    // Play again: the same pile once more (the shared results have two buttons; this one joins them)
    const row = document.querySelector('.gc-res .gc-rbtns'), main = row && row.querySelector('[data-res="1"]');
    if (main) {
      const again = document.createElement('button');
      again.type = 'button'; again.className = 'btn'; again.id = 'res-again';
      again.innerHTML = `${ICON.replay}Play again`;
      again.addEventListener('click', () => { const box = again.closest('.gc-res'); if (box) box.remove(); play(n); });
      row.insertBefore(again, main);
    }
  }

  /* ---------------- pile flow ---------------- */
  /** The kanji to bring in: three to start with; later, when every kanji in play has reached level 1. */
  function newcomers() {
    S.pending = S.pending.filter(k => !GC.met(k) && !GC.locked(k));
    if (S.pending.length) return S.pending.slice();
    if (GC.inPlay().length) return [];
    return GC.nextNew(3);
  }
  function play(n) {
    n = clamp(num(n) || S.level, 1, S.level);
    closeScreens();
    const old = document.querySelector('.gc-res');
    if (old) old.remove();
    S.pending = newcomers();
    save();
    const go = () => { buildLevel(n); renderLevel(); GC.round(); lastTick = performance.now(); };
    if (S.pending.length) return meet(S.pending.slice(), go);
    go();
  }
  const inPile = () => !!(L && L.tiles.length && !L.over);
  function modal(html) { const m = $('modal'); m.innerHTML = html; m.hidden = false; }
  function closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }
  function closeScreens() { closeModal(); $('screen').hidden = true; view = ''; }

  /* ---------------- pages ---------------- */
  let view = '';
  function show(html, name) { const el = $('screen'); el.innerHTML = html; el.hidden = false; el.scrollTop = 0; view = name || ''; }
  /** Back from a page: to the pile being played, or to the welcome. */
  function back() { if (inPile()) { $('screen').hidden = true; view = ''; if (keyboardUsed) focusTile(null); } else home(); }
  const demo = (k, face, lv) => { const keep = L; L = { style: { [k]: lv } }; const h = `<span class="tile face-${face}" aria-hidden="true">${faceHtml({ k, face })}</span>`; L = keep; return h; };
  /** The welcome's picture: a kanji's three tiles on a corner of the mat, by a cup of tea. */
  function art() {
    const k = ['心', '愛', '友', '人'].find(x => GC.inTheme(x)) || GC.THEME[0];
    return `<div class="hubart">${demo(k, 'k', 2)}${demo(k, 'm', 2)}${demo(k, 'r', 2)}<span class="teacup">${CUP}</span></div>`;
  }
  function home() {
    closeModal();
    const first = !S.stats.levels && !GC.inPlay().length ? newcomers() : [];
    const p = params(S.level);
    const resume = inPile();
    const next = resume ? `You are in the middle of pile ${L.n}: ${L.cleared} of ${L.sets.length} sets cleared.`
      : first.length ? `<b>Your first kanji:</b> ${first.map(k => `${jp(k)} ${esc(meaning(k))}`).join(' · ')}`
        : `<b>Next: pile ${S.level}, ${esc(p.name)}.</b> ${p.sets} sets on ${p.layers === 1 ? 'one layer' : `${p.layers} layers`}${p.festival ? ', double points' : ''}.${S.pending.length ? ` It brings ${S.pending.length === 1 ? 'a new kanji' : `${S.pending.length} new kanji`}.` : ''}`;
    show(GC.hubHtml({
      pitch: 'Match each kanji with its meaning and its reading, and clear the pile while the tea is warm.',
      play: resume ? `Back to pile ${L.n}` : !S.stats.levels ? 'Play' : `Play pile ${S.level}`,
      more: `<button class="btn" type="button" data-act="map">${ICON.map}All piles</button><button class="btn" type="button" data-act="kanji">${ICON.book}Your kanji</button><button class="btn" type="button" data-act="settings">${ICON.sliders}Settings</button>`,
      howto: `<p>Every kanji in the pile comes as three tiles that belong together: the kanji, its meaning and its reading. Tap one, then the two that go with it, to clear the set. Clear the pile to finish.</p>
        <p>Only tiles with nothing on top can be taken. A tile that does not belong sends your set back to the pile. While a kanji is new, its tiles carry reminders; they go as you learn it.</p>
        <p>Three stars: clear the pile; no wrong tiles or hints; and clear it before the tea cools. Sets cleared soon after one another make a chain: ×2, ×3, up to ×5 points. Every fifth pile is a festival, with double points.</p>
        <p>With a keyboard: the arrow keys move between the tiles you can take, Enter takes one, H gives a hint, Backspace puts your set back.</p>`,
      first: next,
      bestText: b => fmt(b),
      art: art(),
    }), 'home');
    $('scorepill').hidden = !resume;
  }
  function map() {
    const top = Math.max(20, Math.ceil((S.level + 4) / 10) * 10);
    const total = Object.values(S.stars).reduce((a, b) => a + b, 0);
    const c = GC.counts();
    show(`<div class="panel">
      <div class="row between"><div><p class="eyebrow">All piles</p><h2>${total} ${total === 1 ? 'star' : 'stars'} · ${c.met} of ${c.available} kanji met</h2></div>
        <div class="row"><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button><button class="btn primary big" type="button" data-act="play" data-n="${S.level}">Play pile ${S.level} ${ICON.next}</button></div></div>
      <p class="muted">Piles grow as you go: more sets, more layers, new shapes. Each is dealt from the kanji you have met, the ones you are still learning most often. Play one again for more stars.</p>
      <div class="levels">${Array.from({ length: top }, (_, i) => i + 1).map(n => {
        const open = n <= S.level, st = S.stars[n] || 0, p = params(n);
        return `<button class="lv${n === S.level ? ' now' : ''}${open ? '' : ' locked'}${p.festival ? ' fest' : ''}" type="button" ${open ? `data-act="play" data-n="${n}"` : 'disabled'} aria-label="Pile ${n}, ${p.name}${open ? `, ${st} of 3 stars` : ', not open yet'}">
          ${p.festival ? `<span class="lan">${LANTERN}</span>` : ''}<b>${n}</b>${starsHtml(st)}<span class="nk">${esc(p.name)}</span></button>`;
      }).join('')}</div></div>`, 'map');
  }
  function kanjiList() {
    const c = GC.counts();
    show(`<div class="panel">
      <div class="row between"><div><p class="eyebrow">Your kanji · ideas, feelings and people</p><h2>${c.met} of ${c.available} met</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button></div>
      <p class="muted">By level of Learn Kanji. Each dot is a level: at level 1 the kanji tile drops its meaning, at level 2 the reading tile drops its kanji. Tap one you have met for its card.${c.locked ? ' Locked kanji are in lessons that Learn Kanji Full opens.' : ''}</p>
      ${GC.groups().map(g => {
        const av = g.kanji.filter(k => !GC.locked(k)), met = av.filter(GC.met);
        return `<div class="lvhead"><h3>${esc(g.long || g.short)}</h3><span class="muted">${met.length} of ${g.kanji.length} met${av.length < g.kanji.length ? ` · ${g.kanji.length - av.length} locked` : ''}</span></div>
          <div class="kgrid">${g.kanji.map(k => {
            if (GC.locked(k)) return `<div class="kc locked" aria-label="Locked">${ICON.lock}<span class="m">locked</span></div>`;
            if (!GC.met(k)) return `<div class="kc locked new" aria-label="Not met yet"><span class="g">？</span><span class="m">${S.pending.includes(k) ? 'next' : 'not met'}</span></div>`;
            const lv = GC.level(k);
            return `<button class="kc" type="button" data-act="card" data-k="${k}"><span class="g" lang="ja">${k}</span><span class="m">${esc(meaning(k))}</span><span class="dots" role="img" aria-label="Level ${lv} of 3">${[1, 2, 3].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span></button>`;
          }).join('')}</div>`;
      }).join('')}</div>`, 'kanji');
  }
  function card(k) {
    const r = GC.rec(k) || { ok: 0 };
    modal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="gc-h">
      <p class="eyebrow">Kanji · level ${GC.level(k)} of 3 · ${r.ok} right</p>
      ${GC.cardHtml(k, { words: 4 })}
      <div class="three">${demo(k, 'k', GC.level(k))}<span class="eq">+</span>${demo(k, 'm', GC.level(k))}<span class="eq">+</span>${demo(k, 'r', GC.level(k))}</div>
      <div class="row end"><button class="btn primary big" type="button" id="m-go">Close</button></div></div>`);
    const go = $('m-go');
    go.onclick = () => closeModal();
    setTimeout(() => go.isConnected && go.focus({ preventScroll: true }), 30);
    GC.animate($('gc-sq'), 250);
  }
  function settings(confirm = false) {
    const sw = (k, on, lbl, note) => `<div class="setting"><div class="lbl">${lbl}<span>${note}</span></div><button class="switch" type="button" role="switch" id="set-${k}" aria-checked="${on}" data-act="toggle" data-key="${k}" aria-label="${lbl}"></button></div>`;
    show(`<div class="panel" style="gap:6px">
      <div class="row between"><div><p class="eyebrow">Settings</p><h2>Your table</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button></div>
      ${sw('sound', GC.opt.sound, 'Sound', 'A wooden click for each tile and a chime for each set. The same switch as in Learn Kanji.')}
      ${sw('voice', GC.opt.voice, 'Say each set aloud', GC.Voice.ok ? 'A Japanese voice reads the kanji when its set clears. The same switch as in Learn Kanji.' : 'No Japanese voice found on this device yet.')}
      ${sw('romaji', GC.opt.romaji, 'Show romaji', 'Readings in Latin letters as well as kana, in the lessons and every game.')}
      ${GC.themeRow()}
      <div class="setting"><div class="lbl">Start over<span>Clears your piles and stars, and what you have learned of this game’s kanji. Your lessons and other games keep theirs.</span></div>
        ${confirm ? '<div class="row"><button class="btn danger" type="button" data-act="reset-yes">Clear Kanji Tiles</button><button class="btn quiet" type="button" data-act="settings">Keep it</button></div>' : '<button class="btn" type="button" data-act="reset">Start over</button>'}</div>
      <p class="muted" style="font-size:14px">Progress is saved on this device with your Learn Kanji progress, and goes into its backups.</p></div>`, 'settings');
  }
  /** Meet new kanji, one card each, then go on. */
  function meet(list, then) {
    const queue = list.slice();
    const step = () => {
      const k = queue.shift();
      if (!k) { save(); return then && then(); }
      const i = list.length - queue.length;
      GC.meet(k);
      S.pending = S.pending.filter(x => x !== k);
      save();
      Sfx.gift();
      modal(`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="gc-h">
        <p class="eyebrow">${list.length > 1 ? `New kanji ${i} of ${list.length}` : 'A new kanji'}</p>
        ${GC.cardHtml(k, { words: innerWidth < 640 ? 2 : 3 })}
        <p class="muted">In the pile it comes as three tiles that belong together:</p>
        <div class="three">${demo(k, 'k', 0)}<span class="eq">+</span>${demo(k, 'm', 0)}<span class="eq">+</span>${demo(k, 'r', 0)}</div>
        <div class="row end"><button class="btn primary big" type="button" id="m-go">${queue.length ? 'Next kanji' : 'Play'} ${ICON.next}</button></div></div>`);
      const go = $('m-go');
      let done = false;
      go.onclick = () => { if (done) return; done = true; closeModal(); step(); };
      setTimeout(() => go.isConnected && go.focus({ preventScroll: true }), 30);
      GC.animate($('gc-sq'), 450);
      GC.say(reading(k));
    };
    step();
  }

  /* ---------------- input ---------------- */
  let keyboardUsed = false;
  /** Focus a free tile: the one nearest to t (or the first one). */
  function focusTile(t) {
    if (!inPile()) return;
    const free = L.tiles.filter(isFree);
    if (!free.length) return;
    const near = t ? free.slice().sort((a, b) => Math.hypot(a.x - t.x, a.y - t.y) - Math.hypot(b.x - t.x, b.y - t.y))[0]
      : free.slice().sort((a, b) => a.y - b.y || a.x - b.x)[0];
    near.el.focus({ preventScroll: true });
  }
  /** Arrow keys: to the nearest free tile that way. */
  function moveFocus(dx, dy) {
    const cur = document.activeElement && document.activeElement.closest && document.activeElement.closest('.board .tile');
    const ct = cur && L.tiles[+cur.dataset.id];
    if (!ct) return focusTile(null);
    let best = null, bd = Infinity;
    for (const t of L.tiles) {
      if (t === ct || !isFree(t)) continue;
      const ax = t.x - ct.x, ay = t.y - ct.y, along = ax * dx + ay * dy, across = Math.abs(ax * dy - ay * dx);
      if (along < 0.25) continue;
      const d = along * along + 2.5 * across * across;
      if (d < bd) { bd = d; best = t; }
    }
    if (best) best.el.focus({ preventScroll: true });
  }
  function onClick(e) {
    if (e.target.closest('#gc-play')) { if (inPile()) back(); else play(S.level); return; }
    const tile = e.target.closest('.board .tile, .tray .tile');
    if (tile && tile.dataset.id) { tap(+tile.dataset.id, e.detail === 0); return; }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.dataset.act) {
      case 'leave': return GC.back();
      case 'hub': return home();
      case 'play': return play(+b.dataset.n);
      case 'map': return map();
      case 'back': return back();
      case 'kanji': return kanjiList();
      case 'card': return card(b.dataset.k);
      case 'settings': return settings();
      case 'hint': return hint();
      case 'unlock': return GC.unlock();
      case 'toggle': {
        const k = b.dataset.key;
        GC.opt[k] = !GC.opt[k];
        b.setAttribute('aria-checked', String(GC.opt[k]));
        if (L && L.tiles) for (const t of L.tiles) if (t.state !== 'gone' && t.el) t.el.innerHTML = faceHtml(t);
        return;
      }
      case 'reset': return settings(true);
      case 'reset-yes': {
        GC.resetTheme(); S = fresh(); save(); L = null;
        board().innerHTML = ''; trayEl().innerHTML = ''; $('mat').hidden = true; say(''); chainOff();
        $('app').classList.remove('playing');
        return home();
      }
    }
  }
  function onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.gc-res, .gc-jm')) return;   // the shared dialogs have their own keys
    if (!$('modal').hidden) { if (e.key === 'Escape') { const go = $('m-go'); if (go) { e.preventDefault(); go.click(); } } return; }
    if (!$('screen').hidden) { if (e.key === 'Escape' && view !== 'home') { e.preventDefault(); back(); } return; }
    if (!inPile()) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[e.key]) { keyboardUsed = true; e.preventDefault(); moveFocus(...dirs[e.key]); return; }
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); hint(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
      e.preventDefault();
      if (L.bar.length) { Sfx.soft(); toBoard(L.bar.slice()); refreshFree(); say('Put back.'); guideNext(); unjam(); if (keyboardUsed) focusTile(null); }
      else if (e.key === 'Escape') home();
      return;
    }
    if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ') keyboardUsed = true;
  }

  function start() {
    S = normalize(GC.state);
    save();
    GC.setup({
      missions: { sets: { text: n => `Clear ${n} sets`, tiers: [12, 30, 60, 100, 160, 240, 360], counter: 'sets' } },
      dailies: [
        { id: 'chain4', text: 'Make a chain of 4 sets', live: () => !!L && !!L.tiles.length && L.chainBest >= 4, round: () => !!lastRound && lastRound.chainBest >= 4 },
        { id: 'tea', text: 'Clear a pile while the tea is warm', round: () => !!lastRound && lastRound.fast },
        { id: 'sets20', text: 'Clear 20 sets today', count: 'sets', goal: 20 },
      ],
    });
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', () => { keyboardUsed = false; }, true);
    const barh = () => document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px');
    barh();
    let rt = 0;
    window.addEventListener('resize', () => { barh(); clearTimeout(rt); rt = setTimeout(relayout, 80); });
    if (typeof Edition !== 'undefined') Edition.onChange(() => { if (view === 'kanji') kanjiList(); else if (view === 'home') home(); });
    try { document.fonts.load('600 40px "Klee One"', GC.THEME.slice(0, 40).join('')); } catch (e) { /* fallback fonts */ }
    setInterval(tick, 200);
    measure();
    home();
  }

  /** Take the next tile of a set that can be cleared now (tests). */
  function solveStep() {
    if (!L || L.over) return false;
    let k = barKanji();
    if (k) {
      const t = L.tiles.find(x => x.k === k && isFree(x) && !L.bar.some(y => L.tiles[y].face === x.face));
      if (t) return tap(t.id);
      toBoard(L.bar.slice()); refreshFree();
    }
    k = completable()[0];
    if (!k) return false;
    return tap(takeOrder(k)[0].id);
  }
  return {
    start,
    test: {
      get S() { return S; }, get L() { return L; }, tap, hint, play, params, freeSets, completable, solveStep, normalize, pickKanji, buildLevel, home, parOf,
      demo, seed(n) { rand = mulberry32(n); }, timescale(n) { TS = n; },
      elapse(ms) { if (L) L.t += ms; },
      isFree: id => isFree(L.tiles[id]),
    },
  };
})();

Tiles.start();

</script>
