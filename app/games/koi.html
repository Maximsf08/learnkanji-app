/* Kana helpers shared by the app and the games: romaji for any kana reading, so that nothing in
   Learn Kanji needs hiragana or katakana to be read. Hepburn, with long vowels written as they are
   spelled (がっこう → gakkou, ー as a macron: ゲーム → gēmu); "." (okurigana) is dropped, "-" kept. */
'use strict';
const Kana = (() => {
  const hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const ROMA = {
    あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o', か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko', さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
    た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to', な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no', は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
    ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo', や: 'ya', ゆ: 'yu', よ: 'yo', ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro', わ: 'wa', ゐ: 'i', ゑ: 'e', を: 'o', ん: 'n',
    が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go', ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo', だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
    ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ゔ: 'vu',
    ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゎ: 'wa', ゕ: 'ka', ゖ: 'ke',
  };
  const YOON = { ゃ: 'a', ゅ: 'u', ょ: 'o' };
  // Small vowels after a kana make the sounds of loanwords: ティ ti, ファ fa, ウィ wi, ジェ je …
  const SMALL = { ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o' };
  const MACRON = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };
  /** Romaji for a kana string. Characters that are not kana (kanji, Latin, punctuation) are kept. */
  function romaji(s) {
    const t = hira(s).replace(/\./g, '');
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const c = t[i], nx = t[i + 1];
      if (c === 'っ') { const r = ROMA[nx] || ''; out += r && /[a-z]/.test(r[0]) && !/[aiueon]/.test(r[0]) ? (r.startsWith('ch') ? 't' : r[0]) : ''; continue; }
      if (c === 'ー') { const v = out.slice(-1); out = out.slice(0, -1) + (MACRON[v] || v); continue; }
      if (c === 'ん') { out += 'n' + (nx && /[あいうえおやゆよ]/.test(nx) ? "'" : ''); continue; }
      if (c === '・') { out += ' '; continue; }
      let r = ROMA[c];
      if (r === undefined) { out += c; continue; }
      if (nx && YOON[nx] && r.length > 1) {
        const base = r.slice(0, -1);
        r = (base === 'sh' || base === 'ch' || base === 'j') ? base + YOON[nx] : base + 'y' + YOON[nx];
        i++;
      } else if (nx && SMALL[nx] && /[てでうふしちじ]/.test(c)) {
        const base = { て: 't', で: 'd', う: 'w', ふ: 'f', し: 'sh', ち: 'ch', じ: 'j' }[c];
        r = base + SMALL[nx];
        i++;
      }
      out += r;
    }
    return out.replace(/\s+/g, ' ').trim();
  }
  const hasKana = s => /[ぁ-ゖァ-ヺー]/.test(String(s));
  return { romaji, hira, hasKana };
})();

/* The learner's goal: what the games, the journey and the home screen focus on, so nobody is given
   kanji their course or exam does not ask for. Kept in the app's settings (localStorage 'kakitori:v1',
   settings.goal) and read by the games too:
     {kind:'auto'}                      the level you are studying (the default; see currentLevel)
     {kind:'course', level:'B1', upTo}  one level of the app (a course that follows the books);
                                        upTo: the last lesson (unit number) the class has reached
     {kind:'jlpt', level:4}             a JLPT level and every level below it (N4 = N5 + N4)
     {kind:'all'}                       every kanji in the app
   JLPT levels: KDATA kanji field j (5 = N5 … 1 = N1), from Jonathan Waller's lists (tools/make_jlpt.py). */
'use strict';
const Goal = (() => {
  const APP = 'kakitori:v1';
  const K = () => KDATA.kanji;
  const books = () => KDATA.books;
  const lessonOf = n => KDATA.lessons[n - 1];
  const bookIndex = id => books().findIndex(b => b.id === id);
  const appState = () => {
    if (typeof Store !== 'undefined' && Store.state) return Store.state;
    try { return JSON.parse(localStorage.getItem(APP) || 'null') || {}; } catch (e) { return {}; }
  };
  const JLPT = [5, 4, 3, 2, 1];
  const jname = n => 'N' + n;

  function normalize(g) {
    if (!g || typeof g !== 'object') return { kind: 'auto' };
    if (g.kind === 'course' && bookIndex(g.level) >= 0) {
      const o = { kind: 'course', level: g.level };
      const l = +g.upTo && lessonOf(+g.upTo);
      if (l && l.b === g.level) o.upTo = +g.upTo;
      return o;
    }
    if (g.kind === 'jlpt' && JLPT.includes(+g.level)) return { kind: 'jlpt', level: +g.level };
    if (g.kind === 'all') return { kind: 'all' };
    return { kind: 'auto' };
  }
  /** The goal as stored (normalized). */
  const stored = () => normalize((appState().settings || {}).goal);

  /** The level you are studying: the level of the kanji you learned last, or the next level with kanji
      still to learn once that one is done (opening a lesson to look at it changes nothing). */
  function currentLevel() {
    const s = appState(), cards = s.cards || {}, order = books().map(b => b.id);
    let lastK = null, lastT = -1;
    for (const [k, c] of Object.entries(cards)) if (K()[k] && c && (+c.added || 0) > lastT) { lastT = +c.added || 0; lastK = k; }
    const open = k => typeof Edition === 'undefined' || !Edition.kanjiLocked(k);
    const hasNew = id => KDATA.lessons.some(l => l.b === id && [...l.kanji].some(k => !cards[k] && open(k)));
    const start = lastK ? Math.max(0, order.indexOf(lessonOf(K()[lastK].l).b)) : 0;
    for (let i = 0; i < order.length; i++) { const id = order[(start + i) % order.length]; if (hasNew(id)) return id; }
    return order[start];
  }

  /** The goal, resolved: {kind, level, upTo, auto, id, label, short, test(k), keep(k)}.
      test: is kanji k part of the goal. keep: may a kanji already met stay in play (the goal, or an
      easier level). */
  let memo = null;   // a game page reads the goal once (the app re-reads it: the level you are on moves)
  function resolve(g) {
    const plain = g === undefined, cache = plain && typeof Store === 'undefined';
    if (cache && memo) return memo;
    g = normalize(plain ? stored() : g);
    const auto = g.kind === 'auto';
    if (auto) g = { kind: 'course', level: currentLevel() };
    let test, keep, dist, label, short, id;
    if (g.kind === 'course') {
      const b = books()[bookIndex(g.level)], bi = bookIndex(g.level);
      const up = g.upTo ? lessonOf(g.upTo) : null;
      test = k => { const r = K()[k]; if (!r) return false; const l = lessonOf(r.l); return l.b === g.level && (!g.upTo || r.l <= g.upTo); };
      keep = k => { const r = K()[k]; return !!r && bookIndex(lessonOf(r.l).b) <= bi; };
      // how far a kanji is from the goal: easier levels first, then the next harder ones
      dist = k => { const r = K()[k]; if (!r || test(k)) return 0; const d = bookIndex(lessonOf(r.l).b) - bi; return d <= 0 ? -d * 0.5 + (d === 0 ? 0.25 : 0) : d; };
      short = b.short;
      const upName = up ? `${up.k === 'L' ? 'Lesson' : up.k === 'R' ? 'Review' : 'Column'} ${up.ln}` : '';
      label = up ? `${b.short}, up to ${upName}` : b.short;
      id = `course:${g.level}${g.upTo ? ':' + g.upTo : ''}`;
    } else if (g.kind === 'jlpt') {
      test = k => { const r = K()[k]; return !!r && (r.j || 1) >= g.level; };
      keep = test;
      dist = k => { const r = K()[k]; return !r ? 9 : Math.max(0, g.level - (r.j || 1)); };
      short = label = `JLPT ${jname(g.level)}`;
      id = `jlpt:${g.level}`;
    } else {
      test = k => !!K()[k];
      keep = test;
      dist = () => 0;
      short = 'All levels'; label = 'All levels';
      id = 'all';
    }
    const out = { ...g, auto, id: auto ? 'auto:' + id : id, label, short, test, keep, dist };
    if (cache) memo = out;
    return out;
  }

  /** The goal's kanji, in the order of the lessons. */
  function syllabus(g) {
    const r = resolve(g);
    const out = [];
    for (const l of KDATA.lessons) for (const k of l.kanji) if (r.test(k)) out.push(k);
    return out;
  }
  /** How many kanji a goal has (for the goal picker). */
  const size = g => syllabus(g).length;
  /** Kanji at each JLPT level (not cumulative). */
  function jlptCounts() {
    const c = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
    for (const r of Object.values(K())) c[r.j || 1]++;
    return c;
  }
  return { stored, resolve, syllabus, size, normalize, currentLevel, jlptCounts, JLPT, jname, get: () => resolve(), forget: () => { memo = null; } };
})();

/* The journey: the seven games as one trip through old Japan, and the rewards that keep a learner going.
   Shared by the app and the game pages; kept in localStorage 'kakitori:journey:v1'.

   Route: the river (Koi) → the inn kitchen → the Tōkaidō (Road) → the temple school → the castle town
   → the apothecary (Alchemy) → the teahouse (Tiles), then round again. A stop asks for STEPS level-ups
   of that game's kanji of your goal (a kanji going from level 0 to 1, 1 to 2 or 2 to 3); a game with
   nothing left to raise is passed by. Finishing a stop writes a stamp in the journal and sends you on to the next place.

   Rewards (the free version of the Store edition: each one is a locked lesson, opened for good):
     - the weekly goal: finish one stop between Monday and Sunday
     - every 7 days in a row of practice (lessons, reviews or games)
     - friends: your invite code gives a friend a lesson; their thank-you code gives you one
   With everything unlocked, the same moments earn stamps instead. No reward ever depends on a rating
   or a review. Earned lessons are kept apart from the Store's licences, and survive Reset progress.
   (Before 1.4 five friends opened every lesson; with paid plans, each friend is one lesson.) */
'use strict';
const Journey = (() => {
  const KEY = 'kakitori:journey:v1', GKEY = 'kakitori:games:v1', AKEY = 'kakitori:v1';
  const ROUTE = ['koi', 'kitchen', 'road', 'school', 'castle', 'alchemy', 'tiles'];
  const STEPS = 6, STREAK = 7;
  const PLACES = {
    koi: { title: 'The river', jp: '川辺', gift: 'a paper carp streamer', from: 'the river',
      arrive: 'Dawn on the river. A boatman is raising the carp streamers: “The lanterns over the water carry kanji of land, water and sky. Fly with the koi and catch the right ones.”' },
    kitchen: { title: 'The inn kitchen', jp: '宿の台所', gift: 'a lunch box', from: 'the inn',
      arrive: 'Downriver, the cook of a small inn waves you into her kitchen: “My regulars order by the kanji on the menu. Can you find the right jar?”' },
    road: { title: 'The Tōkaidō', jp: '東海道', gift: 'a pair of straw sandals', from: 'the Tōkaidō',
      arrive: 'With the inn’s lunch box in your bag you set off along the Tōkaidō, the old road to Kyoto. Every station on it has kanji of places and travel, of moving, carrying and making.' },
    school: { title: 'The temple school', jp: '寺子屋', gift: 'a karuta card signed by Sensei', from: 'the temple school',
      arrive: 'At the end of the road stands a temple school. Sensei is holding a karuta tournament, and needs a player who knows the kanji of study, words and the arts.' },
    castle: { title: 'The castle town', jp: '城下町', gift: 'a lord’s banner', from: 'the castle town',
      arrive: 'One of Sensei’s old pupils serves the lord of the castle town. Rival lords are claiming the old provinces, under banners of society and law, money and work.' },
    alchemy: { title: 'The apothecary', jp: '薬屋', gift: 'a paper packet of medicine', from: 'the apothecary',
      arrive: 'After the battles, the town’s apothecary has more slips than hands. Each medicine is a kanji of the body or of science, made by merging its parts on the counter.' },
    tiles: { title: 'The teahouse', jp: '茶屋', gift: 'a cup of green tea', from: 'the teahouse',
      arrive: 'Home again. The teahouse keeper sets out tiles: “Sort what you have learned, each kanji with its meaning and its reading, while the tea is warm.”' },
  };
  const LAP_LINES = ['', 'A new season on the road. ', 'The road is familiar now, and so are the kanji. ', 'Another lap of the road: time to master what you know. '];

  /* ---------------- storage ---------------- */
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
  const fresh = () => ({ v: 1, name: '', id: '', lap: 1, at: 0, stop: null, log: [], weeks: {}, earned: [], friends: [],
    invitedBy: '', thanks: '', all: false, days: {}, streaks: [], badges: {} });
  function normalize(s) {
    const o = fresh();
    if (!s || typeof s !== 'object') return o;
    for (const f of ['name', 'id', 'invitedBy', 'thanks']) if (typeof s[f] === 'string') o[f] = s[f].slice(0, 40);
    for (const f of ['lap', 'at']) if (Number.isFinite(+s[f])) o[f] = Math.max(f === 'lap' ? 1 : 0, Math.floor(+s[f]));
    o.at %= ROUTE.length;
    if (s.stop && typeof s.stop === 'object' && ROUTE.includes(s.stop.g)) o.stop = s.stop;
    if (Array.isArray(s.log)) o.log = s.log.filter(x => x && ROUTE.includes(x.g)).slice(-400);
    if (s.weeks && typeof s.weeks === 'object') o.weeks = s.weeks;
    if (Array.isArray(s.earned)) o.earned = s.earned.filter(x => x && Number.isFinite(+x.n)).map(x => ({ n: +x.n, why: String(x.why || ''), t: +x.t || 0 }));
    if (Array.isArray(s.friends)) o.friends = [...new Set(s.friends.filter(x => typeof x === 'string'))];
    o.all = !!s.all;
    if (s.days && typeof s.days === 'object') o.days = s.days;
    if (Array.isArray(s.streaks)) o.streaks = s.streaks.filter(x => typeof x === 'string');
    if (s.badges && typeof s.badges === 'object') o.badges = s.badges;
    return o;
  }
  let S = normalize(read(KEY));
  const listeners = new Set();
  function save() {
    write(KEY, S);
    syncEdition();
    listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  /** Read the store again (another page may have changed it). */
  function reload() { S = normalize(read(KEY)); syncEdition(); }
  function syncEdition() {
    if (typeof Edition !== 'undefined' && Edition.setEarned) Edition.setEarned(S.earned.map(x => x.n));
  }

  /* ---------------- days, weeks and the streak ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const today = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  function weekId(t = Date.now()) {   // ISO 8601 week, Monday to Sunday, local time
    const d = new Date(t); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));        // the Thursday of this week
    const w1 = new Date(d.getFullYear(), 0, 4);
    const w = 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
    return `${d.getFullYear()}-W${pad(w)}`;
  }
  /** Days with practice: lessons and reviews (the app) or answers in a game. */
  let appSrc = null;
  /** A game page passes the app's state it has read already (reading it again each answer is slow). */
  const useApp = f => { appSrc = typeof f === 'function' ? f : null; };
  function streak(t = Date.now()) {
    const app = appSrc ? appSrc() || {} : typeof Store !== 'undefined' ? Store.state : (read(AKEY) || {});
    const days = app.days || {};

  const SPOTS = [[0.1, -0.35, 0.22, 0.42], [0.36, 0.25, 0.2, 0.36], [0.62, -0.2, 0.16, 0.3]];

  function drawKoi(ctx, x, y, ang, t, skin, s, rush, alpha = 1, ink = SC.ink) {

    const at = u => { const i = Math.round(u * N); return [(top[i][0] + bot[i][0]) / 2, (top[i][1] + bot[i][1]) / 2, (bot[i][1] - top[i][1]) / 2]; };

    if (skin.spot2) for (const [u, dy, rw] of [[0.24, 0.3, 0.07], [0.5, -0.35, 0.06], [0.74, 0.2, 0.05]]) { const [cx2, cy2, hh] = at(u); ctx.fillStyle = skin.spot2; ctx.beginPath(); ctx.ellipse(cx2, cy2 + dy * hh, rw * L * 0.5, hh * 0.32, 0, 0, 6.283); ctx.fill(); }

    }

    const fin = (u, dir) => { const [fx, fy] = at(u); ctx.beginPath(); ctx.moveTo(fx + s * 0.1, fy + dir * h0 * 0.7); ctx.quadraticCurveTo(fx - s * 0.15, fy + dir * h0 * 1.55, fx - s * 0.55, fy + dir * h0 * 1.25); ctx.lineTo(fx - s * 0.25, fy + dir * h0 * 0.75); ctx.closePath(); ctx.fillStyle = skin.fin; ctx.fill(); ctx.stroke(); };

    ctx.fillStyle = rush ? '#c8521f' : '#1d2420'; ctx.beginPath(); ctx.ellipse(top[0][0] + s * 0.03, (top[0][1] + bot[0][1]) / 2, s * 0.05, h0 * 0.5, 0, 0, 6.283); ctx.fill();

  const RUSH_SKIN = { body: '#f0b838', spot: '#d8582a', fin: '#f6d873', scale: 'rgba(140,60,10,.35)', horns: true };

  /** A lantern: red paper (grey once it is a wrong one), dark caps, and its kanji on a face like the app's cards.
      At night the lanterns are lit. A ring shows the right one: in the first flight (a guide), and after a
      mistake or a miss (so you see which it was). */
  function drawLantern(e, t) {
    const r = e.r, bob = Math.sin(e.ph + t * 2.1) * r * 0.07;

  /* ---------------- particles ----------------
     They use Math.random, not the flight's random: a seeded flight (Koi.test.seed) is the same however it is drawn. */
  const fx = Math.random;

    }

    else if (T === 'ink') { if (fx() < 0.5) P.push({ x, y: y + (fx() - 0.5) * R * 0.3, vx: -R * 2.8, vy: 0, life: 0.7, age: 0, col: rgba(SC.ink, 0.5), size: R * (0.08 + fx() * 0.1), kind: 'dot' }); }

      revived: false, started: false, over: false, outro: null, final: false, guide: pl.first ? 3 : 0, hintT: 0,
      metres: 0, bestBefore: best[mode === 'zen' ? 'zen' : 'score'] || 0, bestShown: false, gatePassed: false,
      shake: 0, levelsBefore: Object.fromEntries(p.map(ch => [ch, level(ch)])), groupId: 0, splashT: 0,
    };
    koi.y = (TOP + BOT) / 2; koi.vy = 0; holding = false;
    nextWave();
  }
  const gapLen = () => W * (run.mode === 'zen' ? 0.66 : 0.58);
  /** The carp's speed, in screen widths a second: it rises through a flight (not in Zen). */
  function speedAt(f) {
    if (run.mode === 'zen') return 0.21;
    return run.first ? 0.215 * (1 + f * 0.15) : 0.235 * (1 + f * 0.4);
  }
  /** A wave: the same clue for a few groups of lanterns (more for kanji still new). Mastered kanji
      sometimes come as a sound-only clue. */
  function nextWave() {
    const tgt = GC.pickTarget(run.pool, { rand, avoid: run.lastTarget });
    const lv = level(tgt);
    run.waveTarget = tgt;
    run.lastTarget = tgt;
    run.waveSound = lv >= 3 && rand() < 0.5;
    run.waveLeft = lv <= 1 ? 4 + Math.floor(rand() * 3) : 2 + Math.floor(rand() * 2);
  }
  function slots(n) {
    const ys = [0, 1, 2, 3, 4].map(i => TOP + (BOT - TOP) * (i + 0.5) / 5);
    const combos = n === 1 ? [[0], [1], [2], [3], [4]] : n === 2 ? [[0, 2], [0, 3], [0, 4], [1, 3], [1, 4], [2, 4]] : [[0, 2, 4]];
    const jit = (BOT - TOP) * 0.03;
    return pick(combos).map(i => ys[i] + (rand() - 0.5) * jit);
  }
  function spawn() {
    const x0 = W + R * 1.6, f = run.dist / run.L;
    const arrive = x => (x - koiX) / W * MPW;   // metres until something at x reaches the carp
    const gap = gapLen(), mid = x0 + gap * 0.5;
    let coinY = null, lanterns = false;
    if (run.dist + arrive(x0) < run.L - 30) {
      lanterns = true;
      if (run.waveLeft <= 0) nextWave();
      run.waveLeft--;
      const tgt = run.waveTarget, sound = run.waveSound, n = run.first || f < 0.15 ? 2 : 3;
      const chars = shuffle([tgt, ...GC.distractors(tgt, n - 1, run.pool, { rand, conf: S.conf, sound })]);
      const ys = slots(chars.length), gid = ++run.groupId, guide = run.guide > 0;
      if (guide) run.guide--;
      chars.forEach((ch, i) => run.ents.push({ type: 'lantern', x: x0 + (rand() - 0.5) * R * 0.5, y: ys[i], r: R, ch, tgt, sound, gid, ph: rand() * 6, guide: guide && ch === tgt }));
    } else run.final = true;   // the last stretch: no more lanterns, only coins on the way to the gate
    // the gap after a group: coins and (in a flight, not the first) storm clouds
    if (run.dist + arrive(mid + gap * 0.25) < run.L - 4 && (run.final || rand() < 0.62)) {
      coinY = TOP + R + rand() * (BOT - TOP - 2 * R);
      const amp = R * (0.6 + rand() * 0.8) * (rand() < 0.5 ? -1 : 1);
      for (let i = 0; i < 6; i++) run.ents.push({ type: 'coin', x: mid - gap * 0.22 + i * gap * 0.088, y: clamp(coinY + Math.sin(i / 5 * Math.PI) * amp, TOP, BOT), ph: i * 0.4 });
    }
    if (run.clouds && lanterns && f > run.cloudFrom && run.dist + arrive(mid) < run.L - 40) {
      const p1 = Math.min(0.78, 0.3 + 0.45 * f), count = (rand() < p1 ? 1 : 0) + (f > 0.6 && rand() < 0.25 ? 1 : 0);
      const used = [];
      for (let c = 0; c < count; c++) {
        // a cloud keeps clear of the coins and of the other cloud (or is not placed: never a wall across the sky)
        let y = null;
        for (let tries = 0; tries < 12 && y === null; tries++) {
          const t = TOP + R * 0.8 + rand() * (BOT - TOP - R * 1.6);
          if ((coinY === null || Math.abs(t - coinY) > R * 2.4) && used.every(u => Math.abs(u - t) > R * 3)) y = t;
        }
        if (y === null) continue;
        used.push(y);
        run.ents.push({ type: 'cloud', x: mid + (rand() - 0.5) * gap * 0.25, y, r: R * 1.05, ph: rand() * 6 });
      }
      if (used.length && !S.tips.cloud) { S.tips.cloud = 1; save(); hint('Storm clouds cost a heart: fly round them', 5); }
    }
  }
  /** The clue shows what the next group of lanterns wants (or the gate, in the last stretch). */
  function upcoming() {
    let best = null;
    for (const e of run.ents) if (e.type === 'lantern' && !e.done && e.x > koiX - R * 0.6 && (!best || e.x < best.x)) best = e;
    if (best) return { tgt: best.tgt, sound: best.sound };
    return run.final ? { tgt: null } : { tgt: run.waveTarget, sound: run.waveSound };
  }
  function headPos() { const ang = clamp(-koi.vy / (H * 1.6), -0.5, 0.5); return [koiX + Math.cos(ang) * R * 1.05, koi.y + Math.sin(ang) * R * 1.05, ang]; }
  function groupDone(gid) { for (const e of run.ents) if (e.type === 'lantern' && e.gid === gid) { e.done = true; if (!e.gone) e.inert = true; } }
  /** Show the right lantern of a group (after a mistake or a miss). */
  function reveal(gid) { for (const e of run.ents) if (e.type === 'lantern' && e.gid === gid && e.ch === e.tgt && !e.gone) { e.inert = false; e.reveal = 1.4; } }

  function catchLantern(e) {
    // a Dragon Rush, and a moment after it: wrong lanterns burst harmlessly (no wrong answer sprung as it ends)
    const rush = run.rushT > 0, safe = rush || run.graceT > 0, at = toWindow(e.x, e.y);
    if (e.ch === e.tgt) {
      run.catches++;
      run.per[e.ch] = (run.per[e.ch] || 0) + 1;
      const lv0 = level(e.ch), lv = GC.record(e.ch, true);
      // every three in a row raises the points a lantern is worth, up to five times
      const next = ((GC.roundStats || {}).combo || 0) + 1, mult = Math.min(5, 1 + Math.floor(next / 3));
      const gain = 100 * mult * (rush ? 2 : 1);
      run.combo = GC.hit({ x: at.x, y: at.y, text: `+${fmt(gain)}`, big: mult > run.mult });
      run.bestCombo = Math.max(run.bestCombo, run.combo);
      if (mult > run.mult) bump($('hmult'));
      run.mult = mult; run.maxMult = Math.max(run.maxMult, mult);
      run.score += gain;
      if (!rush) { run.fever = Math.min(1, run.fever + 0.2); if (run.fever >= 1) startRush(); }
      burst(e.x, e.y, 10, SC.gold, 1, 'star');
      e.gone = 0.0001;
      groupDone(e.gid);
      e.inert = false;
      if (run.first && run.catches === 3) hint('');
      if (lv >= 3 && lv0 < 3) checkGate();
    } else if (safe) {
      // in a Dragon Rush the wrong lanterns burst harmlessly
      e.gone = 0.0001; groupDone(e.gid); e.inert = false;
      burst(e.x, e.y, 8, SC.gold, 0.7, 'star');
    } else {
      run.wrong++; run.combo = 0; run.mult = 1;
      run.fever = Math.max(0, run.fever - 0.3);
      GC.record(e.tgt, false);
      GC.miss({ el: $('clue') });
      S.conf[e.tgt + '>' + e.ch] = (S.conf[e.tgt + '>' + e.ch] || 0) + 1;
      e.bad = true; e.wrongT = 0.6;
      popup(e.x, e.y - R * 1.5, `${e.ch} = ${meaning(e.ch)}`, PC.text, 0.95);
      groupDone(e.gid);
      e.inert = false;
      reveal(e.gid);
    }
  }
  /** A group flown past without a catch: the combo breaks (it is not a wrong answer), and the right one shows. */
  function missGroup(e) {
    groupDone(e.gid);
    reveal(e.gid);
    if (run.rushT > 0 || run.graceT > 0) return;
    run.missed++;
    if (run.combo > 0) { GC.miss({ sound: false }); run.combo = 0; run.mult = 1; popup(koiX + R * 0.6, koi.y - R * 1.3, 'Missed', PC.muted, 0.72); }
  }
  function startRush() {
    run.rushT = 6; run.fever = 0; run.rushes++;
    GC.count('rushes', 1);
    Sfx.rush(); toast('Dragon Rush', 'Every right lantern comes to you');
    if (S.settings.shake && !reduceMotion()) run.shake = 0.35;
  }
  function hitCloud(e) {
    e.hit = true;
    run.hearts--; run.lost++; run.invT = 1.6;
    Sfx.hit(); burst(e.x, e.y, 18, SC.stone2, 1.2);
    if (S.settings.shake && !reduceMotion()) run.shake = 0.5;
    if (run.hearts <= 0) startOutro('fall');
  }
  /** The thirtieth kanji mastered in flight: the Dragon Gate opens there and then. */
  function checkGate() {
    if (S.gate || mastered() < GATE) return;
    S.gate = true; if (!S.owned.includes('dragon')) S.owned.push('dragon');
    save();
    if (run) run.gatePassed = true;
    toast('The Dragon Gate opens', 'Your carp can fly as a dragon');
  }

  /* The end of a flight: through the gate at nightfall ('done'), or down into the sea out of hearts ('fall').
     A moment in the scene (in game time, so the tests' time scale counts), then the results or the revive question. */
  function startOutro(kind) {
    run.outro = { kind, t: 0 };
    holding = false;
    hint('');
    if (kind === 'done') {
      Sfx.gate();
      toast(run.mode === 'zen' ? 'Nightfall' : 'Flight complete', `${run.catches} kanji caught`);
      const [hx, hy] = headPos();
      burst(hx, hy, 26, SC.gold, 1.4, 'star'); burst(hx, hy, 12, SC.red, 1);
    } else toast('Out of hearts');
  }
  function outro(dt) {
    const o = run.outro;
    o.t += dt;
    if (o.kind === 'done') {
      // the carp glides on and up a little, through the gate and into the night
      koi.vy = lerp(koi.vy, -H * 0.1, Math.min(1, dt * 3));
      koi.y = Math.max(TOP - R * 0.9, koi.y + koi.vy * dt);
      if (o.t > 1.5 && !o.fired) { o.fired = true; finish('done'); }
      return;
    }
    // out of hearts: it tumbles into the sea
    koi.vy = Math.min(H * 0.9, koi.vy + 1.6 * H * dt);
    koi.y = Math.min(H + R * 2, koi.y + koi.vy * dt);
    if (!o.splashed && koi.y > BOT + R * 0.55) { o.splashed = true; Sfx.splash(); burst(koiX, BOT + R, 14, SC.foam, 0.8); }
    if (o.t > (reduceMotion() ? 0.4 : 1.1) && !o.fired) {
      o.fired = true;
      if (!run.revived && run.catches > 0) reviveQuiz(); else finish('hearts');
    }
  }

  function step(dt) {
    T += dt;
    if (!run) { idleScroll += W * 0.12 * dt; return; }
    if (paused) return;
    if (run.over) {
      // behind the results: the scene drifts on at nightfall, the carp at rest on the wind
      const dx = W * 0.05 * dt;
      run.scroll += dx; run.dist += dx / W * MPW;
      for (const e of run.ents) e.x -= dx;
      koi.vy = lerp(koi.vy, 0, Math.min(1, dt * 2));
      koi.y = lerp(koi.y, (TOP + BOT) / 2 + Math.sin(T * 1.4) * R * 0.3, Math.min(1, dt * 1.5));
      run.shake = 0;
      return;
    }
    if (!run.started) { koi.y = (TOP + BOT) / 2 + Math.sin(T * 2) * R * 0.3; return; }
    run.t += dt;
    const f = clamp(run.dist / run.L, 0, 1), rush = run.rushT > 0;
    const v = speedAt(f) * W * (rush ? 1.45 : 1) * (run.outro && run.outro.kind === 'fall' ? 0.4 : 1), dx = v * dt;
    run.scroll += dx; run.dist += dx / W * MPW;
    // the metres flown count for the missions, fifty at a time (the rest when the flight ends)
    const flown = Math.floor(Math.min(run.dist, run.L));
    if (flown - run.metres >= 50) { GC.count('metres', flown - run.metres); run.metres = flown; }
    if (run.outro) outro(dt);
    else {
      if (autopilot) drive();
      const gk = 1.75 * H, up = 1.95 * H, vmax = 0.78 * H;
      koi.vy = clamp(koi.vy + (holding ? -up : gk) * dt, -vmax, vmax);
      koi.y += koi.vy * dt;
      const lo = TOP - R * 0.9, hi = BOT + R * 0.55;
      if (koi.y < lo) { koi.y = lo; koi.vy = Math.max(0, koi.vy); }
      if (koi.y > hi) { koi.y = hi; koi.vy = Math.min(0, koi.vy); if (run.splashT <= 0) { run.splashT = 0.6; Sfx.splash(); burst(koiX, hi + R * 0.4, 10, SC.foam, 0.6); } }
      run.splashT -= dt;
    }
    if (!run || run.over) return;
    run.nextGroup -= dx;
    if (run.nextGroup <= 0) { if (!run.outro) spawn(); run.nextGroup += gapLen(); }
    const [hx, hy] = headPos();
    for (const e of run.ents) {
      e.x -= dx;
      if (e.gone) e.gone += dt;
      if (e.reveal > 0) e.reveal = Math.max(0, e.reveal - dt);
      if (e.wrongT) { e.wrongT = Math.max(0, e.wrongT - dt); e.y += R * 2 * dt; }
      if (rush && !e.gone && (e.type === 'coin' || (e.type === 'lantern' && !e.done && e.ch === e.tgt))) {
        const ddx = hx - e.x, ddy = hy - e.y, d = Math.hypot(ddx, ddy);
        if (d < R * 6 && d > 1) { const pull = Math.min(d, R * 14 * dt); e.x += ddx / d * pull; e.y += ddy / d * pull; }
      }
    }

      if (e.gone || e.done && e.type === 'lantern') continue;
      if (e.type === 'lantern') {
        const d = Math.hypot(hx - e.x, hy - e.y);
        if (d < e.r * 0.95 + R * 0.42) catchLantern(e);
        else if (e.ch === e.tgt && e.x < koiX - R * 0.6) missGroup(e);
      } else if (e.type === 'coin') {
        if (Math.hypot(hx - e.x, hy - e.y) < R * 0.75 || Math.hypot(koiX - e.x, koi.y - e.y) < R * 0.6) {

        }
      } else if (e.type === 'cloud' && !e.hit) {
        const d = Math.min(Math.hypot(hx - e.x, hy - e.y), Math.hypot(koiX - e.x, koi.y - e.y));
        if (d < e.r * 0.78 + R * 0.38 && run.invT <= 0 && !rush) hitCloud(e);
        else if (!e.near && e.x < koiX - R && d < e.r + R * 1.25) {
          e.near = true;
          if (!rush && run.invT <= 0) { run.close++; run.score += 50; Sfx.near(); popup(e.x, e.y - e.r, 'Close! +50', PC.accent, 0.85); GC.count('close', 1); }
        }
      }

    }
    if (!run || run.over) return;
    run.ents = run.ents.filter(e => e.x > -R * 4 && !(e.gone > 0.4));
    if (run.rushT > 0) { run.rushT -= dt; if (run.rushT <= 0) { run.rushT = 0; run.graceT = 0.6; } }
    else run.graceT = Math.max(0, run.graceT - dt);
    run.invT = Math.max(0, run.invT - dt);

    if (!run.bestShown && run.bestBefore > 0 && run.score + Math.min(run.dist, run.L) > run.bestBefore) { run.bestShown = true; toast('New best!', 'Keep going'); GC.sfx.level(); }
    const nx = upcoming(), key = nx.tgt ? nx.tgt + (nx.sound ? '~' : '') : 'gate';
    if (key !== run.clueKey) setClue(nx.tgt, nx.sound);
  }

  /** Test autopilot: steer to the right lantern ('right'), deliberately the wrong one ('wrong'), or between them ('skip'). */
  function drive() {
    let best = null;
    for (const e of run.ents) if (e.type === 'lantern' && !e.done && !e.gone && e.x > koiX && (!best || e.x < best.x)) best = e;
    let ty = (TOP + BOT) / 2;
    if (best && autopilot === 'skip') {
      const group = run.ents.filter(e => e.type === 'lantern' && e.gid === best.gid), away = y => Math.min(...group.map(e => Math.abs(e.y - y)));
      for (let i = 0, far = -1; i < 5; i++) { const y = TOP + (BOT - TOP) * (i + 0.5) / 5; if (away(y) > far) { far = away(y); ty = y; } }
    } else if (best) {
      const wantRight = autopilot !== 'wrong';
      const opts = run.ents.filter(e => e.type === 'lantern' && e.gid === best.gid && !e.done && ((e.ch === e.tgt) === wantRight));
      if (opts.length) ty = opts[0].y;
    }
    // storm clouds close ahead: the height nearest the aim that is clear of all of them
    const near = run.ents.filter(e => e.type === 'cloud' && !e.hit && e.x > koiX - R * 1.5 && e.x < koiX + W * 0.32);
    if (near.length) {
      // a cloud strikes within 0.78 of its size and 0.38 of the carp's (step): keep a little more than that
      const clear = y => Math.min(...near.map(c => Math.abs(c.y - y) - (c.r * 0.78 + R * 0.62)));
      let pickY = ty, cost = Infinity;
      for (const c of [ty, ...near.flatMap(c => [c.y - (c.r * 0.78 + R * 0.8), c.y + (c.r * 0.78 + R * 0.8)])]) {
        const y = clamp(c, TOP - R * 0.85, BOT + R * 0.5), k = (clear(y) >= 0 ? 0 : 1e6 - clear(y)) + Math.abs(y - ty);
        if (k < cost) { cost = k; pickY = y; }
      }
      ty = pickY;
    }
    const predicted = koi.y + koi.vy * 0.16;
    holding = predicted > ty;
  }

  /* ---------------- drawing a frame ---------------- */
  function frame(dt) {
    SC = sceneAt(dayShare());   // the further you fly, the later it gets
    g.save();
    if (run && run.shake > 0) g.translate((fx() - 0.5) * R * 0.4 * run.shake, (fx() - 0.5) * R * 0.4 * run.shake);
    drawSky(run ? run.scroll : idleScroll, T);
    if (run) {
      const gx = koiX + (run.L - run.dist) * W / MPW;
      if (gx < W + R * 5 && gx > -R * 5) drawTorii(gx, T);
      for (const e of run.ents) if (e.type === 'coin') drawCoin(e, T);
      for (const e of run.ents) if (e.type === 'cloud') drawCloud(e, T);
      for (const e of run.ents) if (e.type === 'lantern') drawLantern(e, T);
      const rush = run.rushT > 0 && !run.over, ang = clamp(-koi.vy / (H * 1.6), -0.5, 0.5);
      if (run.started && !paused && !run.over) trail(koiX - R * 1.8, koi.y + Math.sin(ang) * -R, rush);
      drawParts(paused ? 0 : dt);
      const blink = run.invT > 0 && !run.over && Math.floor(run.invT * 12) % 2 === 0;
      drawKoi(g, koiX, koi.y, ang, T, rush ? RUSH_SKIN : skinOf(S.skin), R, rush, blink ? 0.35 : 1);
      drawPops(paused ? 0 : dt);
    } else {
      drawKoi(g, W * (W < 860 ? 0.5 : 0.3), H * 0.74 + Math.sin(T * 1.6) * R * 0.4, Math.sin(T * 1.6 + 1) * 0.12, T, skinOf(S.skin), R * 1.2, false);
    }
    g.restore();
  }
  const skinOf = id => SKINS.find(s => s.id === id) || SKINS[0];

  let lastNow = 0, acc = 0;
  function loop(now) {
    const dtr = Math.min(0.05, (now - (lastNow || now)) / 1000) * timeScale;
    lastNow = now;
    acc += dtr;
    const STEP = 1 / 120;
    let n = 0;
    while (acc >= STEP && n < 40) { step(STEP); acc -= STEP; n++; }
    if ($('screen').hidden) frame(dtr);   // the pages (the hub, the shop…) cover the sky: no need to paint it under them
    if (run && !run.over) hud();
    requestAnimationFrame(loop);
  }

  /* ---------------- HUD ---------------- */
  let hudCache = {};
  function hud() {
    const set = (k, v, fn) => { if (hudCache[k] !== v) { hudCache[k] = v; fn(v); } };
    set('score', Math.round(run.score + Math.min(run.dist, run.L)), v => { $('hscore-n').textContent = fmt(v); });
    set('mult', run.mult, v => { const el = $('hmult'); el.hidden = v < 2; el.textContent = `×${v}`; });
    set('dist', Math.floor(Math.min(run.dist, run.L)), v => { $('hdist').textContent = `${fmt(v)} m`; });
    set('coins', run.coins, v => { $('hcoins').lastElementChild.textContent = v; });
    set('hearts', run.mode === 'zen' ? -1 : run.hearts, v => { $('hearts').innerHTML = v < 0 ? '' : [0, 1, 2].map(i => `<svg viewBox="0 0 24 24" class="${i < v ? 'on' : 'off'}">${ICON.heart}</svg>`).join(''); $('hearts').setAttribute('aria-label', `${Math.max(0, v)} of 3 hearts`); });
    set('fever', run.rushT > 0 ? -Math.ceil(run.rushT / 6 * 50) : Math.round(run.fever * 100), v => { $('feverfill').style.width = (v < 0 ? -v * 2 : v) + '%'; $('fever').classList.toggle('rush', v < 0); });
    set('track', Math.round(clamp(run.dist / run.L, 0, 1) * 500) / 5, v => { $('trackfill').style.width = v + '%'; });
  }
  /** A little pop of a counter in the HUD. */
  function bump(el) { if (el && el.animate && !reduceMotion()) el.animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'ease-out' }); }
  /** A small inline hint under the clue (for the first flights); '' hides it. secs: how long it stays (0: until hidden). */
  function hint(text, secs = 0) {
    const el = $('cluehint');
    if (!el) return;
    el.hidden = !text; el.textContent = text || '';
    if (run) run.hintT = text ? secs : 0;
  }
  const picSvg = ch => { const p = GC.picture(ch); return p ? `<svg viewBox="0 0 109 109" aria-hidden="true">${p}</svg>` : ''; };
  const readLine = ch => { const r = GC.reading(ch); return `<b lang="ja">${esc(r)}</b>${GC.opt.romaji ? esc(GC.romaji(r)) : ''}`; };
  /** The clue card. New kanji: the kanji itself (and its picture). Level 1: the picture (or a question
      mark) with the meaning. Level 2: the meaning. Level 3: the meaning, or only the sound. In the last
      stretch: the gate. */
  function setClue(ch, sound = false) {
    run.clueKey = ch ? ch + (sound ? '~' : '') : 'gate';
    const el = $('clue');
    if (!ch) {
      el.innerHTML = `<div class="pic gate" aria-hidden="true">${TORII}</div><div class="txt"><div class="lbl">Almost there</div><div class="what">The gate</div></div>`;
      el.setAttribute('aria-label', 'Almost there: fly through the gate');
      el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
      return;
    }
    const lv = level(ch), pic = picSvg(ch), m = esc(GC.clueMeaning(ch)), r = GC.reading(ch);
    let html;
    if (sound) {
      // the romaji sits beside the kana (on a phone the reading line gives way, and a beginner needs it here)
      html = `<div class="pic ear" aria-hidden="true">${ICON.say}</div><div class="txt"><div class="lbl">Catch the kanji you hear</div><div class="what"><span class="snd" lang="ja">${esc(r)}</span>${GC.opt.romaji ? `<span class="ro">${esc(GC.romaji(r))}</span>` : ''}</div></div>`;
      if (run.started && !S.tips.sound) { S.tips.sound = 1; save(); hint('A sound clue: catch the kanji read this way', 5); }
    } else if (lv >= 2 || (lv === 1 && !pic)) {
      html = `<div class="pic ask" aria-hidden="true">?</div><div class="txt"><div class="lbl">Catch</div><div class="what">${m}</div><div class="read">${readLine(ch)}</div></div>`;
    } else if (lv === 1) {
      html = `<div class="pic">${pic}</div><div class="txt"><div class="lbl">Catch</div><div class="what">${m}</div><div class="read">${readLine(ch)}</div></div>`;
    } else if (pic) {
      html = `<div class="pic">${pic}</div><div class="txt"><div class="lbl">Catch</div><div class="what">${m}<span class="glyphline" lang="ja">${ch}</span></div><div class="read">${readLine(ch)}</div></div>`;
    } else {
      html = `<div class="pic glyph" lang="ja">${ch}</div><div class="txt"><div class="lbl">Catch</div><div class="what">${m}</div><div class="read">${readLine(ch)}</div></div>`;
    }
    el.innerHTML = html;
    el.setAttribute('aria-label', sound ? `Catch the kanji read ${GC.romaji(r)}` : `Catch ${GC.clueMeaning(ch)}`);
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
    if (run.started) { Sfx.swap(); GC.say(r); }
  }
  let toastTimer = 0;
  function toast(text, small = '') {
    const el = $('toast');
    el.innerHTML = esc(text) + (small ? `<small>${esc(small)}</small>` : '');
    el.classList.toggle('over', !screen().hidden);   // on a page (an unlock): over it; in flight: under the pages
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  /* ---------------- the three stars of a flight ---------------- */
  /** The flight's three goals, with how far each has come: { short, text, done }. */
  function goalsOf(r) {
    // a clean flight is one with no wrong lantern and at least five caught (landing after one catch is not one)
    const flown = Math.floor(Math.min(r.dist, r.L)), clean = r.wrong === 0 && r.catches >= 5;
    const cleanMore = r.wrong ? `${r.wrong} wrong` : clean ? '' : 'catch at least 5';
    const best = Math.max(r.bestCombo, (GC.roundStats || {}).bestCombo || 0);
    const list = r.mode === 'zen' ? [
      { short: `Catch ${r.goal} kanji`, done: r.catches >= r.goal, more: `${r.catches} caught`, always: true },
      { short: 'Reach a combo of 10', done: best >= 10, more: best ? `best ×${best}` : '' },
      { short: 'No wrong lantern', done: clean, more: cleanMore },
    ] : [
      { short: `Fly all ${fmt(r.L)} m`, done: flown >= r.L, more: `${fmt(flown)} m` },
      { short: `Catch ${r.goal} kanji`, done: r.catches >= r.goal, more: `${r.catches} caught`, always: true },
      { short: 'No wrong lantern', done: clean, more: cleanMore },
    ];
    return list.map(x => ({ ...x, text: (x.done && !x.always) || !x.more ? x.short : `${x.short} (${x.more})` }));
  }
  const goalList = r => `<ul class="gc-goals">${goalsOf(r).map(x => `<li class="${x.done ? 'ok' : ''}">${x.done ? ICON.check : '<i></i>'}<span>${esc(x.text)}</span></li>`).join('')}</ul>`;

  /* ---------------- screens ---------------- */
  let view = 'home';
  const screen = () => $('screen');
  function show(html) {
    const el = screen();
    el.innerHTML = html; el.hidden = false; el.scrollTop = 0;
    $('hud').hidden = true; $('howto').hidden = true;
    $('coins').textContent = fmt(S.coins);   // the header's coins
  }
  /* The header's kanji pond and settings can be opened during a flight: the flight waits behind the page
     (paused), and the page's Back (or the game's name) goes back to it, with the pause card to go on from. */
  const flying = () => !!(run && !run.over && run.started);   // before take-off nothing is lost: the pages and Back go home
  function hold() { if (flying()) { paused = true; holding = false; } }
  function backToFlight() {
    view = 'flight';
    screen().hidden = true; $('modal').hidden = true;
    $('hud').hidden = false;
    paused = false;
    if (run.started && !run.outro) pause(true); else if (!run.started) $('howto').hidden = false;
  }
  /** The unlock offer, in the Store edition while part of the game's kanji is locked. */
  const offer = (intro = '') => GC.offerHtml(intro);
  const kjList = chs => chs.map(ch => `<b lang="ja">${ch}</b> ${esc(meaning(ch))}`).join(' · ');

  /** The hub's line about the next kanji: the first ones, the ones waiting, or what brings new ones. */
  function firstLine() {
    if (!GC.inPlay().length) { const n = newcomers(); return n.length ? `Your first lanterns: ${kjList(n)}` : ''; }
    const waiting = newcomers();
    if (waiting.length) return `New before your next flight: ${kjList(waiting)}`;
    if (!GC.nextNew(1).length) {
      const c = GC.counts();
      return c.locked ? `You have met all ${c.available} free kanji of Kanji Koi.` : `Every kanji of land, water and sky is in your pond: ${c.mastered} of ${c.total} mastered.`;
    }
    const need = pool().filter(ch => level(ch) < 1);
    return need.length ? `New kanji come when every lantern reaches level 1: catch <span lang="ja" class="kj">${need.slice(0, 8).join(' ')}</span>${need.length > 8 ? ` and ${need.length - 8} more` : ''} a few more times.`
      : 'Every lantern is at level 1: new kanji come after your next flight.';
  }
  /** The Dragon Gate on the hub: the kanji mastered toward it. */
  function gateHtml() {
    const c = GC.counts(), m = Math.min(c.mastered, GATE), pct = Math.round(m / GATE * 100);
    return `<section class="panel koi-gate${S.gate ? ' done' : ''}"><span class="koi-gate-k" lang="ja" aria-hidden="true">龍</span>
      <div class="koi-gate-b"><div class="koi-gate-h"><h3>The Dragon Gate</h3><span>${S.gate ? 'Passed' : `${m} of ${GATE} mastered`}</span></div>
        <span class="meter" role="img" aria-label="${S.gate ? 100 : pct}% of the way"><i style="width:${S.gate ? 100 : pct}%"></i></span>
        <p>${S.gate ? 'Your carp can fly as a dragon: wear it in the shop.' : `Master ${GATE} kanji (all three dots in the pond) and your carp becomes a dragon.`}</p></div></section>`;
  }
  const HOWTO = `<p><b>Fly.</b> Press and hold (or Space) to rise; let go to glide.</p>
    <p><b>Catch</b> the lantern whose kanji matches the clue. A new kanji shows itself in the clue; as you learn it, the clue gives only its picture or meaning, then sometimes only its sound.</p>
    <p><b>A flight</b> runs from dawn to the great gate in the sea at nightfall. Storm clouds cost a heart. Right lanterns fill the Dragon Rush: for six seconds every right lantern comes to you.</p>
    <p><b>Zen flight</b> is the calm one: no clouds, no hearts, slower. Coins buy carp and trails in the shop, and 30 kanji mastered open the Dragon Gate.</p>`;

  function home() {
    run = null; paused = false; holding = false; view = 'home';
    document.body.classList.remove('koi-fly');
    const more = `<button class="btn" type="button" data-act="zen">Zen flight</button><button class="btn" type="button" data-act="shop">Shop</button><button class="btn" type="button" data-act="pond">Kanji pond</button><button class="btn" type="button" data-act="settings">Settings</button>`;
    show(GC.hubHtml({ pitch: 'Fly a carp streamer from dawn to nightfall, and catch the lantern that matches each clue.', play: 'Fly', more, howto: HOWTO, first: firstLine(), art: STREAMER }));
    const after = screen().querySelector('.gc-hub-cols') || screen().querySelector('.gc-hub-top');
    if (after) after.insertAdjacentHTML('afterend', gateHtml());
    setTimeout(() => { const b = $('gc-play'); if (b && view === 'home') b.focus({ preventScroll: true }); }, 30);
  }

  function fly(mode = 'main') {
    Sfx.unlock();
    const news = newcomers();
    if (news.length) return meet(news, () => fly(mode));
    if (!pool().length) return home();
    view = 'flight';
    readPalette();
    screen().hidden = true; $('modal').hidden = true;
    const res = document.querySelector('.gc-res'); if (res) res.remove();
    $('hud').hidden = false;
    $('land').hidden = mode !== 'zen';
    hudCache = {};
    newRun(mode);
    document.body.classList.add('koi-fly');
    hint('');
    const up = upcoming();
    setClue(up.tgt, up.sound);
    // before take-off: how to fly, and the flight's three stars
    const key = window.matchMedia && matchMedia('(pointer: fine)').matches ? ' (or Space)' : '';
    $('howto-t').textContent = run.first ? `Press and hold${key} to rise, let go to glide` : `Press and hold${key} to take off`;
    $('howto-goals').innerHTML = goalsOf(run).map(x => `<li>${ICON.star}<span>${esc(x.short)}</span></li>`).join('');
    $('howto').hidden = false;
  }
  function begin() {
    if (!run || run.started || run.over) return;
    run.started = true;
    $('howto').hidden = true;
    GC.round({ mode: run.mode });
    if (run.first) hint('Fly through the lantern that matches the clue');
    GC.say(GC.reading(run.waveTarget));
  }

  /** Meet new kanji: the strokes draw themselves (over the picture, when there is one). */
  function meet(list, then, { browse = false } = {}) {
    const m = $('modal'), one = list.length === 1, first = !browse && !GC.inPlay().length;
    const card = (ch, i) => `<div class="meetcard">${GC.squareHtml(ch, 'msq' + i)}
        <div class="mean">${esc(GC.clueMeaning(ch))} <span lang="ja">${ch}</span></div>
        <div class="rd"><b lang="ja">${esc(GC.reading(ch))}</b>${GC.opt.romaji ? esc(GC.romaji(GC.reading(ch))) : ''} ${GC.sayBtn(GC.reading(ch), GC.romaji(GC.reading(ch)))}</div></div>`;
    m.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-labelledby="${one ? 'gc-h' : 'meet-h'}">
      <p class="eyebrow">${browse ? 'Kanji pond' : first ? 'Meet your first kanji' : one ? 'A new kanji' : `${list.length} new kanji`}</p>
      ${one ? GC.cardHtml(list[0]) : `<h2 id="meet-h">${first ? 'Kanji of land, water and sky' : 'New lanterns for your next flight'}</h2><div class="meet">${list.map(card).join('')}</div>`}
      <p class="muted">${browse ? `Level ${level(list[0])} of 3 · caught ${(GC.rec(list[0]) || {}).ok || 0} times` : one ? 'It joins your lanterns from this flight. At first its clue shows the kanji itself.' : 'In flight, the clue shows the kanji. Fly through the lantern with the same kanji.'}</p>
      <div class="row"><button class="btn primary big" type="button" id="meet-go">${browse ? 'Back' : first ? 'Let’s fly' : 'Got it'} ${ICON.next}</button></div></div>`;
    m.hidden = false;
    const go = $('meet-go');
    go.onclick = () => { if (!browse) { for (const ch of list) GC.meet(ch); S.pending = S.pending.filter(ch => !list.includes(ch)); save(); } m.hidden = true; then && then(); };
    setTimeout(() => go.focus({ preventScroll: true }), 30);
    if (one) GC.animate($('gc-sq'), 500); else list.forEach((ch, i) => GC.animate($('msq' + i), 500 + i * 350));
    if (one) GC.say(GC.reading(list[0]));
  }

  /** Out of hearts, once a flight: one question to fly on. */
  function reviveQuiz() {
    paused = true; holding = false;
    const q = pick(run.pool), opts = shuffle([q, ...GC.distractors(q, 2, run.pool, { rand, conf: S.conf })]);
    const lv = level(q), m = $('modal'), pic = picSvg(q);
    m.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-labelledby="rv-h">
      <p class="eyebrow">Out of hearts</p><h2 id="rv-h">Keep flying: which lantern is “${esc(GC.clueMeaning(q))}”?</h2>
      ${lv < 2 ? `<div class="row">${pic ? `<div class="rvpic">${pic}</div>` : ''}<span class="muted" lang="ja">${esc(GC.reading(q))}</span>${GC.opt.romaji ? `<span class="muted">${esc(GC.romaji(GC.reading(q)))}</span>` : ''}</div>` : ''}
      <div class="choices">${opts.map((ch, i) => `<button class="lantern" type="button" data-pick="${ch}" aria-label="${i + 1}: ${ch}"><span lang="ja">${ch}</span><small aria-hidden="true">${i + 1}</small></button>`).join('')}</div>
      <div class="row between"><button class="btn quiet" type="button" id="rv-no">No thanks, land</button><span class="muted small">Keys 1–${opts.length}</span></div></div>`;
    m.hidden = false;
    m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const ok = b.dataset.pick === q;
      m.querySelectorAll('[data-pick]').forEach(x => { x.disabled = true; x.classList.add(x.dataset.pick === q ? 'right' : 'wrong'); });
      GC.record(q, ok);
      if (ok) {
        run.combo = GC.hit({ el: b }); run.bestCombo = Math.max(run.bestCombo, run.combo);
        setTimeout(() => {
          m.hidden = true; run.revived = true; run.hearts = 1; run.invT = 2.2; run.outro = null; paused = false;
          koi.y = (TOP + BOT) / 2; koi.vy = 0; toast('Saved!', 'One more heart');
        }, 650);
      } else {
        S.conf[q + '>' + b.dataset.pick] = (S.conf[q + '>' + b.dataset.pick] || 0) + 1;
        run.wrong++; run.combo = 0; run.mult = 1;
        GC.miss({ el: b });
        setTimeout(() => { m.hidden = true; paused = false; finish('hearts'); }, 1100);
      }
    });
    $('rv-no').onclick = () => { m.hidden = true; paused = false; finish('hearts'); };
    setTimeout(() => { const b = m.querySelector('[data-pick]'); if (b) b.focus({ preventScroll: true }); }, 30);
  }

  function pause(on) {
    if (run && !run.over && !run.started && on) return home();   // before take-off: back to the welcome page
    if (!run || run.over || !run.started || run.outro) return;
    paused = on; holding = false;
    const m = $('modal');
    if (!on) { m.hidden = true; return; }
    m.innerHTML = `<div class="panel pausecard" role="dialog" aria-modal="true" aria-labelledby="pz-h"><p class="eyebrow">Paused · ${run.mode === 'zen' ? 'Zen flight' : `Flight ${S.stats.flights + 1}`}</p><h2 id="pz-h">Take a breath</h2>
      ${goalList(run)}
      <div class="row"><button class="btn primary big" type="button" data-act="resume">${ICON.play}Keep flying</button><button class="btn" type="button" data-act="endflight">End flight</button></div></div>`;
    m.hidden = false;
    setTimeout(() => { const b = m.querySelector('[data-act="resume"]'); if (b) b.focus({ preventScroll: true }); }, 30);
  }

  /** What a flight leaves behind: coins, records, the missions' metres, new kanji, the Dragon Gate, and the
      news for the results (at most three lines). stars: the stars it won (coins for each). */
  function settle(r, stars) {
    const main = r.mode === 'main';
    const flown = Math.floor(Math.min(r.dist, r.L)), score = Math.round(r.score + flown);
    S.stats.runs++; if (main) S.stats.flights++; else S.stats.zen++;
    S.stats.catches += r.catches; S.stats.wrong += r.wrong; S.stats.rushes += r.rushes; S.stats.coins += r.coins; S.stats.close += r.close;
    if (main) { S.best = Math.max(S.best, score); S.bestDist = Math.max(S.bestDist, flown); }
    if (flown > r.metres) { GC.count('metres', flown - r.metres); r.metres = flown; }
    // news for the results, most important first: at most three lines (two on a phone)
    const news = [];
    let coins = r.coins + stars * (main ? 20 : 10);
    // the Dragon Gate (passed in flight, or now)
    if (!S.gate && mastered() >= GATE) { S.gate = true; if (!S.owned.includes('dragon')) S.owned.push('dragon'); r.gatePassed = true; }
    if (r.gatePassed) news.push({ k: '龍', t: 'You passed the Dragon Gate: the Dragon carp is yours', gold: true });
    // new kanji when every lantern is at level 1 or more: one, or more after a long flight
    const p = pool();
    if (!newcomers().length && p.length && p.every(ch => level(ch) >= 1)) {
      const add = GC.nextNew(clamp(Math.floor(r.catches / 15), 1, 3));
      if (add.length) {
        S.pending = add;
        news.push({ k: add.join(''), t: `New kanji: ${add.map(meaning).join(', ')}. You meet ${add.length > 1 ? 'them' : 'it'} before your next flight`, gold: true });
      }
    }
    // kanji up a level: what changes in their clues (told once for each level)
    const say = { 1: 'their clues no longer show the kanji', 2: 'their clues now give only the meaning', 3: 'mastered: sometimes their clue is only the sound' };
    for (const lv of [3, 2, 1]) {
      const up = r.pool.filter(ch => (r.levelsBefore[ch] || 0) < lv && level(ch) >= lv);
      if (up.length && !S.tips['lv' + lv]) { S.tips['lv' + lv] = 1; news.push({ k: up.slice(0, 3).join(''), t: `Level ${lv}: ${say[lv]}` }); break; }
    }
    // the first flight of the day: a bonus that grows with the days in a row
    const d0 = today(), y = new Date(); y.setDate(y.getDate() - 1);
    if (S.daily.last !== d0 && r.catches > 0) {
      S.daily.streak = S.daily.last === today(y) ? S.daily.streak + 1 : 1;
      S.daily.last = d0;
      const bonus = 30 * Math.min(5, S.daily.streak);
      coins += bonus;
      news.push({ coin: true, t: `Daily bonus: +${bonus} coins${S.daily.streak > 1 ? `, ${S.daily.streak} days in a row` : '. Fly tomorrow for more'}` });
    }
    // the next carp or trail now in reach
    const before = S.coins;
    S.coins += coins;
    const item = [...SKINS.map(x => ({ ...x, kind: 'carp' })), ...TRAILS.map(x => ({ ...x, kind: 'trail' }))].filter(x => x.price > 0 && !S.owned.includes(x.id)).sort((a, b) => a.price - b.price)[0];
    if (item && before < item.price && S.coins >= item.price) news.push({ coin: true, t: `The ${item.name} ${item.kind} is yours to buy in the shop` });
    save(); GC.saveNow();
    return { score, coins, flown, news: news.slice(0, innerWidth < 520 ? 2 : 3) };
  }
  const newsHtml = list => list.length ? `<div class="koi-news">${list.map(x => `<div class="${x.gold ? 'gold' : ''}">${x.coin ? '<span class="coinicon" aria-hidden="true"></span>' : `<b lang="ja" aria-hidden="true">${esc(x.k)}</b>`}<span>${esc(x.t)}</span></div>`).join('')}</div>` : '';

  /** The end of a flight: its stars, score and news in the games' results dialog, then Fly again or Back. */
  function finish(kind = 'ended') {
    if (!run || run.over) return;
    const r = run;
    r.over = true; r.outro = null; holding = false; paused = false;
    $('modal').hidden = true; $('hud').hidden = true; $('howto').hidden = true; hint('');
    document.body.classList.remove('koi-fly');
    if (!r.started) return home();
    view = 'results';
    if (kind === 'done') r.dist = Math.max(r.dist, r.L);
    const goals = goalsOf(r), stars = goals.filter(x => x.done).length, main = r.mode === 'main';
    const sum = settle(r, stars);
    last = { mode: r.mode, done: kind === 'done', lost: r.lost, rushes: r.rushes };
    const title = kind === 'done' ? (stars === 3 ? 'A perfect flight' : r.mode === 'zen' ? 'Nightfall' : 'Flight complete') : kind === 'hearts' ? 'Out of hearts' : 'You landed';
    GC.finish({
      title, sub: main ? `Flight ${fmt(S.stats.flights)}` : `Zen flight ${fmt(S.stats.zen)}`,
      goals: goals.map(x => ({ text: x.text, done: x.done })),
      score: sum.score, scoreText: 'points', bestKey: main ? 'score' : 'zen',
      stats: [['Coins', `+${fmt(sum.coins)}`]],   // what was caught and flown is in the goals' lines
      primary: { label: 'Fly again', run: () => fly(r.mode) },
      secondary: { label: 'Back', run: home },
      note: newsHtml(sum.news),
    });
    $('coins').textContent = fmt(S.coins);
  }
  /** Leaving the game in mid-flight: what was won is kept (the round itself is not counted). */
  function leave() { if (run && !run.over && run.started) { run.over = true; settle(run, 0); } }

  function shop() {
    view = 'shop';
    const tile = (it, kind) => {
      const own = S.owned.includes(it.id), on = (kind === 'skin' ? S.skin : S.trail) === it.id;
      const gate = it.price < 0;
      const label = on ? 'Wearing' : own ? 'Wear' : gate ? 'Pass the Dragon Gate' : `<span class="coinicon"></span>${fmt(it.price)}`;
      return `<button class="item${on ? ' on' : ''}${!own && (gate || S.coins < it.price) ? ' locked' : ''}" type="button" data-act="buy" data-kind="${kind}" data-id="${it.id}" aria-pressed="${on}">
        <canvas width="240" height="120" data-preview="${kind}:${it.id}" aria-hidden="true"></canvas><span class="nm">${esc(it.name)}</span><span class="pr">${label}</span></button>`;
    };
    show(`<div class="shop"><div class="panel">
      <div class="row between"><div><p class="eyebrow">Shop</p><h2>Carp and trails</h2></div><div class="row"><span class="pill gold"><span class="coinicon"></span>${fmt(S.coins)}</span><button class="btn quiet" type="button" data-act="home">${ICON.back} Back</button></div></div>
      <p class="muted">Catch coins in flight, and win more with every star. A carp or a trail is yours to keep.</p>
      <h3>Carp</h3><div class="items">${SKINS.map(s => tile(s, 'skin')).join('')}</div>
      <h3>Trails</h3><div class="items">${TRAILS.map(t => tile(t, 'trail')).join('')}</div>
      <p class="muted" id="shopmsg" role="status"></p></div></div>`);
    previews();
  }
  /** The carp and trails on the shop's tiles, outlined like the carp in flight (so they follow the theme). */
  function previews() {
    screen().querySelectorAll('canvas[data-preview]').forEach(c => {
      const [kind, id] = c.dataset.preview.split(':'), x = c.getContext('2d');
      x.clearRect(0, 0, 240, 120);
      if (kind === 'skin') drawKoi(x, 128, 62, 0, 0.4, skinOf(id), 26, false, 1, PC.ink);
      else {
        drawKoi(x, 170, 62, 0, 0.4, skinOf(S.skin), 20, false, 1, PC.ink);
        const col = { bubbles: rgba(PC.bubble, 0.85), petals: '#f2a9bd', ink: rgba(PC.ink, 0.6), fireflies: '#e8c227' }[id];
        for (let i = 0; i < 9; i++) { x.fillStyle = col; x.strokeStyle = col; x.beginPath(); const px = 110 - i * 11, py = 62 + Math.sin(i * 1.3) * 10, r = 3 + (i % 3); if (id === 'bubbles') { x.lineWidth = 2; x.arc(px, py, r, 0, 6.283); x.stroke(); } else { x.arc(px, py, r, 0, 6.283); x.fill(); } }
      }
    });
  }
  function buy(kind, id) {
    const list = kind === 'skin' ? SKINS : TRAILS, it = list.find(x => x.id === id);
    if (!it) return;
    const msg = t => { const e = $('shopmsg'); if (e) e.textContent = t; };
    if (!S.owned.includes(id)) {
      if (it.price < 0) return msg(`Master ${GATE} kanji to pass the Dragon Gate and fly this carp.`);
      if (S.coins < it.price) return msg(`You need ${fmt(it.price - S.coins)} more coins for ${it.name}.`);
      S.coins -= it.price; S.owned.push(id);
      GC.sfx.coin();
    } else GC.sfx.tap();
    if (kind === 'skin') S.skin = id; else S.trail = id;
    save();
    shop();
    msg(`${it.name} is on.`);
    const b = screen().querySelector(`[data-act="buy"][data-id="${id}"]`); if (b) b.focus({ preventScroll: true });
  }

  /** Every kanji of the game, by level of the app: met ones with their dots, the rest still to come. */
  function pond() {
    view = 'pond';
    const c = GC.counts();
    const tile = ch => {
      if (GC.locked(ch)) return `<div class="kc locked" aria-label="${ch}: in the full version"><span class="g" lang="ja">${ch}</span><span class="m">Full version</span></div>`;
      if (!GC.met(ch)) return `<div class="kc new" aria-label="Not met yet"><span class="g" aria-hidden="true">?</span><span class="m">Not met yet</span></div>`;
      const lv = level(ch), r = GC.rec(ch) || { ok: 0 };
      return `<button class="kc" type="button" data-act="meetone" data-ch="${ch}"><span class="g" lang="ja">${ch}</span><span class="m">${esc(meaning(ch))}</span><span class="lv" role="img" aria-label="Level ${lv} of 3">${[1, 2, 3].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span><span class="m muted">${r.ok} caught</span></button>`;
    };
    show(`<div class="pond"><div class="panel">
      <div class="row between"><div><p class="eyebrow">Kanji pond</p><h2>${c.met} of ${c.available} kanji met</h2></div><button class="btn quiet" type="button" data-act="home">${ICON.back} Back</button></div>
      <p class="muted">Each dot is a level. Level 1 hides the kanji from the clue, level 2 hides the picture, level 3 sometimes gives only the sound. Kanji you have written in your lessons come to the pond first.</p>
      ${offer()}
      ${GC.groups().map(gr => `<div class="lvhead"><h3>${esc(gr.short)}</h3><span class="muted">${gr.kanji.filter(GC.met).length} of ${gr.kanji.length} met</span></div>
        <div class="kgrid">${gr.kanji.map(tile).join('')}</div>`).join('')}
    </div></div>`);
  }

  function settings(confirm = false) {
    view = 'settings';
    const sw = (k, on, label, note) => `<div class="setting"><div class="lbl">${label}<span>${note}</span></div><button class="switch" type="button" role="switch" id="set-${k}" aria-checked="${on}" data-act="toggle" data-key="${k}" aria-label="${label}"></button></div>`;
    show(`<div class="settings"><div class="panel">
      <div class="row between"><div><p class="eyebrow">Settings</p><h2>Your flight</h2></div><button class="btn quiet" type="button" data-act="home">${ICON.back} Back</button></div>
      ${sw('sound', GC.opt.sound, 'Sound', 'Chimes that climb as your combo grows, and coin ticks. The same switch as in Learn Kanji.')}
      ${sw('voice', GC.opt.voice, 'Say each clue aloud', GC.Voice.ok ? 'A Japanese voice reads each new clue. The same switch as in Learn Kanji.' : 'No Japanese voice found on this device yet.')}
      ${sw('romaji', GC.opt.romaji, 'Show romaji', 'Readings in Latin letters (yama) beside the kana (やま), in the lessons and every game.')}
      ${GC.themeRow()}
      ${sw('shake', S.settings.shake, 'Screen shake', 'A small shake when you hit a cloud or start a Dragon Rush.')}
      <div class="setting"><div class="lbl">Start over<span>Clears your coins, carp and flights, and what you have learned of this game’s kanji. Your lessons and other games keep theirs.</span></div>
        ${confirm ? '<div class="row"><button class="btn danger" type="button" data-act="reset-yes">Clear Kanji Koi</button><button class="btn quiet" type="button" data-act="settings">Keep it</button></div>' : '<button class="btn" type="button" data-act="reset">Start over</button>'}</div>
      <p class="muted small">Progress is saved on this device with your Learn Kanji progress, and goes into its backups.</p></div></div>`);
  }

  /* ---------------- input ---------------- */
  function press(on) {
    if (!run || run.over || paused || run.outro) { holding = false; return; }
    if (on) { Sfx.unlock(); if (!run.started) begin(); }
    holding = on;
  }
  async function unlock() {
    const r = await GC.unlock();
    if (r && r.unlocked) toast('Unlocked', 'Every kanji is open');
    rerender();
  }
  function rerender() { if (view === 'home') home(); else if (view === 'pond') pond(); }
  function onAct(e) {
    if (e.target.closest('#gc-play')) { GC.sfx.tap(); return fly('main'); }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act !== 'say' && act !== 'buy') GC.sfx.tap();
    switch (act) {
      case 'fly': return fly('main');
      case 'zen': return fly('zen');
      case 'home': return flying() ? backToFlight() : home();
      case 'back': leave(); return GC.back();   // leaving mid-flight keeps what the flight won
      case 'unlock': return unlock();
      case 'shop': return shop();
      case 'pond': hold(); return pond();
      case 'settings': hold(); return settings();
      case 'buy': return buy(b.dataset.kind, b.dataset.id);
      case 'meetone': return meet([b.dataset.ch], () => {}, { browse: true });
      case 'pause': return pause(true);
      case 'resume': return pause(false);
      case 'endflight': $('modal').hidden = true; paused = false; return finish('ended');
      case 'land': return finish('landed');
      case 'toggle': {
        const k = b.dataset.key;
        if (k === 'shake') { S.settings.shake = !S.settings.shake; save(); }
        else GC.opt[k] = !GC.opt[k];
        b.setAttribute('aria-checked', String(k === 'shake' ? S.settings.shake : GC.opt[k]));
        return;
      }
      case 'reset': return settings(true);
      case 'reset-yes': { const keep = S.settings; GC.resetTheme(); S = fresh(); S.settings = keep; save(); return home(); }
    }
  }
  const RISE = new Set(['Space', 'ArrowUp', 'KeyW']);
  function bindInput() {
    cv.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } press(true); });
    const up = () => press(false);
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
    cv.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('click', onAct);
    document.addEventListener('keydown', e => {
      const inFlight = run && !run.over && $('modal').hidden && $('screen').hidden;
      if (e.repeat && RISE.has(e.code)) { if (inFlight) e.preventDefault(); return; }
      if (document.querySelector('.gc-res, .gc-jm')) return;   // the results and the journey's letters have their own keys
      if (RISE.has(e.code) && inFlight) { e.preventDefault(); press(true); return; }
      const modal = $('modal');
      // the revive question: 1, 2, 3
      const digit = /^(Digit|Numpad)([1-9])$/.exec(e.code);
      if (digit && !modal.hidden && modal.querySelector('[data-pick]')) {
        const b = modal.querySelectorAll('[data-pick]')[+digit[2] - 1];
        if (b && !b.disabled) { e.preventDefault(); b.click(); }
        return;
      }
      if ((e.code === 'Escape' || e.code === 'KeyP') && run && !run.over && run.started && !run.outro && $('screen').hidden && (modal.hidden || modal.querySelector('.pausecard'))) { e.preventDefault(); pause(!paused); return; }
      if (e.code !== 'Escape') return;
      if (run && !run.over && !run.started && $('screen').hidden && modal.hidden) { e.preventDefault(); home(); }
      else if (!modal.hidden && $('meet-go') && view === 'pond') { e.preventDefault(); $('meet-go').click(); }
      else if (flying() && !$('screen').hidden && modal.hidden) { e.preventDefault(); backToFlight(); }
      else if (!flying() && modal.hidden && ['shop', 'pond', 'settings'].includes(view)) { e.preventDefault(); home(); }
    });
    document.addEventListener('keyup', e => { if (RISE.has(e.code)) press(false); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && run && !run.over && run.started && !paused && !run.outro) pause(true); });
    window.addEventListener('blur', () => { holding = false; });
    new ResizeObserver(() => resize()).observe(cv);
    // a journey letter opened in mid-flight (its note is at the top): the flight waits behind it
    new MutationObserver(() => { if (document.querySelector('.gc-jm') && flying() && !paused && !run.outro) pause(true); }).observe(document.body, { childList: true });
    if (typeof Edition !== 'undefined') Edition.onChange(() => { if (!run || run.over) rerender(); });
  }

  /* ---------------- start ---------------- */
  function start() {
    cv = $('stage'); g = cv.getContext('2d');
    readPalette();
    S = normalize(GC.state);
    save();
    GC.setup({ missions: MISSIONS, dailies: DAILIES });
    // the pages start under the header
    const barh = () => document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px');
    barh();
    window.addEventListener('resize', barh);
    // the app's theme changed: the sky turns to day or night, and the shop's carp are outlined again
    document.addEventListener('gc-theme', () => { readPalette(); if (view === 'shop') previews(); });
    resize();
    bindInput();
    try { document.fonts.load('600 40px "Klee One"', GC.THEME.slice(0, 40).join('') + '龍門'); } catch (e) { /* fallback fonts */ }
    home();
    requestAnimationFrame(loop);
  }

  return {
    start,
    test: {
      get S() { return S; }, get run() { return run; }, get koi() { return koi; }, get paused() { return paused; }, get view() { return view; },
      auto(mode) { autopilot = mode; }, seed(n) { rand = mulberry32(n); }, speed(f) { timeScale = f; },
      begin, finish: (kind = 'ended') => finish(kind), home, pond, fly, normalize, GATE, LENGTHS, setClue, goals: () => run && goalsOf(run),
      hurt() { if (run && !run.over && !run.outro) hitCloud({ x: koiX, y: koi.y, r: R }); },
      /** Jump to just before the gate (the flight then ends as it would). */
      toEnd() { if (run && !run.over && run.started) run.dist = Math.max(run.dist, run.L - 1); },
    },
  };
})();

Koi.start();

</script>

</body>
</html>
