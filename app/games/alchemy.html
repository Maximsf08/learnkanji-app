  const write = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };
  const json = k => { try { return JSON.parse(read(k) || 'null'); } catch (e) { return null; } };

  let lifetime = read(KEY) === 'yes';
  // exact: the Store gave the end date (the Microsoft Store does; Google Play does not, so the end is an estimate
  // that only decides how long the plan stays open offline)
  let sub = (() => { const s = json(SUB); return s && IDS[s.plan] && s.plan !== 'lifetime' && +s.expires > 0 ? { plan: s.plan, expires: +s.expires, checked: +s.checked || 0, exact: s.exact !== false } : null; })();
  let offers = {};                   // plan → what the Store said about it (price, period, trial…)
  let storeAnswered = false, buying = null, buyingPlan = '', saving = null;
  if (SHOP) {   // the web edition's prices are its own, so the plans are known at once
    for (const plan of ORDER) {
      const c = shopPlan(plan);
      if (!c) continue;
      const recurring = plan !== 'lifetime';
      offers[plan] = { plan, id: c.product_id, found: true, url: c.url || '', price: c.price || '', recurrence: recurring ? c.price || '' : '',
        amount: c.amount || '', currency: c.currency || 'EUR', subscription: recurring, period: recurring ? c.period || 1 : 0, unit: recurring ? (c.unit != null ? c.unit : plan === 'year' ? 5 : 4) : -1,
        trial: !!c.trial, trialPeriod: c.trial ? c.trial.period || 1 : 0, trialUnit: c.trial ? (c.trial.unit != null ? c.trial.unit : 3) : -1, onSale: false, base: '' };
    }
    storeAnswered = true;
  }
  const checks = [];
  const listeners = new Set();
  const emit = () => listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });

  const subOn = () => !!sub && Date.now() < sub.expires + GRACE;
  const unlocked = () => lifetime || subOn();
  function setLifetime(v) { lifetime = !!v; write(KEY, lifetime ? 'yes' : null); }
  function setSub(s) { sub = s; write(SUB, s ? JSON.stringify(s) : null); }

  /** Store periods in days, for a subscription the Store did not give an end for yet. */
  const UNIT_DAYS = { 2: 1, 3: 7, 4: 31, 5: 366 };
  const periodDays = o => (o && o.period && UNIT_DAYS[o.unit] ? o.period * UNIT_DAYS[o.unit] : 0);

  function onPlans(m) {
    const now = Date.now();
    const list = Array.isArray(m.plans) ? m.plans : [];
    const next = {};
    for (const x of list) {
      const plan = planOf(x && x.id);
      if (plan) next[plan] = { ...x, plan };
    }
    if (list.some(x => x && x.found)) offers = next;
    // Only a definite answer from the Store changes what is saved; offline, the cache stands.
    if (m.available) {
      storeAnswered = true;
      const life = next.lifetime;
      setLifetime(!!life && (life.active || (life.owned && !life.subscription)));
      let best = null;
      for (const plan of ['year', 'month']) {
        const x = next[plan];
        if (!x || !x.active) continue;
        const exact = +x.expires > now;
        const expires = exact ? +x.expires : now + Math.max(7, periodDays(x)) * DAY;
        if (!best || expires > best.expires) best = { plan, expires, checked: now, exact };
      }
      setSub(best);
    }
  }
  if (host) host.addEventListener('message', e => {
    const m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'plans') {
      onPlans(m);
      checks.splice(0).forEach(r => r(m));
      emit();
    } else if (m.type === 'purchase') {
      const plan = planOf(m.id) || buyingPlan;
      if (m.unlocked) {
        if (plan === 'lifetime') setLifetime(true);
        else if (plan) setSub({ plan, expires: Date.now() + Math.max(7, periodDays(offers[plan])) * DAY, checked: Date.now(), exact: false });
      }
      const done = buying; buying = null; buyingPlan = '';
      emit();
      if (done) done({ ...m, plan });
      if (m.unlocked) check();   // the Store's own end date for a subscription
    } else if (m.type === 'saved') {
      const done = saving; saving = null;
      if (done) done(m);
    }
  });

  const ids = () => ORDER.map(p => IDS[p]).filter(Boolean);
  /** Ask the Store about the plans. Resolves with the host's answer. In the web edition: check the license key
      entered here with Gumroad (force: even if it was checked a moment ago). */
  function check(force) {
    if (SHOP) return shopCheck(force);
    if (!host || !ids().length) return Promise.resolve({ type: 'plans', available: false, plans: [] });
    return new Promise(r => { checks.push(r); if (checks.length === 1) host.postMessage('plans ' + ids().join(' ')); });
  }
  /** Show the Store purchase dialog for a plan ('year', 'month' or 'lifetime'). Resolves with {status, unlocked, plan}. */
  function buy(plan = 'lifetime') {
    if (SHOP) {   // the web edition: Gumroad's page for the plan, in a new tab; the key then comes back by hand
      const o = offers[plan];
      if (o && o.url) { try { window.open(o.url, '_blank', 'noopener'); } catch (e) { /* blocked */ } }
      return Promise.resolve({ type: 'purchase', status: o && o.url ? 'external' : 'unavailable', unlocked: false, plan });
    }
    if (!host || !IDS[plan]) return Promise.resolve({ type: 'purchase', status: 'unavailable', unlocked: false, plan });
    if (buying) return new Promise(() => {});   // a dialog is already open
    buyingPlan = plan;
    return new Promise(r => { buying = r; emit(); host.postMessage('buy ' + IDS[plan]); });
  }
  function theme(css) { if (host) host.postMessage('theme ' + css); }
  /** Google Play edition: save a file where the learner chooses (the system's save dialog).
      Resolves with {ok, cancelled}; elsewhere with {ok: false, unavailable: true}. */
  function save(name, text) {
    if (!host || !android) return Promise.resolve({ ok: false, unavailable: true });
    if (saving) saving({ ok: false, cancelled: true });   // a dialog that never answered (the app was left)
    return new Promise(r => { saving = r; host.postMessage('save ' + JSON.stringify({ name, text })); });
  }
  /** Google Play edition: hand a text to the system's share sheet. False where there is none. */
  function share(text) {
    if (!host || !android) return false;
    host.postMessage('share ' + text);
    return true;
  }

  /* ---------- the web edition: Gumroad license keys ---------- */
  const API = (SHOP && SHOP.api) || 'https://api.gumroad.com/v2/licenses/verify';
  const DEVICES = (SHOP && +SHOP.devices) || 10;
  const license = () => { const l = json(LIC); return l && l.key && IDS[l.plan] && IDS[l.plan] === l.product ? l : null; };
  const saveLicense = l => write(LIC, l ? JSON.stringify(l) : null);
  /** Ask Gumroad about a key for one product: {ok, purchase, uses} | {ok: false, message} | {offline: true}. */
  async function verify(product, key, count) {
    const body = new URLSearchParams({ product_id: product, license_key: key, increment_uses_count: count ? 'true' : 'false' });
    let r, j = null;
    try { r = await fetch(API, { method: 'POST', body }); } catch (e) { return { offline: true }; }
    try { j = await r.json(); } catch (e) { j = null; }
    if (r.ok && j && j.success) return { ok: true, purchase: j.purchase || {}, uses: +j.uses || 0 };
    if (r.status === 404 || (j && j.success === false)) return { ok: false, message: (j && j.message) || '' };
    return { offline: true };   // Gumroad is down or busy: try another time
  }
  /** What a purchase allows: {valid, ends (ms, 0 for none), why}. Gumroad's subscription_*_at fields hold the
      end of a membership (they go back to null when it renews or restarts). */
  function allows(plan, p) {
    if (p.refunded || p.chargebacked || (p.disputed && !p.dispute_won)) return { valid: false, why: 'refunded' };
    if (plan === 'lifetime') return { valid: true, ends: 0 };
    const ends = [p.subscription_ended_at, p.subscription_cancelled_at, p.subscription_failed_at]
      .map(t => (t ? Date.parse(t) : NaN)).filter(n => !isNaN(n));
    const end = ends.length ? Math.min(...ends) : 0;
    if (end && end <= Date.now()) return { valid: false, why: 'ended' };
    return { valid: true, ends: end };
  }
  function grant(plan, ends) {
    if (plan === 'lifetime') setLifetime(true);
    else setSub({ plan, expires: ends || Date.now() + Math.max(7, periodDays(offers[plan])) * DAY, checked: Date.now(), exact: !!ends });
  }
  function revoke(plan) {
    if (plan === 'lifetime') setLifetime(false);
    else if (sub && sub.plan === plan) setSub(null);
  }
  /** Enter a license key from a Gumroad receipt. Resolves with {ok, plan} or {ok: false, reason}:
      'format', 'unknown' (no product knows it), 'refunded', 'ended', 'devices' (on too many devices), 'offline'. */
  async function activate(raw) {
    if (!SHOP) return { ok: false, reason: 'unavailable' };
    const key = String(raw || '').trim().replace(/\s+/g, '').toUpperCase();
    if (!/^[A-Z0-9]{4,}(-[A-Z0-9]{4,})*$/.test(key) || key.replace(/-/g, '').length < 16) return { ok: false, reason: 'format' };
    let offline = false;
    for (const plan of ORDER) {
      if (!IDS[plan]) continue;
      const v = await verify(IDS[plan], key, true);
      if (v.offline) { offline = true; continue; }
      if (!v.ok) continue;
      if (v.uses > DEVICES) return { ok: false, reason: 'devices', plan };
      const a = allows(plan, v.purchase);
      if (!a.valid) return { ok: false, reason: a.why, plan };
      saveLicense({ key, plan, product: IDS[plan], checked: Date.now(), ends: a.ends || 0 });
      grant(plan, a.ends);
      emit();
      return { ok: true, plan };
    }
    return { ok: false, reason: offline ? 'offline' : 'unknown' };
  }
  /** Check the key entered here again (at most twice a day unless forced). */
  async function shopCheck(force) {
    const lic = license();
    const answer = available => ({ type: 'plans', available, plans: [] });
    if (!lic || typeof GAME !== 'undefined') return answer(!!lic);   // the games use what the app saved
    if (!force && Date.now() - (lic.checked || 0) < DAY / 2) return answer(true);
    const v = await verify(lic.product, lic.key, false);
    if (v.offline) return answer(false);
    const a = v.ok ? allows(lic.plan, v.purchase) : { valid: false, why: 'unknown' };
    if (!a.valid) { revoke(lic.plan); saveLicense(null); emit(); return { ...answer(true), ended: a.why }; }
    saveLicense({ ...lic, checked: Date.now(), ends: a.ends || 0 });
    grant(lic.plan, a.ends);
    emit();
    return answer(true);
  }
  /** Take the key off this browser (the purchase itself stays on Gumroad). */
  function forget() {
    const lic = license();
    if (lic) revoke(lic.plan);
    saveLicense(null);
    emit();
  }

  /* ---------- what is free ---------- */
  // Basic 1, the first level, is free.
  let freeSet = null, freeK = 0;
  function free() {
    if (!freeSet) {
      freeSet = new Set();
      const first = KDATA.books[0].id;
      for (const l of KDATA.lessons) if (l.b === first) { freeSet.add(l.n); freeK += [...l.kanji].length; }
    }
    return freeSet;
  }
  // Before 1.4 the first half of every level was free: lessons started then stay open.
  let oldHalf = null;
  function oldFree() {
    if (!oldHalf) {
      oldHalf = new Set();
      for (const b of KDATA.books) {
        const ls = KDATA.lessons.filter(l => l.b === b.id);
        for (const l of ls.slice(0, Math.ceil(ls.length / 2))) oldHalf.add(l.n);
      }
    }
    return oldHalf;
  }
  /** The lessons of the old free half that progress (written in lessons, or met in a game) has reached. */
  function startedIn(cards, gameKanji) {
    const out = new Set();
    for (const k of [...Object.keys(cards || {}), ...Object.keys(gameKanji || {})]) {
      const r = KDATA.kanji[k];
      if (r && oldFree().has(r.l) && !free().has(r.l)) out.add(r.l);
    }
    return out;
  }
  /** Web edition: the lessons (beyond Basic 1) that the earlier, complete web version had been used in. */
  function startedAny(cards, gameKanji) {
    const out = new Set();
    for (const k of [...Object.keys(cards || {}), ...Object.keys(gameKanji || {})]) {
      const r = KDATA.kanji[k];
      if (r && !free().has(r.l)) out.add(r.l);
    }
    return out;
  }
  const keepable = n => (SHOP ? n >= 1 && n <= KDATA.lessons.length && !free().has(n) : oldFree().has(n));
  let keptSet = null;
  function kept() {
    if (keptSet) return keptSet;
    const saved = json(KEPT);
    if (Array.isArray(saved)) keptSet = new Set(saved.map(Number).filter(keepable));
    else {
      // The first start of this version: the lessons already started are kept, once and for all.
      const app = json('kakitori:v1') || {}, games = json('kakitori:games:v1') || {};
      keptSet = native ? startedIn(app.cards, games.k) : SHOP ? startedAny(app.cards, games.k) : new Set();
      write(KEPT, JSON.stringify([...keptSet].sort((a, b) => a - b)));
    }
    return keptSet;
  }
  /** A backup made on another device brings the lessons it kept (or, from before 1.4, the ones it had started). */
  function importKept(list, cards, gameKanji) {
    const add = Array.isArray(list) ? list.map(Number).filter(keepable) : [...(SHOP ? startedAny : startedIn)(cards, gameKanji)];
    const k = kept();
    let changed = false;
    for (const n of add) if (!k.has(n)) { k.add(n); changed = true; }
    if (changed) { write(KEPT, JSON.stringify([...k].sort((a, b) => a - b))); emit(); }
  }

  let earned = new Set();
  /** The journey tells which lessons were earned. */
  function setEarned(list) {
    const sig = [...earned].join(',');
    earned = new Set((list || []).map(Number));
    if (sig !== [...earned].join(',')) emit();
  }
  /** This edition sells Learn Kanji Full (a Store edition, or the web edition with its shop). */
  const paid = native || !!SHOP;
  const locks = () => paid && !unlocked();
  const open = n => free().has(n) || earned.has(n) || kept().has(n);
  /** Is unit n (1-based, across all levels) locked? */
  const unitLocked = n => locks() && !open(+n);
  /** Is kanji k in a locked unit? */
  const kanjiLocked = k => locks() && !!KDATA.kanji[k] && !open(KDATA.kanji[k].l);

  /** The plan the learner has: 'lifetime', 'year', 'month' or ''. */
  const plan = () => (lifetime ? 'lifetime' : subOn() ? sub.plan : '');
  /** What the Store offers, in the order shown: [{plan, price, recurrence, period, unit, trial, …}]. */
  const offerList = () => ORDER.filter(p => IDS[p] && offers[p] && offers[p].found).map(p => offers[p]);

  return {
    native, platform, android, paid, shop: !!SHOP, check, buy, theme, save, share, activate, forget, setEarned, importKept, unitLocked, kanjiLocked,
    IDS, MANAGE, STORE,
    /** Web edition: the key entered on this browser, shortened for display ('' for none), and its plan. */
    get licenseHint() { const l = license(); return l ? `${l.key.slice(0, 4)}…${l.key.slice(-4)}` : ''; },
    get licensePlan() { const l = license(); return l ? l.plan : ''; },
    DEVICES,
    get locks() { return locks(); },
    get unlocked() { return unlocked(); },
    get plan() { return plan(); },
    /** When the subscription ends or renews (ms), as the Store last said; 0 for none, for the lifetime plan, or
        when the Store gave no date (Google Play). */
    get expires() { return !lifetime && subOn() && sub.exact ? sub.expires : 0; },
    get offers() { return offerList(); },
    offer: p => (offers[p] && offers[p].found ? offers[p] : null),
    isEarned: n => earned.has(+n),
    isKept: n => kept().has(+n),
    isFree: n => free().has(+n),
    keptList: () => [...kept()],
    get price() { const o = offers.lifetime; return (o && o.found && o.price) || ''; },
    get buying() { return !!buying; },
    get buyingPlan() { return buyingPlan; },
    get storeAnswered() { return storeAnswered; },
    get freeKanji() { free(); return freeK; },
    get freeLessons() { return free().size; },
    get freeBook() { return KDATA.books[0]; },
    onChange(f) { listeners.add(f); return () => listeners.delete(f); },
  };
})();

/* Kanji Valley art, in a woodblock-print style: flat colour blocks with keyblock outlines.
   Picture cards are drawn in the KanjiVG box (0..109) around each kanji's own strokes, so the
   picture turns into the kanji. The valley scene is 1000 x 760; each kanji prints one item. */
'use strict';
const Art = (() => {
  const f = n => +(+n).toFixed(1);
  const nums = d => (d.match(/-?\d+\.?\d*/g) || []).map(Number);
  const ends = d => { const n = nums(d); return [[n[0], n[1]], [n[n.length - 2], n[n.length - 1]]]; };
  const S = ch => (KDATA.kanji[ch] || { s: [] }).s;
  const tail = d => d.replace(/^M[^A-Za-z]*/, '');

  /* ---- primitives ---- */
  const k = (d, cls = '') => `<path class="k ${cls}" d="${d}" pathLength="1"/>`;
  const fp = (d, cls, style = '') => `<path class="c ${cls}" d="${d}"${style ? ` style="${style}"` : ''}/>`;
  const ci = (x, y, r, cls) => `<circle class="c ${cls}" cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
  const kc = (x, y, r, cls = '') => k(`M${f(x - r)},${f(y)}a${f(r)},${f(r)} 0 1 0 ${f(2 * r)},0a${f(r)},${f(r)} 0 1 0 ${f(-2 * r)},0`, cls);
  /** A thick coloured stroke with a keyblock outline under it. */
  const fat = (d, w, cls) => `<path class="c ol" d="${d}" style="stroke-width:${f(w + 1.5)}"/><path class="c ${cls}" d="${d}" style="stroke-width:${f(w)}"/>`;
  /** Blobs drawn as one outlined shape: outline layer first, fills on top. */

    '林': { m: L('grove, woods'), kana: 'はやし', ro: 'hayashi', parts: ['木', '木'], split: [4], mn: L('Two trees make a grove.'), ask: L('Plant a grove.'), made: 'a grove' },

  const CHAPTERS = [

/* Kana helpers shared by the app and the games: romaji for any kana reading, so that nothing in
   Learn Kanji needs hiragana or katakana to be read. Hepburn, with long vowels written as they are
   spelled (がっこう → gakkou, ー as a macron: ゲーム → gēmu); "." (okurigana) is dropped, "-" kept. */
'use strict';
const Kana = (() => {
  const hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const ROMA = {
    あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o', か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko', さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
    た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to', な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no', は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
    ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo', や: 'ya', ゆ: 'yu', よ: 'yo', ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro', わ: 'wa', ゐ: 'i', ゑ: 'e', を: 'o', ん: 'n',
    が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go', ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo', だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
    ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ゔ: 'vu',
    ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゎ: 'wa', ゕ: 'ka', ゖ: 'ke',
  };
  const YOON = { ゃ: 'a', ゅ: 'u', ょ: 'o' };
  // Small vowels after a kana make the sounds of loanwords: ティ ti, ファ fa, ウィ wi, ジェ je …
  const SMALL = { ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o' };
  const MACRON = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };
  /** Romaji for a kana string. Characters that are not kana (kanji, Latin, punctuation) are kept. */
  function romaji(s) {
    const t = hira(s).replace(/\./g, '');
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const c = t[i], nx = t[i + 1];
      if (c === 'っ') { const r = ROMA[nx] || ''; out += r && /[a-z]/.test(r[0]) && !/[aiueon]/.test(r[0]) ? (r.startsWith('ch') ? 't' : r[0]) : ''; continue; }
      if (c === 'ー') { const v = out.slice(-1); out = out.slice(0, -1) + (MACRON[v] || v); continue; }
      if (c === 'ん') { out += 'n' + (nx && /[あいうえおやゆよ]/.test(nx) ? "'" : ''); continue; }
      if (c === '・') { out += ' '; continue; }
      let r = ROMA[c];
      if (r === undefined) { out += c; continue; }
      if (nx && YOON[nx] && r.length > 1) {
        const base = r.slice(0, -1);
        r = (base === 'sh' || base === 'ch' || base === 'j') ? base + YOON[nx] : base + 'y' + YOON[nx];
        i++;
      } else if (nx && SMALL[nx] && /[てでうふしちじ]/.test(c)) {
        const base = { て: 't', で: 'd', う: 'w', ふ: 'f', し: 'sh', ち: 'ch', じ: 'j' }[c];
        r = base + SMALL[nx];
        i++;
      }
      out += r;
    }
    return out.replace(/\s+/g, ' ').trim();
  }
  const hasKana = s => /[ぁ-ゖァ-ヺー]/.test(String(s));
  return { romaji, hira, hasKana };
})();

/* The learner's goal: what the games, the journey and the home screen focus on, so nobody is given
   kanji their course or exam does not ask for. Kept in the app's settings (localStorage 'kakitori:v1',
   settings.goal) and read by the games too:
     {kind:'auto'}                      the level you are studying (the default; see currentLevel)
     {kind:'course', level:'B1', upTo}  one level of the app (a course that follows the books);
                                        upTo: the last lesson (unit number) the class has reached
     {kind:'jlpt', level:4}             a JLPT level and every level below it (N4 = N5 + N4)
     {kind:'all'}                       every kanji in the app
   JLPT levels: KDATA kanji field j (5 = N5 … 1 = N1), from Jonathan Waller's lists (tools/make_jlpt.py). */
'use strict';
const Goal = (() => {
  const APP = 'kakitori:v1';
  const K = () => KDATA.kanji;
  const books = () => KDATA.books;
  const lessonOf = n => KDATA.lessons[n - 1];
  const bookIndex = id => books().findIndex(b => b.id === id);
  const appState = () => {
    if (typeof Store !== 'undefined' && Store.state) return Store.state;
    try { return JSON.parse(localStorage.getItem(APP) || 'null') || {}; } catch (e) { return {}; }
  };
  const JLPT = [5, 4, 3, 2, 1];
  const jname = n => 'N' + n;

  function normalize(g) {
    if (!g || typeof g !== 'object') return { kind: 'auto' };
    if (g.kind === 'course' && bookIndex(g.level) >= 0) {
      const o = { kind: 'course', level: g.level };
      const l = +g.upTo && lessonOf(+g.upTo);
      if (l && l.b === g.level) o.upTo = +g.upTo;
      return o;
    }
    if (g.kind === 'jlpt' && JLPT.includes(+g.level)) return { kind: 'jlpt', level: +g.level };
    if (g.kind === 'all') return { kind: 'all' };
    return { kind: 'auto' };
  }
  /** The goal as stored (normalized). */
  const stored = () => normalize((appState().settings || {}).goal);

  /** The level you are studying: the level of the kanji you learned last, or the next level with kanji
      still to learn once that one is done (opening a lesson to look at it changes nothing). */
  function currentLevel() {
    const s = appState(), cards = s.cards || {}, order = books().map(b => b.id);
    let lastK = null, lastT = -1;
    for (const [k, c] of Object.entries(cards)) if (K()[k] && c && (+c.added || 0) > lastT) { lastT = +c.added || 0; lastK = k; }
    const open = k => typeof Edition === 'undefined' || !Edition.kanjiLocked(k);
    const hasNew = id => KDATA.lessons.some(l => l.b === id && [...l.kanji].some(k => !cards[k] && open(k)));
    const start = lastK ? Math.max(0, order.indexOf(lessonOf(K()[lastK].l).b)) : 0;
    for (let i = 0; i < order.length; i++) { const id = order[(start + i) % order.length]; if (hasNew(id)) return id; }
    return order[start];
  }

  /** The goal, resolved: {kind, level, upTo, auto, id, label, short, test(k), keep(k)}.
      test: is kanji k part of the goal. keep: may a kanji already met stay in play (the goal, or an
      easier level). */
  let memo = null;   // a game page reads the goal once (the app re-reads it: the level you are on moves)
  function resolve(g) {
    const plain = g === undefined, cache = plain && typeof Store === 'undefined';
    if (cache && memo) return memo;
    g = normalize(plain ? stored() : g);
    const auto = g.kind === 'auto';
    if (auto) g = { kind: 'course', level: currentLevel() };
    let test, keep, dist, label, short, id;
    if (g.kind === 'course') {
      const b = books()[bookIndex(g.level)], bi = bookIndex(g.level);
      const up = g.upTo ? lessonOf(g.upTo) : null;
      test = k => { const r = K()[k]; if (!r) return false; const l = lessonOf(r.l); return l.b === g.level && (!g.upTo || r.l <= g.upTo); };
      keep = k => { const r = K()[k]; return !!r && bookIndex(lessonOf(r.l).b) <= bi; };
      // how far a kanji is from the goal: easier levels first, then the next harder ones
      dist = k => { const r = K()[k]; if (!r || test(k)) return 0; const d = bookIndex(lessonOf(r.l).b) - bi; return d <= 0 ? -d * 0.5 + (d === 0 ? 0.25 : 0) : d; };
      short = b.short;
      const upName = up ? `${up.k === 'L' ? L('Lesson') : up.k === 'R' ? L('Review') : L('Column')} ${up.ln}` : '';
      label = up ? L`${b.short}, up to ${upName}` : b.short;
      id = `course:${g.level}${g.upTo ? ':' + g.upTo : ''}`;
    } else if (g.kind === 'jlpt') {
      test = k => { const r = K()[k]; return !!r && (r.j || 1) >= g.level; };
      keep = test;
      dist = k => { const r = K()[k]; return !r ? 9 : Math.max(0, g.level - (r.j || 1)); };
      short = label = L`JLPT ${jname(g.level)}`;
      id = `jlpt:${g.level}`;
    } else {
      test = k => !!K()[k];
      keep = test;
      dist = () => 0;
      short = L('All levels'); label = L('All levels');
      id = 'all';
    }
    const out = { ...g, auto, id: auto ? 'auto:' + id : id, label, short, test, keep, dist };
    if (cache) memo = out;
    return out;
  }

  /** The goal's kanji, in the order of the lessons. */
  function syllabus(g) {
    const r = resolve(g);
    const out = [];
    for (const l of KDATA.lessons) for (const k of l.kanji) if (r.test(k)) out.push(k);
    return out;
  }
  /** How many kanji a goal has (for the goal picker). */
  const size = g => syllabus(g).length;
  /** Kanji at each JLPT level (not cumulative). */
  function jlptCounts() {
    const c = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
    for (const r of Object.values(K())) c[r.j || 1]++;
    return c;
  }
  return { stored, resolve, syllabus, size, normalize, currentLevel, jlptCounts, JLPT, jname, get: () => resolve(), forget: () => { memo = null; } };
})();

/* The journey: the seven games as one trip through old Japan, and the rewards that keep a learner going.
   Shared by the app and the game pages; kept in localStorage 'kakitori:journey:v1'.

   Route: the river (Koi) → the inn kitchen → the Tōkaidō (Road) → the temple school → the castle town
   → the apothecary (Alchemy) → the teahouse (Tiles), then round again. A stop asks for STEPS level-ups
   of that game's kanji of your goal (a kanji going from level 0 to 1, 1 to 2 or 2 to 3); a game with
   nothing left to raise is passed by. Finishing a stop writes a stamp in the journal and sends you on to the next place.

   Rewards (the free version of the Store edition: each one is a locked lesson, opened for good):
     - the weekly goal: finish one stop between Monday and Sunday
     - every 7 days in a row of practice (lessons, reviews or games)
     - friends: your invite code gives a friend a lesson; their thank-you code gives you one
   With everything unlocked, the same moments earn stamps instead. No reward ever depends on a rating
   or a review. Earned lessons are kept apart from the Store's licences, and survive Reset progress.
   (Before 1.4 five friends opened every lesson; with paid plans, each friend is one lesson.) */
'use strict';
const Journey = (() => {
  const KEY = 'kakitori:journey:v1', GKEY = 'kakitori:games:v1', AKEY = 'kakitori:v1';
  const ROUTE = ['koi', 'kitchen', 'road', 'school', 'castle', 'alchemy', 'tiles'];
  const STEPS = 6, STREAK = 7;
  const PLACES = {
    koi: { title: L('The river'), jp: '川辺', gift: 'a paper carp streamer', from: L('the river'),
      arrive: L('Dawn on the river. A boatman is raising the carp streamers: “The lanterns over the water carry kanji of land, water and sky. Fly with the koi and catch the right ones.”') },
    kitchen: { title: L('The inn kitchen'), jp: '宿の台所', gift: 'a lunch box', from: L('the inn'),
      arrive: L('Downriver, the cook of a small inn waves you into her kitchen: “My regulars order by the kanji on the menu. Can you find the right jar?”') },
    road: { title: L('The Tōkaidō'), jp: '東海道', gift: L('a pair of straw sandals'), from: L('the Tōkaidō'),
      arrive: L('With the inn’s lunch box in your bag you set off along the Tōkaidō, the old road to Kyoto. Every station on it has kanji of places and travel, of moving, carrying and making.') },
    school: { title: L('The temple school'), jp: '寺子屋', gift: L('a karuta card signed by Sensei'), from: L('the temple school'),
      arrive: L('At the end of the road stands a temple school. Sensei is holding a karuta tournament, and needs a player who knows the kanji of study, words and the arts.') },
    castle: { title: L('The castle town'), jp: '城下町', gift: L('a lord’s banner'), from: L('the castle town'),
      arrive: L('One of Sensei’s old pupils serves the lord of the castle town. Rival lords are claiming the old provinces, under banners of society and law, money and work.') },
    alchemy: { title: L('The apothecary'), jp: '薬屋', gift: L('a paper packet of medicine'), from: L('the apothecary'),
      arrive: L('After the battles, the town’s apothecary has more slips than hands. Each medicine is a kanji of the body or of science, made by merging its parts on the counter.') },
    tiles: { title: L('The teahouse'), jp: '茶屋', gift: L('a cup of green tea'), from: L('the teahouse'),
      arrive: L('Home again. The teahouse keeper sets out tiles: “Sort what you have learned, each kanji with its meaning and its reading, while the tea is warm.”') },
  };
  const LAP_LINES = ['', L('A new season on the road. '), L('The road is familiar now, and so are the kanji. '), L('Another lap of the road: time to master what you know. ')];

  /* ---------------- storage ---------------- */
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
  const fresh = () => ({ v: 1, name: '', id: '', lap: 1, at: 0, stop: null, log: [], weeks: {}, earned: [], friends: [],
    invitedBy: '', thanks: '', all: false, days: {}, streaks: [], badges: {} });
  function normalize(s) {
    const o = fresh();
    if (!s || typeof s !== 'object') return o;
    for (const f of ['name', 'id', 'invitedBy', 'thanks']) if (typeof s[f] === 'string') o[f] = s[f].slice(0, 40);
    for (const f of ['lap', 'at']) if (Number.isFinite(+s[f])) o[f] = Math.max(f === 'lap' ? 1 : 0, Math.floor(+s[f]));
    o.at %= ROUTE.length;
    if (s.stop && typeof s.stop === 'object' && ROUTE.includes(s.stop.g)) o.stop = s.stop;
    if (Array.isArray(s.log)) o.log = s.log.filter(x => x && ROUTE.includes(x.g)).slice(-400);
    if (s.weeks && typeof s.weeks === 'object') o.weeks = s.weeks;
    if (Array.isArray(s.earned)) o.earned = s.earned.filter(x => x && Number.isFinite(+x.n)).map(x => ({ n: +x.n, why: String(x.why || ''), t: +x.t || 0 }));
    if (Array.isArray(s.friends)) o.friends = [...new Set(s.friends.filter(x => typeof x === 'string'))];
    o.all = !!s.all;
    if (s.days && typeof s.days === 'object') o.days = s.days;
    if (Array.isArray(s.streaks)) o.streaks = s.streaks.filter(x => typeof x === 'string');
    if (s.badges && typeof s.badges === 'object') o.badges = s.badges;
    return o;
  }
  let S = normalize(read(KEY));
  const listeners = new Set();
  function save() {
    write(KEY, S);
    syncEdition();
    listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  /** Read the store again (another page may have changed it). */
  function reload() { S = normalize(read(KEY)); syncEdition(); }
  function syncEdition() {
    if (typeof Edition !== 'undefined' && Edition.setEarned) Edition.setEarned(S.earned.map(x => x.n));
  }

  /* ---------------- days, weeks and the streak ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const today = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  function weekId(t = Date.now()) {   // ISO 8601 week, Monday to Sunday, local time
    const d = new Date(t); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));        // the Thursday of this week
    const w1 = new Date(d.getFullYear(), 0, 4);
    const w = 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
    return `${d.getFullYear()}-W${pad(w)}`;
  }
  /** Days with practice: lessons and reviews (the app) or answers in a game. */
  let appSrc = null;
  /** A game page passes the app's state it has read already (reading it again each answer is slow). */
  const useApp = f => { appSrc = typeof f === 'function' ? f : null; };
  function streak(t = Date.now()) {
    const app = appSrc ? appSrc() || {} : typeof Store !== 'undefined' ? Store.state : (read(AKEY) || {});
    const days = app.days || {};
    const active = day => { const d = days[day]; return !!((d && (d.learned || d.reviews)) || S.days[day]); };
    let n = 0;
    for (let i = 0; i < 4000; i++) {
      if (active(today(t - i * 864e5))) n++;
      else if (i === 0) continue;   // today not started yet: count from yesterday
      else break;
    }
    return n;
  }
  /** A game answer today (the games call this). */
  function logPlay() {
    const d = today(), first = !S.days[d];
    S.days[d] = (S.days[d] || 0) + 1;
    const keys = Object.keys(S.days);
    if (keys.length > 400) for (const k of keys.sort().slice(0, keys.length - 400)) delete S.days[k];
    save();
    return first ? tick() : [];   // the streak only changes with the first practice of a day
  }

  /* ---------------- rewards ---------------- */
  const hasEdition = () => typeof Edition !== 'undefined';
  /** Can a reward still open a lesson? (Store edition, not everything unlocked.) */
  const lessonsToEarn = () => hasEdition() && Edition.locks && KDATA.lessons.some(l => Edition.unitLocked(l.n));
  /** The next locked lesson, by the goal: lessons with kanji of the goal first, in the goal's order. */
  function nextLocked() {
    if (!lessonsToEarn()) return null;
    const goal = typeof Goal !== 'undefined' ? Goal.resolve() : null;
    const ls = KDATA.lessons.filter(l => Edition.unitLocked(l.n));
    if (goal) {
      const withGoal = ls.find(l => [...l.kanji].some(k => goal.test(k)));
      if (withGoal) return withGoal.n;
      const lv = ls.find(l => l.b === (goal.level || ''));
      if (lv) return lv.n;
    }
    return ls[0].n;
  }
  /** Give a reward: a locked lesson if there is one, else a stamp. Returns {lesson} or {stamp}. */
  function grant(why) {
    const n = nextLocked();

    if (S.day >= 3 && !S.slips.some(s => s && s.kind === 'w') && rand() < 0.25) { const w = wordSlip(); if (w) return w; }
    const pool = GC.inPlay().filter(k => !asked.has(k));

  function fillSlots() {

    const t = S.today;
    S.pending = S.pending.filter(k => !GC.met(k) && !GC.locked(k));
    let came = false;
    for (let i = 0; i < S.slips.length; i++) {
      if (S.slips[i]) continue;
      const noPool = !GC.inPlay().length;
      if (S.pending.length && !S.slips.some(s => s && s.kind === 'new') && (t.since >= GAP || noPool) && t.n < t.slips) {
        S.slips[i] = newSlipFor(S.pending[0]); t.since = 0; came = true; continue;
      }
      if (t.issued >= t.slips) continue;
      const o = nextOrder();
      if (!o) continue;
      S.slips[i] = o; t.issued++; came = true;
    }
    save();
    if (came) {
      renderSlips(true);
      for (const s of S.slips) if (s && !s.said && s.kind === 'k' && s.clue === 'sound') { s.said = true; GC.say(GC.reading(s.k)); }
      coachNow();

  /* ---------------- deliveries ---------------- */
  /** Hand the tile on square from to the customer at place slot. */
  async function deliver(from, slot, g = null) {

    if (!c || !s || s.done) { await back(from, g); return 'none'; }
    if (s.kind === 'new') {
      await back(from, g);
      say(REC.has(s.k) ? L('The master is showing you a new recipe: make it on the counter.') : L('The master has a new jar for you: tap the jar shelf.'));
      return 'none';

    const wantWord = s.kind === 'w';
    if (wantWord !== isWord(c) || (!wantWord && !isRemedy(c))) {   // not an answer: the wrong kind of tile

  async function wrong(from, slot, g) {

  /** A served customer leaves; the next one comes after a moment. The day closes with its last order. */

  /** Help on a slip: it shows the kanji (or word), then the kanji's two parts. It counts as not knowing it. */

  /* ---------------- discoveries ---------------- */
  /** A new kanji is made (or comes off the shelf): met, in the book, and the master's slip is done. */
  function discover(k, at, parts = null) {
    const t = S.today;
    GC.meet(k);
    S.pending = S.pending.filter(x => x !== k);
    if (t && !t.learned.includes(k)) t.learned.push(k);

    if (t) t.coins += FOUND_COINS.k;
    S.coins += FOUND_COINS.k; coinLag += FOUND_COINS.k;
    const slot = S.slips.findIndex(s => s && s.kind === 'new' && s.k === k);
    if (slot >= 0) S.slips[slot].done = true;
    save();
    renderCell(at);
    renderHud();
    bumpBook();
    Sfx.found();
    GC.burst(cellEl(at) || $('board'), L('New discovery!'), { big: true });
    later(countCoins, 500);
    if (slot >= 0) renderSlip(slot, 'learned');
    busyUntil = performance.now() + (still() ? 0 : 650);

  let busyUntil = 0;

    if (t) t.coins += FOUND_COINS.w;

  /* ---------------- the sun: from opening to sunset ---------------- */
  let lastTick = 0, savedAt = 0, frozen = false, bannerUntil = 0;

  /* ---------------- days: one day is one round ---------------- */
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.75 5.75 6.3.8-4.62 4.35 1.18 6.25L12 16.9l-5.61 3.05 1.18-6.25L2.95 9.35l6.3-.8z"/></svg>';

    $('counter').appendChild(el);

  function firstNew(n) {

  /* ---------------- sound: the shop's own (the chest, the jars, merges, a stamp); right and wrong are the games' ---------------- */
  const Sfx = (() => {
    let ac = null, out = null;
    function ctx() {
      if (!GC.opt.sound) return null;
      try {
        if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = 0.6; out.connect(ac.destination); }
        if (ac.state === 'suspended') ac.resume();
        return ac;
      } catch (e) { return null; }
    }
    function tone(f, dur, { type = 'sine', vol = 0.06, at = 0, slide = 0 } = {}) {
      const a = ctx(); if (!a) return;
      try {
        const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.03);
      } catch (e) { /* ignore */ }
    }
    function noise(dur, { f = 1200, q = 1, vol = 0.3, at = 0, type = 'bandpass', decay = 2 } = {}) {
      const a = ctx(); if (!a) return;
      try {
        const n = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
        const src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
        src.buffer = buf; flt.type = type; flt.frequency.value = f; flt.Q.value = q; g.gain.value = vol;
        src.connect(flt).connect(g).connect(out); src.start(a.currentTime + at);
      } catch (e) { /* ignore */ }
    }
    const P = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
    return {
      unlock() { ctx(); },
      pick() { noise(0.06, { f: 1500, q: 2.2, vol: 0.32 }); tone(320, 0.07, { type: 'triangle', vol: 0.04 }); },
      jar() { tone(1568, 0.09, { vol: 0.03 }); tone(2093, 0.14, { vol: 0.016, at: 0.03 }); noise(0.05, { f: 3200, q: 3, vol: 0.1 }); },
      land() { tone(740, 0.06, { type: 'triangle', vol: 0.03 }); noise(0.035, { f: 900, q: 1.5, vol: 0.1 }); },
      merge() { tone(P[2], 0.16, { type: 'triangle', vol: 0.05 }); tone(P[4] * 1.122, 0.24, { type: 'triangle', vol: 0.05, at: 0.07 }); tone(P[7] * 1.5, 0.2, { vol: 0.012, at: 0.1 }); },
      found() { [0, 2, 4, 5, 7].forEach((k, i) => { tone(P[k], 0.55, { vol: 0.055, at: i * 0.085 }); tone(P[k] * 2, 0.3, { vol: 0.012, at: i * 0.085 }); }); },
      bounce() { tone(220, 0.12, { type: 'triangle', vol: 0.045, slide: 0.8 }); noise(0.05, { f: 400, q: 1, vol: 0.08, type: 'lowpass' }); },
      served() { [4, 7].forEach((k, i) => tone(P[k], 0.4, { vol: 0.04, at: i * 0.1 })); },
      stamp() { noise(0.08, { f: 260, q: 0.8, vol: 0.32, type: 'lowpass', decay: 3 }); tone(150, 0.1, { type: 'triangle', vol: 0.035 }); },
      grind() { for (let i = 0; i < 5; i++) noise(0.12, { f: 560 + i * 70, q: 1.1, vol: 0.16, at: i * 0.09, decay: 1 }); },
      putback() { noise(0.2, { f: 700, q: 0.8, vol: 0.12, type: 'lowpass', decay: 1.5 }); tone(440, 0.12, { vol: 0.02, slide: 0.6 }); },
      dusk() { tone(392, 1.3, { vol: 0.035 }); tone(523.25, 1.2, { vol: 0.022, at: 0.2 }); },
      soft() { tone(660, 0.06, { vol: 0.03 }); },
      buy() { [0, 4, 7].forEach((k, i) => tone(P[k] * 2, 0.3, { vol: 0.025, at: 0.05 + i * 0.07 })); },
    };
  })();

      const from = sel >= 0 ? sel : S.board[cur] ? cur : -1;
      if (from >= 0) { e.preventDefault(); putBack(from); }
      return;
    }
    if (k.toLowerCase() === 'm' && S.shop.mortar) {
      const from = sel >= 0 ? sel : S.board[cur] ? cur : -1;
      if (from >= 0) { e.preventDefault(); setSel(-1); grind(from); }
      return;
    }
    const gk = { c: 'chest', j: 'shelf', w: 'words' }[k.toLowerCase()];
    if (gk && tag !== 'INPUT') { e.preventDefault(); tapGen(gk); }
  }

  function start() {
    S = normalize(GC.state);
    save();
    GC.setup({ missions: MISSIONS, dailies: DAILIES });
    buildBoard();
    const b = $('board');
    b.addEventListener('pointerdown', onPointerDown);
    b.addEventListener('pointermove', onPointerMove);
    b.addEventListener('pointerup', onPointerUp);
    b.addEventListener('pointercancel', onPointerCancel);
    b.addEventListener('lostpointercapture', e => { if (drag && drag.pid === e.pointerId && drag.moved) onPointerCancel(e); });
    b.addEventListener('focus', () => { if (cur >= S.open) setCursor(0); });
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    const barh = () => document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px');
    barh();
    window.addEventListener('resize', barh);
    if (window.ResizeObserver) new ResizeObserver(() => { layout(); if (coachKey) coachNow(); }).observe($('boardwrap'));
    else window.addEventListener('resize', layout);
    if (typeof Edition !== 'undefined') Edition.onChange(() => { if (view === 'book') book(); else if (view === 'hub') hub(); renderAll(); });
    try { document.fonts.load('400 36px "Klee One"', [...ING].join('') + GC.THEME.slice(0, 40).join('')); } catch (e) { /* fallback fonts */ }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { save(); GC.saveNow(); } });
    lastTick = performance.now();
    setInterval(tick, 250);
    layout();
    renderAll();
    hub();
  }

  /* ---------------- for the tests ---------------- */
  /** Put c on a free square (or square i), as if a generator gave it. */
  function place(c, i = -1) {
    const at = i >= 0 ? i : free()[0];
    if (at == null || at < 0 || at >= S.open) return -1;
    S.board[at] = c; save(); renderCell(at);
    return at;
  }
  /** Make what slip slot asks for on the counter (from parts put on it), and hand it over. */
  async function solve(slot) {
    const s = S.slips[slot];
    if (!s || s.done) return null;
    const make = async c => {
      const have = S.board.indexOf(c);
      if (have >= 0 && have < S.open) return have;
      if (GC.inTheme(c) && REC.has(c) && allowed(c)) {
        const [a, b] = REC.get(c);
        const ia = await make(a);
        const ib = await make(b);
        await drop(ib, ia);
        while (!$('modal').hidden) { const go = $('m-go'); if (go) go.click(); await wait(5); }
        return S.board.indexOf(c);
      }
      if (s.kind === 'new' && c === s.k) { await tapGen('shelf'); while (!$('modal').hidden) { const go = $('m-go'); if (go) go.click(); await wait(5); } return S.board.indexOf(c); }
      return place(c);
    };
    if (s.kind === 'w') {
      const [a, b] = [...s.w];
      if (S.board.indexOf(s.w) < 0) { const ia = await make(a); const ib = await make(b); await drop(ib, ia); while (!$('modal').hidden) { const go = $('m-go'); if (go) go.click(); await wait(5); } }
      return deliver(S.board.indexOf(s.w), slot);
    }
    const i = await make(s.k);
    if (s.kind === 'new') return 'found';
    return deliver(i, slot);
  }
  return {
    start,
    test: {
      get S() { return S; }, get sel() { return sel; }, get view() { return view; }, get geo() { return { ...geo }; },
      REC, PAIR, ALT, USES, ING, WORDS, NAME, ingName, makes, wordOf, mergeOf, allowed, safe, wants, chestPick, shelfPick, wordPick, looks, kindOf, isRemedy,
      clueFor, clueWord, maxHelp, wordChoices, normalize, newcomers, ordersFor, slotsFor, budgetFor, coinsFor, SHOP, LANES, CELLS, BASE,
      place, drop, deliver, putBack, undo, grind, hint, tapGen, tapCell, tapSlip, solve, fillSlots, closeDay, nextDay, begin, play, hub, book, shop: shopPage, buy, layout,
      seed(f) { rand = f; }, timescale(n) { TS = n; },
      clock(sec) { if (S.today) { S.today.used = sec; renderClock(); } }, freeze(on) { frozen = !!on; },
      clear() { for (let i = 0; i < CELLS; i++) S.board[i] = null; save(); renderBoard(); },
      set(state) { S = normalize(state); sel = -1; hold.clear(); closeModal(); closeScreens(); save(); layout(); if (S.phase === 'open') resumeDay(); else renderAll(); },
    },
  };
})();

Alchemy.start();

</script>
