/* Kanji Valley art, in a woodblock-print style: flat colour blocks with keyblock outlines.
   Picture cards are drawn in the KanjiVG box (0..109) around each kanji's own strokes, so the
   picture turns into the kanji. The valley scene is 1000 x 760; each kanji prints one item. */
'use strict';
const Art = (() => {
  const f = n => +(+n).toFixed(1);
  const nums = d => (d.match(/-?\d+\.?\d*/g) || []).map(Number);
  const ends = d => { const n = nums(d); return [[n[0], n[1]], [n[n.length - 2], n[n.length - 1]]]; };
  const S = ch => (KDATA.kanji[ch] || { s: [] }).s;
  const tail = d => d.replace(/^M[^A-Za-z]*/, '');

  /* ---- primitives ---- */
  const k = (d, cls = '') => `<path class="k ${cls}" d="${d}" pathLength="1"/>`;
  const fp = (d, cls, style = '') => `<path class="c ${cls}" d="${d}"${style ? ` style="${style}"` : ''}/>`;
  const ci = (x, y, r, cls) => `<circle class="c ${cls}" cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
  const kc = (x, y, r, cls = '') => k(`M${f(x - r)},${f(y)}a${f(r)},${f(r)} 0 1 0 ${f(2 * r)},0a${f(r)},${f(r)} 0 1 0 ${f(-2 * r)},0`, cls);
  /** A thick coloured stroke with a keyblock outline under it. */
  const fat = (d, w, cls) => `<path class="c ol" d="${d}" style="stroke-width:${f(w + 1.5)}"/><path class="c ${cls}" d="${d}" style="stroke-width:${f(w)}"/>`;
  /** Blobs drawn as one outlined shape: outline layer first, fills on top. */
  const blobs = (list, cls, pad = 1.1) =>
    list.map(([x, y, r]) => ci(x, y, r + pad, 'f-key')).join('') + list.map(([x, y, r]) => ci(x, y, r, cls)).join('');
  const quad = p => `M${p.map(q => q.map(f).join(',')).join('L')}Z`;

  function crescent(cx1, cy1, r1, cx2, cy2, r2) {
    const dx = cx2 - cx1, dy = cy2 - cy1, d = Math.hypot(dx, dy);
    const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
    const px = cx1 + a * dx / d, py = cy1 + a * dy / d;
    const p1 = [px + h * dy / d, py - h * dx / d], p2 = [px - h * dy / d, py + h * dx / d];
    return `M${f(p1[0])},${f(p1[1])}A${r1},${r1} 0 1 0 ${f(p2[0])},${f(p2[1])}A${r2},${r2} 0 0 1 ${f(p1[0])},${f(p1[1])}Z`;
  }

  /* ================= picture cards (109 box) ================= */

  /** A tree whose branches are a 木's strokes: [branch, trunk, sweep left, sweep right]. */
  function treePic(st, s = 1) {
    const [br, tr, sl, sr] = st;
    const top = ends(tr)[0], [b0, b1] = ends(br), l1 = ends(sl)[1], r1 = ends(sr)[1];
    const crown = [[top[0], top[1] + 5 * s, 10 * s], [top[0] - 9 * s, top[1] + 13 * s, 7.5 * s], [top[0] + 9 * s, top[1] + 13 * s, 7.5 * s]];
    const leaves = [[b0[0], b0[1], 6.5 * s], [b1[0], b1[1], 6.5 * s], [l1[0], l1[1], 6.5 * s], [r1[0], r1[1], 6 * s]];
    return fat(tr, 5.2 * s, 's-wood') + fat(br, 3.4 * s, 's-wood') + fat(sl, 3 * s, 's-wood') + fat(sr, 3 * s, 's-wood') +
      blobs(crown.concat(leaves), 'f-leaf', 0.9) +
      crown.concat(leaves).map(([x, y, r]) => ci(x - r * 0.3, y - r * 0.32, r * 0.42, 'f-leaf-hi')).join('');
  }

  function rays(cx, cy, r0, r1, n, rot = 0) {
    let out = '';
    for (let i = 0; i < n; i++) {
      const a = rot + i / n * Math.PI * 2;
      out += `<path class="c s-ray" d="M${f(cx + Math.cos(a) * r0)},${f(cy + Math.sin(a) * r0)}L${f(cx + Math.cos(a) * r1)},${f(cy + Math.sin(a) * r1)}"/>`;
    }
    return out;
  }

  const stars = pts => pts.map(([x, y, r]) => ci(x, y, r, 'f-star')).join('');

  const C = {};
  C['一'] = () => {
    const [a, b] = ends(S('一')[0]);
    const m = (b[1] - a[1]) / (b[0] - a[0]);
    const yl = a[1] + (2 - a[0]) * m, yr = a[1] + (107 - a[0]) * m;
    return fp(`M2,2H107V${f(yr)}L2,${f(yl)}Z`, '', 'fill:url(#g-sky)') +
      fp(`M2,${f(yl)}L107,${f(yr)}V107H2Z`, '', 'fill:url(#g-meadow)') +
      `<path class="c s-bird" d="M28,26q4,-4.5 8,0q4,-4.5 8,0"/><path class="c s-bird" d="M62,17q3,-3.5 6,0q3,-3.5 6,0"/>` +
      k(`M2,${f(yl)}L107,${f(yr)}`);
  };
  C['山'] = () => {
    const m = 'M2,88L21,50C25,55 31,62 37,66C42,52 49,27 54,12C59,27 65,48 72,62C77,56 83,50 89,45C94,58 100,74 107,88';
    return fp(m + 'Z', '', 'fill:url(#g-mtn)') +
      fp('M54,12C56.6,17.5 58.8,22.5 60.8,27.5C58.8,26.3 57.3,28.8 55.3,27.3C53.8,29.3 52.3,27.4 50.6,28.4C49.3,26.6 48.2,27.3 47.3,27C49.4,21.9 51.5,17.2 54,12Z', 'f-snow') +
      fp('M2,88L107,86V107H2Z', '', 'fill:url(#g-meadow)') +
      k(m) + k('M54,12C52.5,30 50.5,48 47,66', 'thin') + k('M21,50C22,60 23,70 22,80', 'thin') + k('M89,45C88,56 86.5,66 84,78', 'thin') +
      k('M2,88L107,86');
  };
  C['川'] = () => {
    const ext = [[[27.5, -3], [8, 112]], [[54.6, -3], [55, 112]], [[85.4, -3], [87.3, 112]]];
    const st = S('川').map((d, i) => { const s = ends(d)[0]; return `M${ext[i][0][0]},${ext[i][0][1]}L${s[0]},${s[1]}${tail(d)}L${ext[i][1][0]},${ext[i][1][1]}`; });
    return fp('M2,2H107V107H2Z', '', 'fill:url(#g-meadow)') +
      `<path class="c s-grass" d="M38,40l2,-5l2,5M41,62l2,-5l2,5M68,30l2,-5l2,5M70,78l2,-5l2,5M38,92l2,-5l2,5"/>` +
      st.map(d => fat(d, 10, 's-river')).join('') + st.map(d => `<path class="c s-river-hi" d="${d}"/>`).join('') +
      `<path class="c s-foam" d="M24,46q3,-2.5 6,0M52,40q3,-2.5 6,0M84,58q3,-2.5 6,0M22,72q3,-2.5 6,0M52,88q3,-2.5 6,0M84,30q3,-2.5 6,0"/>`;
  };
  C['日'] = () =>
    fp('M2,2H107V107H2Z', '', 'fill:url(#g-sky)') + rays(56, 56, 39, 48, 16) +
    `<circle class="c" cx="56" cy="56" r="34" style="fill:url(#g-sun)"/>` + kc(56, 56, 34);
  C['月'] = () => {
    const d = crescent(48, 56, 44, 68, 48, 38);
    return fp('M2,2H107V107H2Z', 'f-night') + stars([[90, 18, 1.3], [98, 44, 1], [14, 14, 1.1], [94, 76, 1.2], [80, 100, 0.9], [24, 102, 1]]) +
      fp(d, 'f-moon') + k(d);
  };
  C['木'] = () => fp('M2,96C30,93 76,93 107,96V107H2Z', 'f-grass') + treePic(S('木'));
  C['田'] = () => {
    const ridge = 'M13,22L95,19L92,91L18,92Z';
    const plots = [
      [[23.5, 32], [51.4, 30.4], [51.7, 50.3], [25.6, 52.4]],
      [[57.6, 30.2], [84.6, 28.6], [83.2, 50], [57.9, 50.1]],
      [[26, 57.2], [51.8, 55.6], [52, 77.6], [27.9, 79.6]],
      [[57.9, 55.4], [82.8, 54.2], [81.6, 76.8], [58.1, 77.6]],
    ];
    let seeds = '';
    for (const p of plots) {
      for (let r = 1; r <= 3; r++) for (let c = 1; c <= 4; c++) {
        const u = c / 5, v = r / 4;
        const x = (p[0][0] * (1 - u) + p[1][0] * u) * (1 - v) + (p[3][0] * (1 - u) + p[2][0] * u) * v;
        const y = (p[0][1] * (1 - u) + p[1][1] * u) * (1 - v) + (p[3][1] * (1 - u) + p[2][1] * u) * v;
        seeds += `M${f(x)},${f(y + 1.6)}l0,-3.2M${f(x - 1)},${f(y - 0.6)}l1,-1.2l1,1.2`;
      }
    }
    return fp('M2,2H107V107H2Z', 'f-grass') + fp(ridge, 'f-ridge') + plots.map(p => fp(quad(p), 'f-field')).join('') +
      plots.map(p => `<path class="c s-shine" d="M${f(p[0][0] + 4)},${f(p[0][1] + 5)}L${f(p[1][0] - 9)},${f(p[1][1] + 3)}"/>`).join('') +
      `<path class="c s-seed" d="${seeds}"/>` + k(ridge) + plots.map(p => k(quad(p), 'thin')).join('');
  };
  C['人'] = () => {
    const [l, r] = S('人');
    const [, le] = ends(l), [, re] = ends(r);
    return fp('M2,94C30,90 80,90 107,93V107H2Z', 'f-path') +
      fat(l, 7, 's-cloth') + fat(r, 7, 's-cloth-dk') +
      ci(le[0] - 1, le[1] + 1.5, 3.2, 'f-key') + ci(re[0] + 1, re[1] + 0.5, 3.2, 'f-key') +
      ci(55.5, 15.6, 4.8, 'f-skin') + kc(55.5, 15.6, 4.8) +
      fp('M43,15.5L55.5,4.5L68,15.5Z', 'f-hat') + k('M43,15.5L55.5,4.5L68,15.5Z') +
      `<path class="c ol" d="M62,22L74,74" style="stroke-width:2.6"/><path class="c s-staff" d="M62,22L74,74"/>`;
  };
  C['口'] = () => {
    const lips = 'M20,35C20,29.5 25,26 31,26H78C84,26 89.5,29.5 89.5,35V74C89.5,80 84.5,84 78,84H31C25,84 20,80 20,74Z';
    const inner = 'M28,40C28,36.5 30.5,34.5 34,34.5H75.5C79,34.5 81.5,36.5 81.5,40V69.5C81.5,73.5 79,76 75.5,76H34C30.5,76 28,73.5 28,69.5Z';
    return ci(55, 55, 50, 'f-blush') + fp(lips, 'f-lips') + fp(inner, 'f-mouth') +
      fp('M31,35H78.5V43.5C66,46 43,46 31,43.5Z', 'f-teeth') +
      `<ellipse class="c f-tongue" cx="55" cy="69" rx="17" ry="6.5"/>` +
      k(lips) + k(inner, 'thin') + k('M43,35V45M55,35V46M67,35V45', 'thin');
  };
  C['火'] = () => {
    const st = S('火');
    const outer = 'M53,7C57,28 76,44 88,62C97,78 92,94 76,96H32C16,94 12,80 20,66C30,49 50,32 53,7Z';
    const inner = 'M54,44C57,58 70,66 72,79C74,90 66,95 54,95C42,95 35,90 37,79C39,66 51,58 54,44Z';
    return fp('M14,98L92,90L94,97L16,105Z', 'f-wood') + fp('M14,90L92,99L90,106L12,97Z', 'f-wood-dk') +
      k('M14,98L92,90L94,97L16,105Z', 'thin') + k('M14,90L92,99L90,106L12,97Z', 'thin') +
      fp(outer, '', 'fill:url(#g-fire)') + fp(inner, 'f-fire-b') + k(outer) +
      fat(st[0], 4.2, 's-fire') + fat(st[1], 4.2, 's-fire');
  };
  C['水'] = () => {
    const st = S('水');
    const s0 = ends(st[0])[0];
    const stream = `M52.8,-3L${s0[0]},${s0[1]}${tail(st[0])}`;
    return `<ellipse class="c f-river-lt" cx="54" cy="96" rx="46" ry="9"/>` + k('M8,96a46,9 0 1 0 92,0a46,9 0 1 0 -92,0', 'thin') +
      fat(stream, 8, 's-river') + `<path class="c s-river-hi" d="${stream}"/>` +
      fat(st[1], 5.5, 's-river-lt') + fat(st[2], 5, 's-river-lt') + fat(st[3], 5.5, 's-river-lt') +
      [[12, 83, 2.4], [97, 84, 2.2], [89, 19, 2], [30, 33, 1.8], [70, 29, 1.6], [8, 60, 1.6]].map(([x, y, r]) => ci(x, y, r + 0.7, 'f-key') + ci(x, y, r, 'f-river-lt')).join('');
  };
  C['土'] = () => {
    const st = S('土');
    const soil = 'M2,86C20,84 40,86.5 54,86C70,85.5 90,83.5 107,85V107H2Z';
    return fp(soil, 'f-soil') + `<path class="c s-furrow" d="M8,95q12,-3 24,0M40,97q12,-3 24,0M72,95q12,-3 24,0M20,103q12,-3 24,0M58,103q12,-3 24,0"/>` +
      fat(st[1], 3.6, 's-stem') +
      fp('M54,50C46,40 34,40 25,50C34,57.5 46,57.5 54,50Z', 'f-leaf') + fp('M54,49C62,39 74,39 82,47C74,54 63,55.5 54,49Z', 'f-leaf') +
      fp('M54,21C49.5,14.5 45.5,12.5 42,12.5C44,18 49,20.5 54,21Z', 'f-leaf') + fp('M54,21C58.5,14.5 62.5,12.5 66,12.5C64,18 59,20.5 54,21Z', 'f-leaf') +
      k('M54,50C46,40 34,40 25,50C34,57.5 46,57.5 54,50Z', 'thin') + k('M54,49C62,39 74,39 82,47C74,54 63,55.5 54,49Z', 'thin') +
      k(soil.replace(/V107H2Z$/, ''));
  };
  C['林'] = () => { const s = S('林'); return fp('M2,97C30,94 76,94 107,97V107H2Z', 'f-grass') + treePic(s.slice(0, 4), 0.72) + treePic(s.slice(4, 8), 0.72); };
  C['森'] = () => { const s = S('森'); return fp('M2,99C30,96 76,96 107,99V107H2Z', 'f-grass') + treePic(s.slice(0, 4), 0.6) + treePic(s.slice(4, 8), 0.6) + treePic(s.slice(8, 12), 0.6); };
  C['休'] = () => {
    const s = S('休');
    return fp('M2,96C30,93 76,93 107,96V107H2Z', 'f-grass') + treePic(s.slice(2, 6), 0.78) +
      fat(s[1], 6.5, 's-cloth') + fat(s[0], 5, 's-cloth') + ci(38.5, 11.5, 5, 'f-skin') + kc(38.5, 11.5, 5) +
      `<text class="zz" x="46" y="9">z</text><text class="zz sm" x="51" y="4.5">z</text>`;
  };
  C['明'] = () => {
    const moon = crescent(66, 55, 31, 79, 47, 27);
    return fp('M2,2H54V107H2Z', '', 'fill:url(#g-sky)') + fp('M54,2H107V107H54Z', 'f-night') +
      stars([[96, 16, 1.1], [100, 70, 1], [60, 100, 1.1], [92, 98, 0.9]]) +
      rays(30, 47, 19, 25, 12) + `<circle class="c" cx="30" cy="47" r="15.5" style="fill:url(#g-sun)"/>` + kc(30, 47, 15.5) +
      fp(moon, 'f-moon') + k(moon);
  };
  C['門'] = () => {
    const ld = 'M19,15L44,13L43,93L19,93Z', rd = 'M63,13L91,10L91,95L63,95Z';
    return fp('M2,2H107V107H2Z', '', 'fill:url(#g-sky)') + fp('M2,94H107V107H2Z', 'f-path') + fp('M44,94L62,94L70,107L36,107Z', 'f-path-dk') +
      fp('M13,6H21V97H13Z', 'f-wood-dk') + fp('M89,4H97V97H89Z', 'f-wood-dk') + k('M13,6H21V97H13Z', 'thin') + k('M89,4H97V97H89Z', 'thin') +
      fp(ld, 'f-wood') + fp(rd, 'f-wood') + fp('M22,22L41,20.5V41L22,42Z', 'f-shoji') + fp('M66,19.5L88,17V38L66,39.5Z', 'f-shoji') +
      k('M22,22L41,20.5V41L22,42Z', 'thin') + k('M66,19.5L88,17V38L66,39.5Z', 'thin') + k('M31.5,21V41.5M76.5,18.5V39', 'thin') +
      k(ld) + k(rd) + ci(39.5, 66, 1.6, 'f-key') + ci(66.5, 66, 1.6, 'f-key');
  };
  C['車'] = () => {
    const st = S('車');
    const box = 'M27,36L82,33.5L78.5,62.5L32,65.5Z';
    let spokes = '';
    for (const w of [st[0], st[5]]) {
      const [a, b] = ends(w);
      for (let i = 1; i < 9; i++) { const u = i / 9; spokes += `M${f(a[0] + (b[0] - a[0]) * u)},${f(a[1] + (b[1] - a[1]) * u - 2.6)}l0,5.2`; }
    }
    return fp('M2,2H107V107H2Z', 'f-path') + `<path class="c s-rut" d="M2,30C30,28 80,27 107,26M2,80C30,78 80,77 107,76"/>` +
      fat(st[6], 3.4, 's-wood-dk') + fp(box, 'f-wood') + `<path class="c s-plank" d="M30,43L81,41M31,57L79,55"/>` +
      `<ellipse class="c f-sack" cx="44" cy="49" rx="8.5" ry="6.5"/><ellipse class="c f-sack" cx="64" cy="48" rx="7.5" ry="6"/>` +
      k(box) + k('M35.5,49a8.5,6.5 0 1 0 17,0a8.5,6.5 0 1 0 -17,0', 'thin') + k('M56.5,48a7.5,6 0 1 0 15,0a7.5,6 0 1 0 -15,0', 'thin') +
      fat(st[0], 7, 's-wheel') + fat(st[5], 7, 's-wheel') + `<path class="c s-spoke" d="${spokes}"/>`;
  };
  C['金'] = () => {
    const st = S('金');
    return fp('M2,2H107V107H2Z', '', 'fill:url(#g-sky)') + fp('M52,10L10,61L98,56Z', 'f-rock') + fp('M16,57L92,53L92,97L16,97Z', 'f-soil') +
      `<path class="c s-furrow" d="M22,74q10,-3 20,0M60,70q10,-3 20,0M40,88q10,-3 20,0"/>` +
      fat(st[0], 4, 's-wood') + fat(st[1], 4, 's-wood') + fat(st[2], 2.8, 's-wood-dk') + fat(st[3], 2.8, 's-wood-dk') + fat(st[4], 2.8, 's-wood-dk') +
      fp('M30,76L37,74L42,80L40,87L33,88L29,82Z', 'f-gold') + fp('M66,74L73,72L76,79L72,86L65,86L62,80Z', 'f-gold') +
      k('M30,76L37,74L42,80L40,87L33,88L29,82Z', 'thin') + k('M66,74L73,72L76,79L72,86L65,86L62,80Z', 'thin') +
      `<path class="c s-glint" d="M35,72l0,-5M32.5,69.5l5,0M71,70l0,-5M68.5,67.5l5,0"/>` + k(st[7]);
  };
  C['子'] = () => {
    const st = S('子');
    return fp('M2,2H107V107H2Z', 'f-blush') +
      fat(st[1], 12, 's-cloth-gr') + fat(st[2], 6, 's-cloth-gr') +
      ci(12.5, 51.5, 3.6, 'f-skin') + kc(12.5, 51.5, 3.6) + ci(96, 45.8, 3.6, 'f-skin') + kc(96, 45.8, 3.6) +
      ci(53, 24, 11, 'f-skin') + kc(53, 24, 11) + fp('M45,16C48,11 56,10 60,14C56,13 50,14 45,16Z', 'f-hair') +
      k('M47,25q2,2 4,0M55,25q2,2 4,0', 'thin') + ci(46, 29, 1.8, 'f-cheek') + ci(60, 29, 1.8, 'f-cheek');
  };
  C['女'] = () => {
    const st = S('女');
    const robe = 'M53,19L70,40C74,60 80,80 84,93L26,93C30,80 33,70 36,62Z';
    return fp('M2,2H107V107H2Z', 'f-blush') + fp(robe, 'f-cloth-red') + fp('M33,58L76,55L77.5,62L31,65Z', 'f-obi') +
      `<path class="c s-dots" d="M44,40h0M60,42h0M50,74h0M66,80h0M40,84h0M58,88h0M72,70h0"/>` + k(robe) +
      fat(st[2], 7, 's-cloth-red-dk') + ci(55, 48.5, 3, 'f-skin') +
      ci(55, 12, 6.5, 'f-skin') + kc(55, 12, 6.5) + fp('M48.5,11C49,4 61,3 61.5,10C58,8 52,8 48.5,11Z', 'f-hair') + ci(61, 4.5, 3.6, 'f-hair');
  };
  C['好'] = () => {
    const st = S('好');
    const robe = 'M30,15L41,36C42,56 44,74 45,85L16,90C19,80 21,70 22,62Z';
    return fp('M2,2H107V107H2Z', 'f-blush') +
      fp('M50,14C47,8 40,10 42,15C43,18 50,22 50,22C50,22 57,18 58,15C60,10 53,8 50,14Z', 'f-heart') +
      fp(robe, 'f-cloth-red') + k(robe) + fat(st[2], 5, 's-cloth-red-dk') +

/* Kana helpers shared by the app and the games: romaji for any kana reading, so that nothing in
   Learn Kanji needs hiragana or katakana to be read. Hepburn, with long vowels written as they are
   spelled (がっこう → gakkou, ー as a macron: ゲーム → gēmu); "." (okurigana) is dropped, "-" kept. */
'use strict';
const Kana = (() => {
  const hira = s => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  const ROMA = {
    あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o', か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko', さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
    た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to', な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no', は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
    ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo', や: 'ya', ゆ: 'yu', よ: 'yo', ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro', わ: 'wa', ゐ: 'i', ゑ: 'e', を: 'o', ん: 'n',
    が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go', ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo', だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
    ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo', ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po', ゔ: 'vu',
    ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゎ: 'wa', ゕ: 'ka', ゖ: 'ke',
  };
  const YOON = { ゃ: 'a', ゅ: 'u', ょ: 'o' };
  // Small vowels after a kana make the sounds of loanwords: ティ ti, ファ fa, ウィ wi, ジェ je …
  const SMALL = { ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o' };
  const MACRON = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };
  /** Romaji for a kana string. Characters that are not kana (kanji, Latin, punctuation) are kept. */
  function romaji(s) {
    const t = hira(s).replace(/\./g, '');
    let out = '';
    for (let i = 0; i < t.length; i++) {
      const c = t[i], nx = t[i + 1];
      if (c === 'っ') { const r = ROMA[nx] || ''; out += r && /[a-z]/.test(r[0]) && !/[aiueon]/.test(r[0]) ? (r.startsWith('ch') ? 't' : r[0]) : ''; continue; }
      if (c === 'ー') { const v = out.slice(-1); out = out.slice(0, -1) + (MACRON[v] || v); continue; }
      if (c === 'ん') { out += 'n' + (nx && /[あいうえおやゆよ]/.test(nx) ? "'" : ''); continue; }
      if (c === '・') { out += ' '; continue; }
      let r = ROMA[c];
      if (r === undefined) { out += c; continue; }
      if (nx && YOON[nx] && r.length > 1) {
        const base = r.slice(0, -1);
        r = (base === 'sh' || base === 'ch' || base === 'j') ? base + YOON[nx] : base + 'y' + YOON[nx];
        i++;
      } else if (nx && SMALL[nx] && /[てでうふしちじ]/.test(c)) {
        const base = { て: 't', で: 'd', う: 'w', ふ: 'f', し: 'sh', ち: 'ch', じ: 'j' }[c];
        r = base + SMALL[nx];
        i++;
      }
      out += r;
    }
    return out.replace(/\s+/g, ' ').trim();
  }
  const hasKana = s => /[ぁ-ゖァ-ヺー]/.test(String(s));
  return { romaji, hira, hasKana };
})();

/* The learner's goal: what the games, the journey and the home screen focus on, so nobody is given
   kanji their course or exam does not ask for. Kept in the app's settings (localStorage 'kakitori:v1',
   settings.goal) and read by the games too:
     {kind:'auto'}                      the level you are studying (the default; see currentLevel)
     {kind:'course', level:'B1', upTo}  one level of the app (a course that follows the books);
                                        upTo: the last lesson (unit number) the class has reached
     {kind:'jlpt', level:4}             a JLPT level and every level below it (N4 = N5 + N4)
     {kind:'all'}                       every kanji in the app
   JLPT levels: KDATA kanji field j (5 = N5 … 1 = N1), from Jonathan Waller's lists (tools/make_jlpt.py). */
'use strict';
const Goal = (() => {
  const APP = 'kakitori:v1';
  const K = () => KDATA.kanji;
  const books = () => KDATA.books;
  const lessonOf = n => KDATA.lessons[n - 1];
  const bookIndex = id => books().findIndex(b => b.id === id);
  const appState = () => {
    if (typeof Store !== 'undefined' && Store.state) return Store.state;
    try { return JSON.parse(localStorage.getItem(APP) || 'null') || {}; } catch (e) { return {}; }
  };
  const JLPT = [5, 4, 3, 2, 1];
  const jname = n => 'N' + n;

  function normalize(g) {
    if (!g || typeof g !== 'object') return { kind: 'auto' };
    if (g.kind === 'course' && bookIndex(g.level) >= 0) {
      const o = { kind: 'course', level: g.level };
      const l = +g.upTo && lessonOf(+g.upTo);
      if (l && l.b === g.level) o.upTo = +g.upTo;
      return o;
    }
    if (g.kind === 'jlpt' && JLPT.includes(+g.level)) return { kind: 'jlpt', level: +g.level };
    if (g.kind === 'all') return { kind: 'all' };
    return { kind: 'auto' };
  }
  /** The goal as stored (normalized). */
  const stored = () => normalize((appState().settings || {}).goal);

  /** The level you are studying: the level of the kanji you learned last, or the next level with kanji
      still to learn once that one is done (opening a lesson to look at it changes nothing). */
  function currentLevel() {
    const s = appState(), cards = s.cards || {}, order = books().map(b => b.id);
    let lastK = null, lastT = -1;
    for (const [k, c] of Object.entries(cards)) if (K()[k] && c && (+c.added || 0) > lastT) { lastT = +c.added || 0; lastK = k; }
    const open = k => typeof Edition === 'undefined' || !Edition.kanjiLocked(k);
    const hasNew = id => KDATA.lessons.some(l => l.b === id && [...l.kanji].some(k => !cards[k] && open(k)));
    const start = lastK ? Math.max(0, order.indexOf(lessonOf(K()[lastK].l).b)) : 0;
    for (let i = 0; i < order.length; i++) { const id = order[(start + i) % order.length]; if (hasNew(id)) return id; }
    return order[start];
  }

  /** The goal, resolved: {kind, level, upTo, auto, id, label, short, test(k), keep(k)}.
      test: is kanji k part of the goal. keep: may a kanji already met stay in play (the goal, or an
      easier level). */
  let memo = null;   // a game page reads the goal once (the app re-reads it: the level you are on moves)
  function resolve(g) {
    const plain = g === undefined, cache = plain && typeof Store === 'undefined';
    if (cache && memo) return memo;
    g = normalize(plain ? stored() : g);
    const auto = g.kind === 'auto';
    if (auto) g = { kind: 'course', level: currentLevel() };
    let test, keep, dist, label, short, id;
    if (g.kind === 'course') {
      const b = books()[bookIndex(g.level)], bi = bookIndex(g.level);
      const up = g.upTo ? lessonOf(g.upTo) : null;
      test = k => { const r = K()[k]; if (!r) return false; const l = lessonOf(r.l); return l.b === g.level && (!g.upTo || r.l <= g.upTo); };
      keep = k => { const r = K()[k]; return !!r && bookIndex(lessonOf(r.l).b) <= bi; };
      // how far a kanji is from the goal: easier levels first, then the next harder ones
      dist = k => { const r = K()[k]; if (!r || test(k)) return 0; const d = bookIndex(lessonOf(r.l).b) - bi; return d <= 0 ? -d * 0.5 + (d === 0 ? 0.25 : 0) : d; };
      short = b.short;
      const upName = up ? `${up.k === 'L' ? 'Lesson' : up.k === 'R' ? 'Review' : 'Column'} ${up.ln}` : '';
      label = up ? `${b.short}, up to ${upName}` : b.short;
      id = `course:${g.level}${g.upTo ? ':' + g.upTo : ''}`;
    } else if (g.kind === 'jlpt') {
      test = k => { const r = K()[k]; return !!r && (r.j || 1) >= g.level; };
      keep = test;
      dist = k => { const r = K()[k]; return !r ? 9 : Math.max(0, g.level - (r.j || 1)); };
      short = label = `JLPT ${jname(g.level)}`;
      id = `jlpt:${g.level}`;
    } else {
      test = k => !!K()[k];
      keep = test;
      dist = () => 0;
      short = 'All levels'; label = 'All levels';
      id = 'all';
    }
    const out = { ...g, auto, id: auto ? 'auto:' + id : id, label, short, test, keep, dist };
    if (cache) memo = out;
    return out;
  }

  /** The goal's kanji, in the order of the lessons. */
  function syllabus(g) {
    const r = resolve(g);
    const out = [];
    for (const l of KDATA.lessons) for (const k of l.kanji) if (r.test(k)) out.push(k);
    return out;
  }
  /** How many kanji a goal has (for the goal picker). */
  const size = g => syllabus(g).length;
  /** Kanji at each JLPT level (not cumulative). */
  function jlptCounts() {
    const c = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
    for (const r of Object.values(K())) c[r.j || 1]++;
    return c;
  }
  return { stored, resolve, syllabus, size, normalize, currentLevel, jlptCounts, JLPT, jname, get: () => resolve(), forget: () => { memo = null; } };
})();

/* The journey: the seven games as one trip through old Japan, and the rewards that keep a learner going.
   Shared by the app and the game pages; kept in localStorage 'kakitori:journey:v1'.

   Route: the river (Koi) → the inn kitchen → the Tōkaidō (Road) → the temple school → the castle town
   → the apothecary (Alchemy) → the teahouse (Tiles), then round again. A stop asks for STEPS level-ups
   of that game's kanji of your goal (a kanji going from level 0 to 1, 1 to 2 or 2 to 3); a game with
   nothing left to raise is passed by. Finishing a stop writes a stamp in the journal and sends you on to the next place.

   Rewards (the free version of the Store edition: each one is a locked lesson, opened for good):
     - the weekly goal: finish one stop between Monday and Sunday
     - every 7 days in a row of practice (lessons, reviews or games)
     - friends: your invite code gives a friend a lesson; their thank-you code gives you one
   With everything unlocked, the same moments earn stamps instead. No reward ever depends on a rating
   or a review. Earned lessons are kept apart from the Store's licences, and survive Reset progress.
   (Before 1.4 five friends opened every lesson; with paid plans, each friend is one lesson.) */
'use strict';
const Journey = (() => {
  const KEY = 'kakitori:journey:v1', GKEY = 'kakitori:games:v1', AKEY = 'kakitori:v1';
  const ROUTE = ['koi', 'kitchen', 'road', 'school', 'castle', 'alchemy', 'tiles'];
  const STEPS = 6, STREAK = 7;
  const PLACES = {
    koi: { title: 'The river', jp: '川辺', gift: 'a paper carp streamer', from: 'the river',
      arrive: 'Dawn on the river. A boatman is raising the carp streamers: “The lanterns over the water carry kanji of land, water and sky. Fly with the koi and catch the right ones.”' },
    kitchen: { title: 'The inn kitchen', jp: '宿の台所', gift: 'a lunch box', from: 'the inn',
      arrive: 'Downriver, the cook of a small inn waves you into her kitchen: “My regulars order by the kanji on the menu. Can you find the right jar?”' },
    road: { title: 'The Tōkaidō', jp: '東海道', gift: 'a pair of straw sandals', from: 'the Tōkaidō',
      arrive: 'With the inn’s lunch box in your bag you set off along the Tōkaidō, the old road to Kyoto. Every station on it has kanji of places and travel, of moving, carrying and making.' },
    school: { title: 'The temple school', jp: '寺子屋', gift: 'a karuta card signed by Sensei', from: 'the temple school',
      arrive: 'At the end of the road stands a temple school. Sensei is holding a karuta tournament, and needs a player who knows the kanji of study, words and the arts.' },
    castle: { title: 'The castle town', jp: '城下町', gift: 'a lord’s banner', from: 'the castle town',
      arrive: 'One of Sensei’s old pupils serves the lord of the castle town. Rival lords are claiming the old provinces, under banners of society and law, money and work.' },
    alchemy: { title: 'The apothecary', jp: '薬屋', gift: 'a paper packet of medicine', from: 'the apothecary',
      arrive: 'After the battles, the town’s apothecary has more slips than hands. Each medicine is a kanji of the body or of science, made by merging its parts on the counter.' },
    tiles: { title: 'The teahouse', jp: '茶屋', gift: 'a cup of green tea', from: 'the teahouse',
      arrive: 'Home again. The teahouse keeper sets out tiles: “Sort what you have learned, each kanji with its meaning and its reading, while the tea is warm.”' },
  };
  const LAP_LINES = ['', 'A new season on the road. ', 'The road is familiar now, and so are the kanji. ', 'Another lap of the road: time to master what you know. '];

  /* ---------------- storage ---------------- */
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
  const fresh = () => ({ v: 1, name: '', id: '', lap: 1, at: 0, stop: null, log: [], weeks: {}, earned: [], friends: [],
    invitedBy: '', thanks: '', all: false, days: {}, streaks: [], badges: {} });
  function normalize(s) {
    const o = fresh();
    if (!s || typeof s !== 'object') return o;
    for (const f of ['name', 'id', 'invitedBy', 'thanks']) if (typeof s[f] === 'string') o[f] = s[f].slice(0, 40);
    for (const f of ['lap', 'at']) if (Number.isFinite(+s[f])) o[f] = Math.max(f === 'lap' ? 1 : 0, Math.floor(+s[f]));
    o.at %= ROUTE.length;
    if (s.stop && typeof s.stop === 'object' && ROUTE.includes(s.stop.g)) o.stop = s.stop;
    if (Array.isArray(s.log)) o.log = s.log.filter(x => x && ROUTE.includes(x.g)).slice(-400);
    if (s.weeks && typeof s.weeks === 'object') o.weeks = s.weeks;
    if (Array.isArray(s.earned)) o.earned = s.earned.filter(x => x && Number.isFinite(+x.n)).map(x => ({ n: +x.n, why: String(x.why || ''), t: +x.t || 0 }));
    if (Array.isArray(s.friends)) o.friends = [...new Set(s.friends.filter(x => typeof x === 'string'))];
    o.all = !!s.all;
    if (s.days && typeof s.days === 'object') o.days = s.days;
    if (Array.isArray(s.streaks)) o.streaks = s.streaks.filter(x => typeof x === 'string');
    if (s.badges && typeof s.badges === 'object') o.badges = s.badges;
    return o;
  }
  let S = normalize(read(KEY));
  const listeners = new Set();
  function save() {
    write(KEY, S);
    syncEdition();
    listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  }
  /** Read the store again (another page may have changed it). */
  function reload() { S = normalize(read(KEY)); syncEdition(); }
  function syncEdition() {
    if (typeof Edition !== 'undefined' && Edition.setEarned) Edition.setEarned(S.earned.map(x => x.n));
  }

  /* ---------------- days, weeks and the streak ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const today = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  function weekId(t = Date.now()) {   // ISO 8601 week, Monday to Sunday, local time
    const d = new Date(t); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));        // the Thursday of this week
    const w1 = new Date(d.getFullYear(), 0, 4);
    const w = 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
    return `${d.getFullYear()}-W${pad(w)}`;
  }
  /** Days with practice: lessons and reviews (the app) or answers in a game. */
  let appSrc = null;
  /** A game page passes the app's state it has read already (reading it again each answer is slow). */
  const useApp = f => { appSrc = typeof f === 'function' ? f : null; };
  function streak(t = Date.now()) {
    const app = appSrc ? appSrc() || {} : typeof Store !== 'undefined' ? Store.state : (read(AKEY) || {});
    const days = app.days || {};
    const active = day => { const d = days[day]; return !!((d && (d.learned || d.reviews)) || S.days[day]); };
    let n = 0;
    for (let i = 0; i < 4000; i++) {
      if (active(today(t - i * 864e5))) n++;
      else if (i === 0) continue;   // today not started yet: count from yesterday
      else break;
    }
    return n;
  }
  /** A game answer today (the games call this). */
  function logPlay() {

      <ellipse cx="44" cy="68" rx="14" ry="18" fill="var(--sc-red)"/><path d="M31,60h26M30,68h28M31,76h26" stroke="var(--sc-red-2)" stroke-width="1.3"/>
      <rect x="34" y="84" width="20" height="4" rx="1.5" fill="var(--sc-wood-3)"/>
      <rect x="166" y="96" width="26" height="46" rx="2" fill="var(--sc-wood-2)"/><path d="M170,104h18M170,112h18M170,120h18" stroke="var(--sc-wood-3)" stroke-width="1.4"/>
      <path d="M0,142H220" stroke="var(--sc-stone-2)" stroke-width="3"/>
      <path class="k-steam" d="M174,88c-3,-5 3,-8 0,-13M182,86c-3,-5 3,-8 0,-13" stroke="var(--sc-stone-2)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    </svg>`;
  }

  /* ---------------- a day of service ---------------- */
  let G = null;           // the running day: guests, the active order, the clock
  let raf = 0, lastT = 0, timeScale = 1;
  /** Customers in a day: four on the first, then two more each day up to twelve (the lantern brings one more). */
  const customersFor = day => (day <= 1 ? 4 : Math.min(12, 2 + 2 * day)) + (has('lantern') ? 1 : 0);
  const inTutorial = () => S.day === 1 && !S.tips.tut;
  const progress = () => (S.today ? clamp(S.today.done / Math.max(1, S.today.n), 0, 1) : 0);
  /** Seconds a new customer waits before falling asleep: less on later days and later in the evening, more for
      orders that are harder to read. */
  function patienceFor(mode) {
    const base = S.day <= 1 ? 45 : Math.max(18, 36 - 2 * (S.day - 2));
    return base * (1 - 0.3 * progress()) * [1, 1, 1.15, 1.3, 1.4][mode] * (has('chime') ? 1.25 : 1);
  }
  /** Seconds between customers: they come faster as the evening goes on. */
  function gapNow() {
    const base = S.day <= 1 ? 6 : Math.max(3.5, 7 - 0.35 * (S.day - 1));
    return Math.max(1.8, base * (1 - 0.45 * progress()));
  }
  /** The day's three stars: { text, short, done, state: 'on' (still to win) | 'done' | 'lost' }. */
  function dayGoals(t) {
    const all = t.done >= t.n;
    return [
      { text: `Serve all ${t.n} customers`, short: `All ${t.n} served`, done: all, state: all ? 'done' : 'on' },
      { text: 'Every order right first time', short: 'Right first time', done: all && !t.wrong && !t.hints, state: t.wrong || t.hints ? 'lost' : all ? 'done' : 'on' },
      { text: 'Nobody falls asleep waiting', short: 'Nobody falls asleep', done: all && !t.late, state: t.late ? 'lost' : all ? 'done' : 'on' },
    ];
  }

  function startDay(freshDay, news = []) {
    if (freshDay || !S.today || S.today.day !== S.day) S.today = { day: S.day, n: customersFor(S.day), done: 0, earned: 0, tips: 0, perfect: 0, wrong: 0, miss: 0, hints: 0, late: 0, rush: false, words: [] };
    S.phase = 'service';
    save();
    closeScreens();
    clearRoom();
    G = { guests: [], active: null, clock: 0, lastArrival: -99, lastServe: -99, next: 1, lastK: null, msg: '', seen: new Set(), closing: 0, hud: [] };
    GC.round({ day: S.day, right: S.today.perfect, wrong: S.today.miss });   // a day picked up again counts from where it was
    renderAll();
    say(dayIntro(news));
    G.tipUntil = performance.now() + 4000;
    if (!S.today.done) later(() => { if (G && !G.over) banner('開店', S.day === 1 ? 'Open! Your first day: four customers' : `Open! Day ${S.day}: ${S.today.n} customers`); }, 250);
    loop();
  }
  /** The line under the orders as a day starts: what the stars are (once), the jars new today, or the day itself. */
  function dayIntro(news) {
    const t = S.today;
    if (inTutorial()) return 'Your first customer is coming in…';
    if (t.done) return `Day ${S.day} goes on: ${t.n - t.done} customers to go.`;
    if (!S.tips.stars) { S.tips.stars = true; save(); return `<span class="tipk">Tip</span> Three stars a day: serve everyone, get every order right first time, and let nobody fall asleep waiting.`; }
    if (news.length) return `New on the shelf today: ${news.map(k => `${jp(k)} ${esc(meaning(k))}`).join(', ')}. Look out for ${news.length > 1 ? 'them' : 'it'} in the orders.`;
    return `Day ${S.day}: ${t.n} customers. The evening gets busier, so keep the tickets moving.`;
  }
  const present = () => G ? G.guests.filter(g => g.state !== 'gone') : [];
  const waiting = () => G ? G.guests.filter(g => g.state === 'wait') : [];
  const activeGuest = () => G && G.guests.find(g => g.gid === G.active && g.state === 'wait') || null;
  /** The kanji the next guest orders: in the first lesson, the first jars in turn; then mostly the
      kanji still being learned, never one another guest is already waiting for. */
  function pickKanji() {
    const p = pool();
    if (inTutorial()) return p[clamp(S.today.done + waiting().length, 0, p.length - 1)];
    const busy = waiting().map(g => g.k);
    const free = p.filter(k => !busy.includes(k));
    return GC.pickTarget(free.length ? free : p, { rand, avoid: G.lastK });
  }
  function pickName() {
    const taken = present().map(g => g.who);
    const free = D.NAMES.map((_, i) => i).filter(i => !taken.includes(i));
    return inTutorial() ? free[0] : free[Math.floor(rand() * free.length)];
  }
  /** How an order is written, from the kanji's level: 0 the whole word, 1 a gap for the kanji (labelled
      jars), 2 a gap (bare jars), 3 kana and meaning only, 4 only said aloud (in kana). */
  function modeFor(k) {
    if (inTutorial()) return 0;
    const lv = GC.level(k);
    return lv >= 3 ? (rand() < 0.5 ? 4 : 3) : lv;
  }
  function arrive() {
    const seats = present().map(g => g.seat);
    const free = [1, 0, 2].filter(s => !seats.includes(s));
    if (!free.length) return;
    const k = pickKanji();
    if (!k) return;
    const seat = inTutorial() ? free[0] : free[Math.floor(rand() * free.length)];
    const word = wordFor(k), mode = modeFor(k), who = pickName();
    const others = pool().filter(x => !word.w.includes(x));
    const jars = shuffle([k, ...GC.distractors(k, JARS - 1, others, { rand, conf: S.conf, sound: mode === 4 })]);
    const g = { gid: G.next++, who, k, word, mode, jars, seat, pat: 1, max: patienceFor(mode), state: 'wait', t: 0, mistakes: 0, hinted: false, mood: 'wait', late: false };
    G.guests.push(g); G.lastK = k; G.lastArrival = G.clock;
    S.regs[D.NAMES[who][0]] = (S.regs[D.NAMES[who][0]] || 0) + 1;
    const t = S.today, came = t.done + waiting().length;
    Sfx.door();
    addGuest(g);
    const en = GC.opt.romaji ? `${GC.romaji(word.r)}${PHR.please[1].replace(/^o /, ' o ')}` : mode === 4 ? 'please.' : `${gloss(word)}, please.`;
    bubble(g, `${mode === 0 ? word.w : word.r}${PHR.please[0]}`, en, 2600);
    if (came === 1 || rand() < 0.3) greet();
    if (came === t.n && t.n >= 5) banner('ラストオーダー', 'Last order of the day');
    GC.say(word.r + PHR.please[0]);
    if (!activeGuest()) activate(g); else { renderRail(); if (waiting().length === 2) tip('two'); }
    renderHud();
  }
  /** g's order is the one the jars are for. */
  function activate(g) {
    G.active = g ? g.gid : null;
    renderRail(); renderBins();
    if (!g) return;
    if (inTutorial()) return say(coachText(g));
    const kind = g.hinted ? '' : ['solo', 'gap', 'bare', 'kana', 'ear'][g.mode];
    if (kind) tip(kind, g);
  }
  /** A one-line tip the first time something new happens (each once). A tip, or the day's first line, stays a few
      seconds before the next tip takes its place. */
  function tip(kind, g = null) {
    if (S.tips[kind] || inTutorial() || !G) return;
    const wait = (G.tipUntil || 0) - performance.now();
    if (wait > 0) { const day = G; setTimeout(() => { if (G === day && !G.over && (!g || g.state === 'wait')) tip(kind, g); }, wait + 50); return; }
    const text = {
      solo: () => `No jar glows now: find ${jp(g.k)} for ${jp(nameOf(g))} yourself. The quicker you serve, the bigger the tip.`,
      gap: () => `${jp(nameOf(g))}’s ticket now leaves a gap for a kanji you are learning. Which jar fills it?`,
      bare: () => 'These jars have lost their labels: read the kanji itself.',
      kana: () => 'Only the reading this time. Which kanji does the order need?',
      ear: () => 'This order is only said aloud. The speaker on the ticket says it again.',
      two: () => 'Two orders at once: tap a ticket to choose which one the jars are for.',
      doze: () => `${jp(nameOf(g))} fell asleep waiting. Nobody leaves without their order, but sleepy customers tip less.`,
    }[kind];
    if (!text) return;
    S.tips[kind] = true; save();
    say(`<span class="tipk">Tip</span> ${text()}`);
    G.tipUntil = performance.now() + 4000;
  }

  function loop() {
    cancelAnimationFrame(raf);
    lastT = performance.now();
    const frame = now => {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - lastT) / 1000) * timeScale; lastT = now;
      if (!G || S.phase !== 'service' || paused()) return;
      step(dt);
    };
    raf = requestAnimationFrame(frame);
  }
  const paused = () => !$('modal').hidden || !$('screen').hidden || document.hidden || !!document.querySelector('.gc-jm, .gc-res');
  function step(dt) {
    G.clock += dt;
    const t = S.today;
    if (G.closing) { if (G.clock >= G.closing) { endDay(); return; } }
    else if (t.done >= t.n) { G.closing = G.clock + 1.6; banner('閉店', 'Closing time'); }   // the last order is out: closing time in a moment
    const coming = t.n - t.done - waiting().length;
    const sinceArrival = G.clock - G.lastArrival, sinceServe = G.clock - G.lastServe;
    const due = inTutorial() ? !waiting().length && sinceServe >= 1.1
      : sinceArrival >= gapNow() || (!waiting().length && sinceServe >= 0.9 && sinceArrival >= 0.9);
    if (coming > 0 && present().length < SEATS && due && G.clock > 0.6) arrive();
    for (const g of G.guests) {
      g.t += dt;
      if (g.state === 'wait') {
        if (!inTutorial()) g.pat = Math.max(0, g.pat - dt / g.max);
        if (g.pat <= 0 && !g.late) doze(g);
        const want = g.pat <= 0 ? 'sleep' : g.mood === 'huh' && g.t < 1.2 ? 'huh' : g.pat < 0.3 ? 'cross' : 'wait';
        if (want !== g.mood) setMood(g, want);
      } else if (g.state === 'eat' && g.t > 2.4) {
        g.state = 'leave'; g.t = 0; setMood(g, 'happy'); bubble(g, PHR.thanks[0], PHR.thanks[2], 1500);
      } else if (g.state === 'leave' && g.t > 1.5) {
        g.state = 'gone'; removeGuest(g);
      }
    }
    G.guests = G.guests.filter(g => g.state !== 'gone');
    updatePatience();
  }
  /** A customer waited so long that they fell asleep: the third star is gone (they still get their order). */
  function doze(g) {
    g.late = true;
    S.today.late++;
    save();
    Sfx.yawn();
    const el = guestEl(g);
    if (el && !el.querySelector('.k-zz')) el.insertAdjacentHTML('beforeend', '<span class="k-zz" aria-hidden="true">z<i>z</i><b>z</b></span>');
    tip('doze', g);
    renderHud();
  }

  function tapJar(k) {
    if (!G || S.phase !== 'service' || G.closing) return;
    Sfx.unlock();
    const g = activeGuest(), el = binEl(k);
    if (!g) { say(waiting().length ? 'Tap an order ticket first.' : 'No orders yet. The next customer is on the way.'); return; }
    if (k === g.k) { serve(g, el); return; }
    g.mistakes++;
    S.today.wrong++;
    if (g.mistakes === 1) { GC.record(g.k, false); S.today.miss++; }
    GC.miss({ el });
    S.conf[g.k + '>' + k] = (S.conf[g.k + '>' + k] || 0) + 1;
    save();
    setMood(g, 'huh'); g.t = 0;
    bubble(g, PHR.huh[0], PHR.huh[2], 1300);
    if (g.mistakes >= 2 && !g.hinted) { g.hinted = true; renderRail(); renderBins(); }
    say(`<span class="bad">That jar is ${jp(k)}, ${esc(meaning(k))}.</span> ${g.hinted ? `${jp(g.word.w)} needs ${jp(g.k)}, ${esc(meaning(g.k))}: it is glowing.` : g.mode === 0 ? 'Find the jar with the kanji shown on the ticket.' : `The order is ${jp(g.word.r)}, ${esc(gloss(g.word))}.`}`);
    renderHud();
  }
  function serve(g, el) {
    const perfect = !g.mistakes && !g.hinted;
    let combo = 0;
    if (perfect) { GC.record(g.k, true); combo = GC.hit({ el }); } else Sfx.chop();
    const t = S.today;
    const price = 2 + [...g.word.w].filter(isKanji).length;
    const tipC = Math.round(price * (0.6 * g.pat + (perfect ? 0.4 : 0)) * (has('scroll') ? 1.2 : 1));
    const bonus = perfect ? Math.min(5, Math.floor(combo / 3)) : 0;
    const cat = has('cat') ? 1 : 0;
    const total = price + tipC + bonus + cat;
    g.state = 'eat'; g.t = 0;
    G.lastServe = G.clock;
    G.last = { jars: g.jars, labels: g.mode <= 1 || g.hinted };
    S.coins += total;
    t.done++; t.earned += total; t.tips += tipC + bonus; if (perfect) t.perfect++; t.words.push(g.word.w);
    const first = !S.words[g.word.w];
    S.words[g.word.w] = (S.words[g.word.w] || 0) + 1;
    if (inTutorial() && t.done >= 3) S.tips.tut = true;
    save();
    GC.count('served', 1);
    if (tipC + bonus) GC.count('tips', tipC + bonus);
    // the kanji goes into the gap, the ticket goes up to the customer, the dish comes down, the coins go to the till
    const tk = document.querySelector(`.ticket[data-gid="${g.gid}"]`);
    const ghost = tk && !reduceMotion() ? ghostTicket(tk, g) : null;
    if (ghost) flyKanji(el, ghost.querySelector('.dish .gap') || ghost.querySelector('.dish .k') || ghost.querySelector('.dish') || ghost, g.k, () => sendTicket(ghost, g));
    later(() => { if (!guestEl(g)) return; placePlate(g); setMood(g, 'eat'); bubble(g, perfect ? PHR.tasty[0] : PHR.eat[0], perfect ? PHR.tasty[2] : PHR.eat[2], 1800); }, 520);
    later(() => coinBurst(g, total), 600);
    const parts = [`${price} for the order`, tipC ? `${tipC} tip` : '', bonus ? `${bonus} combo` : '', cat ? '1 from the cat' : ''].filter(Boolean);
    say(`${jp(g.word.w)}, ${esc(gloss(g.word))}, for ${jp(nameOf(g))}: <b class="gain">+${total}</b> <span class="muted brk">(${parts.join(', ')})</span>${perfect ? ' Right first time!' : ''}${first ? ' <span class="brk">A new word for your menu book.</span>' : ''}`);
    G.tipUntil = Math.max(G.tipUntil || 0, performance.now() + 1600);   // the line above is read before a tip takes its place

    if (!t.rush && t.n >= 6 && t.done >= Math.ceil(t.n / 2) && t.done < t.n) { t.rush = true; save(); banner('夕方', 'The evening rush: customers come faster'); }
  }
  function hintFor(gid) {
    const g = G && G.guests.find(x => x.gid === gid && x.state === 'wait');
    if (!g || g.hinted) return;
    g.hinted = true; S.today.hints++;
    save();
    GC.miss({ sound: false });   // the combo ends here: this order will not count as right
    Sfx.soft();
    activate(g);
    say(`${jp(g.word.w)}, ${jp(g.word.r)}: ${esc(gloss(g.word))}. It needs ${jp(g.k)}, ${esc(meaning(g.k))}: the jar is glowing.`);
    renderHud();
  }
  function endDay() {
    if (!G || S.phase !== 'service') return;
    cancelAnimationFrame(raf);
    G.over = true;
    const t = S.today;
    growJars(t);
    S.phase = 'market';
    save();
    const goals = dayGoals(t);
    GC.finish({
      title: goals.every(x => x.done) ? 'A perfect day' : 'Closing time',
      sub: `Day ${S.day}`,
      goals: goals.map(x => ({ text: x.text, done: x.done })),
      score: t.earned, scoreText: 'coins earned',
      stats: [['Right first time', `${t.perfect} of ${t.done}`], ['Tips', String(t.tips)]],
      primary: { label: 'Next day', run: afterDay },
      secondary: { label: 'Back', run: () => { endScene(); showHub(); } },
      note: closingNote(t),
    });
  }
  /** What closing time adds: the words served, and the jars that come tomorrow (or what brings the next ones). */
  function closingNote(t) {
    const counts = {};
    for (const w of t.words) counts[w] = (counts[w] || 0) + 1;
    const words = Object.entries(counts).slice(0, 10).map(([w, n]) => `<span><span class="g" lang="ja">${esc(w)}</span>${n > 1 ? `×${n}` : ''}</span>`).join('');
    const news = newcomers();
    return `<div class="k-close">${words ? `<div class="chipsrow" aria-label="Words served today">${words}</div>` : ''}
      ${news.length ? `<p class="newjars">New jars tomorrow: ${news.map(k => `${jp(k)} ${esc(meaning(k))}`).join(' · ')}</p>` : nextNote()}</div>`;
  }
  /** After closing time: the market when there is something to buy, else the next day straight away. */
  function afterDay() {
    endScene();
    if (D.DECOR.some(x => !has(x.id) && S.coins >= x.price)) market();

  }
  /** The day's scene is put away (after closing time). */
  function endScene() { cancelAnimationFrame(raf); G = null; clearRoom(); renderAll(); }

  /* ---------------- the dining room ---------------- */
  const seatX = s => `${((s * 2 + 1) / 6) * 100}%`;
  const guestEl = g => $('guests').querySelector(`.guest[data-gid="${g.gid}"]`);
  function addGuest(g) {
    const el = document.createElement('div');
    el.className = 'guest' + (reduceMotion() ? '' : ' in');
    el.dataset.gid = g.gid;
    el.style.left = seatX(g.seat);
    el.innerHTML = bust(D.NAMES[g.who][3], 'wait');
    $('guests').appendChild(el);
    const card = document.createElement('div');
    card.className = 'namecard'; card.dataset.gid = g.gid; card.style.left = seatX(g.seat);
    const regular = (S.regs[D.NAMES[g.who][0]] || 0) > REGULAR;
    if (regular) card.classList.add('reg');
    card.innerHTML = `${regular ? '<i aria-hidden="true">★</i>' : ''}<span lang="ja">${D.NAMES[g.who][0]}さん</span><small>${D.NAMES[g.who][2]}${regular ? ', a regular' : ''}</small>`;
    $('names').appendChild(card);
  }
  function setMood(g, mood) {
    g.mood = mood;
    const el = guestEl(g);
    if (!el) return;
    const svg = el.querySelector('svg');
    if (svg) svg.outerHTML = bust(D.NAMES[g.who][3], mood);

  }
  function removeGuest(g) {
    const el = guestEl(g), card = $('names').querySelector(`.namecard[data-gid="${g.gid}"]`), plate = $('plates').querySelector(`.plate[data-gid="${g.gid}"]`);
    if (el) { el.classList.add('out'); setTimeout(() => el.remove(), reduceMotion() ? 0 : 600); }
    if (card) card.remove();
    if (plate) { plate.classList.add('out'); setTimeout(() => plate.remove(), reduceMotion() ? 0 : 400); }
  }
  function placePlate(g) {
    const p = document.createElement('div');
    p.className = 'plate' + (reduceMotion() ? '' : ' in'); p.dataset.gid = g.gid; p.style.left = seatX(g.seat);
    p.innerHTML = wordDish(g.word.w);
    $('plates').appendChild(p);
  }
  /* Speech bubbles sit over the speaker but stay inside the room; a new bubble takes the place of any it would cover. */
  const crosses = (a, b) => { const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(); return ra.left < rb.right + 6 && rb.left < ra.right + 6 && ra.top < rb.bottom && rb.top < ra.bottom; };
  function bubble(g, jpText, en, ms) {
    const host = $('bubbles');
    host.querySelectorAll(`.bubble[data-gid="${g.gid}"]`).forEach(e => e.remove());
    const b = document.createElement('div');
    b.className = 'bubble' + (jpText === PHR.huh[0] ? ' huh' : '');
    b.dataset.gid = g.gid;
    b.innerHTML = `<b lang="ja">${jpText}</b><span>${esc(en)}</span>`;
    host.appendChild(b);
    const W = $('dining').clientWidth || 1, w = b.offsetWidth, cx = W * (g.seat * 2 + 1) / 6;
    const x = clamp(cx, w / 2 + 6, Math.max(w / 2 + 6, W - w / 2 - 6));
    b.style.left = `${(100 * x / W).toFixed(2)}%`;
    b.style.setProperty('--tail', `${Math.round(cx - x)}px`);
    for (const o of host.querySelectorAll('.bubble')) if (o !== b && crosses(o, b)) o.remove();
    setTimeout(() => b.remove(), ms);
  }
  function greet() {
    const host = $('bubbles'), b = document.createElement('div');
    b.className = 'bubble greet';
    b.innerHTML = `<b lang="ja">${PHR.welcome[0]}</b><span>${PHR.welcome[2]} (the cook)</span>`;
    host.appendChild(b);
    if (!b.offsetWidth || [...host.querySelectorAll('.bubble:not(.greet)')].some(o => crosses(o, b))) { b.remove(); return; }
    setTimeout(() => b.remove(), 1800);
  }
  /** A sign that drops in over the room for a moment: the evening rush, the last order. */
  function banner(jpText, en) {
    const el = $('banner');
    el.innerHTML = `<b lang="ja">${jpText}</b><span>${esc(en)}</span>`;
    el.hidden = false;
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    Sfx.bell();
    clearTimeout(banner.t);
    banner.t = setTimeout(() => { el.classList.remove('on'); el.hidden = true; }, 2200);
  }
  let roomSize = '';
  function renderRoom(force = false) {
    const d = $('dining'), W = d.clientWidth, H = d.clientHeight;
    const key = `${W}x${H}:${S.decor.join(',')}`;

    $('room').innerHTML = roomSvg(W, H);
    $('deco').innerHTML = ON_COUNTER.filter(([id]) => has(id)).map(([id, x]) => `<div class="cdeco" style="left:${x}%">${decoSvg[id]}</div>`).join('');
    d.classList.toggle('signed', has('sign'));

  function renderTags() {
    const shown = Object.keys(S.words).slice(-6);

  /* ---------------- the orders, the jars, the day's bar ---------------- */
  /** The word as the ticket writes it: the whole word (mode 0, or after a hint), or with a gap for the kanji. */
  function wordHtml(g) {
    if (g.mode === 0 || g.hinted) return [...g.word.w].map(c => c === g.k ? `<span class="k">${c}</span>` : esc(c)).join('');

  function ticketHtml(g) {
    const [nm, , , look] = D.NAMES[g.who];

    const ro = GC.opt.romaji ? esc(GC.romaji(g.word.r)) : '';
    const top = kanaOnly ? ro : `<span lang="ja">${esc(g.word.r)}</span>`;
    const tn = kanaOnly ? Math.max(4, GC.romaji(g.word.r).length * 0.56) : Math.max(4, [...g.word.r].length * 1.04);   // its width in ems
    const n = [...(kanaOnly ? g.word.r : g.word.w)].length;
    const main = `<span class="dish${ear ? ' ear' : ''}" lang="ja" style="--n:${n}">${kanaOnly ? esc(g.word.r) : wordHtml(g)}</span>`;
    const sub = ear ? 'said aloud' : esc(gloss(g.word));
    const help = g.hinted ? '' : `<button class="q" type="button" data-act="hint" data-gid="${g.gid}" aria-label="Which kanji does ${esc(g.word.r)} need?" title="Show the kanji">?</button>`;
    const hear = ear ? GC.sayBtn(g.word.r, GC.romaji(g.word.r)) : '';

      <span class="who"><b lang="ja">${nm}さん</b></span>${hear}${help}

  }

    if (n === 0) return `${jp(nameOf(g))} would like ${jp(g.word.w)}, ${esc(gloss(g.word))}. Tap the jar with the same kanji, ${jp(g.k)}.`;
    if (n === 1) return `Now ${jp(g.word.w)}, ${esc(gloss(g.word))}. Find the jar ${jp(g.k)}.`;
    return `${jp(g.word.w)}: ${esc(gloss(g.word))}. Once you know a kanji, its tickets leave a gap for you to fill from memory.`;
  }
  function say(html) { if (G) G.msg = html; const m = $('msg'); if (m) m.innerHTML = html ? `<span class="msgt">${html}</span>` : ''; }
  const binEl = k => $('bins').querySelector(`.bin[data-k="${k}"]`);
  function renderBins() {
    const g = activeGuest(), el = $('bins');

      <span class="lab"><span class="g" lang="ja">${k}</span>${labels ? `<span class="m">${esc(meaning(k))}</span>` : '<span class="m0"></span>'}</span><kbd class="key" aria-hidden="true">${i + 1}</kbd></button>`).join('');

  function renderHud() {

  /* ---------------- little animations ---------------- */
  function rel(el, fy = 0.5) { const a = el.getBoundingClientRect(), app = $('app').getBoundingClientRect(); return [a.left + a.width / 2 - app.left, a.top + a.height * fy - app.top]; }
  /** A copy of a served ticket, left where it was while the rail moves on. */
  function ghostTicket(tk) {
    const a = tk.getBoundingClientRect(), app = $('app').getBoundingClientRect();
    const c = tk.cloneNode(true);
    c.classList.remove('fresh', 'mid', 'low', 'asleep');

    $('fx').appendChild(c);
    return c;
  }
  /** The kanji flies from its jar into the ticket's gap. */
  function flyKanji(from, to, k, then) {
    if (!from || !to) { if (then) then(); return; }
    const [x0, y0] = rel(from.querySelector('.g') || from), [x1, y1] = rel(to);
    const e = document.createElement('div');
    e.className = 'fly'; e.lang = 'ja'; e.textContent = k; e.style.left = x0 + 'px'; e.style.top = y0 + 'px';
    $('fx').appendChild(e);
    const done = () => {
      e.remove();
      const gap = to.classList && to.classList.contains('gap') ? to : null;
      if (gap) { gap.outerHTML = `<span class="k filled">${k}</span>`; }
      if (then) then();
    };
    e.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${(x1 - x0) / 2}px, ${(y1 - y0) / 2 - 50}px) scale(1.15)`, offset: 0.5 }, { transform: `translate(${x1 - x0}px, ${y1 - y0}px) scale(.85)` }],
      { duration: 330, easing: 'cubic-bezier(.4,.1,.3,1)' }).finished.then(done, done);
  }
  /** The filled ticket goes up to its customer and the plate comes down. */
  function sendTicket(ghost, g) {
    const guest = guestEl(g);
    if (!guest) { ghost.remove(); return; }
    const [x0, y0] = rel(ghost), [x1, y1] = rel(guest, 0.75);
    ghost.classList.add('done');
    ghost.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-6px) scale(1.04)', opacity: 1, offset: 0.25 }, { transform: `translate(${x1 - x0}px, ${y1 - y0}px) scale(.35) rotate(-6deg)`, opacity: 0 }],
      { duration: 520, easing: 'cubic-bezier(.5,0,.4,1)' }).finished.then(() => ghost.remove(), () => ghost.remove());
  }
  /** Coins from the customer to the till (the coins in the bar), with what they paid. */
  function coinBurst(g, total) {
    const host = $('fx'), guest = guestEl(g), pill = $('coins');
    if (!guest) { renderTop(); return; }
    const [x0, y0] = rel(guest, 0.3);
    const p = document.createElement('div');
    p.className = 'plus'; p.innerHTML = `${coinSvg}+${total}`; p.style.left = x0 + 'px'; p.style.top = y0 + 'px';
    host.appendChild(p); setTimeout(() => p.remove(), 1200);
    if (reduceMotion() || !pill.offsetParent) { renderTop(); GC.sfx.coin(); return; }
    const [x1, y1] = rel(pill);
    const n = clamp(Math.round(total / 2), 3, 8);
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'coinfly'; c.innerHTML = coinSvg; c.style.left = x0 + 'px'; c.style.top = y0 + 'px';
      host.appendChild(c);
      const spread = (i - (n - 1) / 2) * 16;
      c.animate([{ transform: 'translate(0,0) scale(.6)', opacity: 0 }, { transform: `translate(${spread}px, -36px) scale(1)`, opacity: 1, offset: 0.25 }, { transform: `translate(${x1 - x0}px, ${y1 - y0}px) scale(.8)`, opacity: 0.9 }],
        { duration: 760 + i * 60, delay: i * 30, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'backwards' }).finished.then(() => {
        c.remove();
        if (i === 0) { renderTop(); GC.sfx.coin(); const b = pill.closest('.pill'); if (b) b.animate([{ transform: 'scale(1.18)' }, { transform: 'none' }], { duration: 260, easing: 'ease-out' }); }
      }, () => c.remove());
    }
  }

  /* ---------------- pages: the welcome hub, new jars, the market, the menu book, settings ---------------- */
  let view = '', fromPlay = false;

  /** Meet new jars, one card each, then go on. */

  /** The big button: open the shop, continue the day, or open for the next one. */

    } else {
      body = `<div class="cards">${D.NAMES.map(([nm, kana, ro, look]) => S.regs[nm] ? `<div class="card2 pr"><div class="face">${bust(look, 'happy').replace('viewBox="0 0 100 112"', 'viewBox="17 9 66 66"')}</div><span class="g" lang="ja">${nm}さん</span><span lang="ja">${kana}さん</span><span class="muted">${esc(ro)}-san · ${S.regs[nm]} visit${S.regs[nm] === 1 ? '' : 's'}</span>${S.regs[nm] >= REGULAR ? '<span class="pill gold">★ A regular</span>' : ''}</div>` : '<div class="card2 pr locked"><span class="g">？</span><span class="muted">Not met yet</span></div>').join('')}</div>
        <p class="muted">Their family names use kanji from the other games: ${jp('山')} mountain, ${jp('田')} rice field, ${jp('川')} river, ${jp('森')} forest.</p>`;
    }
    show(`<div class="panel kpage">
      <div class="row between"><div><p class="eyebrow">Menu book</p><h2>${c.met} of ${c.available} jars on the shelf</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} ${fromPlay ? 'Back to the kitchen' : 'Back'}</button></div>
      <div class="tabs" role="tablist">${tabBtn('k', 'Jars', c.met, c.available)}${tabBtn('w', 'Words', words.length)}${tabBtn('r', 'Regulars', Object.keys(S.regs).length, D.NAMES.length)}</div>
      ${tab === 'k' ? '<p class="muted">Each dot is a level. Level 1: tickets leave a gap for the kanji. Level 2: the jars lose their labels. Level 3: orders come in kana, or only said aloud. Kanji you have written in your lessons come to the shelf first.</p>' : ''}
      ${body}</div>`, 'book');
  }
  function settings(confirm = false) {
    const sw = (k, on, label, note) => `<div class="setting"><div class="lbl">${label}<span>${note}</span></div><button class="switch" type="button" role="switch" id="set-${k}" aria-checked="${on}" data-act="toggle" data-key="${k}" aria-label="${label}"></button></div>`;
    show(`<div class="panel kpage" style="gap:6px">
      <div class="row between"><div><p class="eyebrow">Settings</p><h2>The kitchen</h2></div><button class="btn quiet" type="button" data-act="back">${ICON.back} Back</button></div>
      ${sw('sound', GC.opt.sound, 'Sound', 'Chimes, the door bell and coins. The same switch as in Learn Kanji.')}
      ${sw('voice', GC.opt.voice, 'Read aloud', GC.Voice.ok ? 'Customers say their order in Japanese. The same switch as in Learn Kanji.' : 'No Japanese voice found on this device yet.')}
      ${sw('romaji', GC.opt.romaji, 'Show romaji', 'Readings in Latin letters beside the kana, in the lessons and every game.')}
      ${GC.themeRow()}
      <div class="setting"><div class="lbl">Start over<span>Clears your days, coins and shop, and what you have learned of this game’s kanji. Your lessons and other games keep theirs.</span></div>
        ${confirm ? '<div class="row"><button class="btn danger" type="button" data-act="reset-yes">Clear Kanji Kitchen</button><button class="btn quiet" type="button" data-act="settings">Keep it</button></div>' : '<button class="btn" type="button" data-act="reset">Start over</button>'}</div>
      <p class="muted" style="font-size:14px">Progress is saved on this device with your Learn Kanji progress, and goes into its backups.</p></div>`, 'settings');
  }
  /** Back from a page: to the day that is on, or to the welcome hub. */
  function back() {
    if (fromPlay && G && S.phase === 'service' && !G.over) { closeScreens(); return; }
    showHub();
  }

  /* ---------------- input ---------------- */
  async function unlock() {
    await GC.unlock();
    if (view === 'book') book(); else if (view === 'market') market(); else if (view === 'hub') showHub();
  }
  function pickTicket(gid) {
    const g = G && G.guests.find(x => x.gid === gid && x.state === 'wait');
    if (!g || G.active === gid) return;
    GC.sfx.tap();
    activate(g);
    const tk = document.querySelector(`.ticket[data-gid="${gid}"]`);
    if (tk && document.activeElement && document.activeElement.closest && document.activeElement.closest('.ticket')) tk.focus({ preventScroll: true });
  }
  function onClick(e) {
    if (e.target.closest('#gc-play')) return play();
    const bin = e.target.closest('#bins .bin');
    if (bin) { if (!bin.disabled) tapJar(bin.dataset.k); return; }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    switch (b.dataset.act) {
      case 'pick': return pickTicket(+b.dataset.gid);
      case 'hint': e.stopPropagation(); return hintFor(+b.dataset.gid);
      case 'jar': return jarCard(b.dataset.k, null);
      case 'buydecor': return buyDecor(b.dataset.id);
      case 'play': return play();
      case 'hub': return showHub();
      case 'market': return market();
      case 'about': return showHub({ howto: true });
      case 'home': return GC.back();
      case 'unlock': return unlock();
      case 'book': return book();
      case 'tab': return book(b.dataset.t);
      case 'settings': return settings();
      case 'back': return back();
      case 'toggle': { const k = b.dataset.key; GC.opt[k] = !GC.opt[k]; b.setAttribute('aria-checked', String(GC.opt[k])); return; }
      case 'reset': return settings(true);
      case 'reset-yes': { GC.resetTheme(); S = fresh(); save(); cancelAnimationFrame(raf); G = null; clearRoom(); renderAll(); showHub(); return; }
    }
  }
  function onKey(e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    if (document.querySelector('.gc-res, .gc-jm')) return;   // the results and the journey's cards have their own keys
    if (e.key === 'Escape') {
      if (!$('modal').hidden) { const go = $('m-go'); if (go) go.click(); }
      else if (!$('screen').hidden && view !== 'hub') back();
      else if (!$('screen').hidden && view === 'hub' && G && S.phase === 'service' && !G.over) play();
      else if ($('screen').hidden && G && S.phase === 'service' && !G.over) showHub();   // a pause
      return;
    }
    if (!$('modal').hidden || !$('screen').hidden || !G || S.phase !== 'service') return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (/^[1-6]$/.test(e.key)) {
      const bins = [...$('bins').querySelectorAll('.bin')], b = bins[+e.key - 1];
      if (b && !b.disabled) { e.preventDefault(); tapJar(b.dataset.k); }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const ws = waiting().sort((a, b) => a.seat - b.seat);
      if (ws.length < 2) return;
      e.preventDefault();
      const i = ws.findIndex(g => g.gid === G.active);
      pickTicket(ws[(i + (e.key === 'ArrowRight' ? 1 : ws.length - 1)) % ws.length].gid);
      return;
    }
    if (e.key === '?' || e.key === 'h' || e.key === 'H') { const g = activeGuest(); if (g) { e.preventDefault(); hintFor(g.gid); } return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.ticket')) { e.preventDefault(); e.target.closest('.ticket').click(); }
  }

  function start() {
    S = normalize(GC.state);
    save();
    GC.setup({
      missions: { served: { text: n => `Serve ${n} customers`, tiers: [10, 25, 50, 90, 140, 200, 300], counter: 'served' } },
      dailies: [
        { id: 'served15', text: 'Serve 15 customers today', count: 'served', goal: 15 },
        { id: 'tips25', text: 'Earn 25 coins in tips today', count: 'tips', goal: 25 },
      ],
    });
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    const barh = () => document.documentElement.style.setProperty('--barh', document.querySelector('.bar').offsetHeight + 'px');
    barh();
    window.addEventListener('resize', barh);
    if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(() => renderRoom())).observe($('dining'));
    else window.addEventListener('resize', () => renderRoom());
    document.addEventListener('gc-theme', () => renderRoom(true));
    if (typeof Edition !== 'undefined') Edition.onChange(() => { if (view === 'book') book(); else if (view === 'market') market(); else if (view === 'hub') showHub(); });
    try { document.fonts.load('600 30px "Klee One"', GC.THEME.slice(0, 40).join('')); } catch (e) { /* fallback fonts */ }
    renderAll();
    showHub();
  }

  return {
    start,
    test: {
      get S() { return S; }, get G() { return G; }, get view() { return view; }, normalize, wordFor, tapJar, wordDish, dayGoals,
      pick(gid) { const g = G && G.guests.find(x => x.gid === gid && x.state === 'wait'); if (g) activate(g); },
      serveNow(gid) { const g = G && G.guests.find(x => x.gid === gid && x.state === 'wait'); if (g) { if (G.active !== gid) activate(g); tapJar(g.k); } },
      wrong(gid) { const g = G && G.guests.find(x => x.gid === gid && x.state === 'wait'); if (g) { if (G.active !== gid) activate(g); tapJar(g.jars.find(k => k !== g.k)); } },
      timescale(n) { timeScale = n; }, seed(f) { rand = f; },
      pace(done) { const t = S.today, d0 = t.done; t.done = done; const r = { gap: gapNow(), patience: patienceFor(0) }; t.done = d0; return r; },
      endDay() { if (!G) return; S.today.done = S.today.n; for (const g of G.guests) { g.state = 'gone'; removeGuest(g); } G.guests = []; endDay(); },
    },
  };
})();

Kitchen.start();

</script>

</body>
